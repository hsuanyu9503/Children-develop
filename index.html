/* v2: chapter multiselection and review filters */
.choice-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:12px 0 9px}
.chapter-choice{display:flex;gap:8px;align-items:flex-start;cursor:pointer;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:67px}
.chapter-choice.checked{background:var(--accent-soft);border-color:var(--accent)}
.chapter-choice input{accent-color:var(--accent);margin-top:4px;width:16px;height:16px;flex-shrink:0}
.chapter-choice strong{display:block;font-size:12px;line-height:1.5}
.chapter-choice small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.chapter-choice:hover{border-color:var(--accent)}
.quiz-selection-note{font-size:12px;color:var(--muted);margin:6px 0 12px}
.selection-tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.selection-tools button{font-size:12px}
.choice-filter{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin:14px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.choice-filter input{accent-color:var(--accent)}
.choice-filter label{cursor:pointer}
.choice-filter small{color:var(--muted)}
.notice-wait{margin:12px 0;padding:14px 17px;border-radius:11px;background:var(--surface2);border:1px dashed var(--line);color:var(--muted)}
@media(max-width:1150px){.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){.choice-grid{grid-template-columns:1fr}}

/* Macaron theme: content and exam logic unchanged */
body,.sidebar,.topbar,.card,.chapter-card,.btn,.nav-item{transition: background .2s ease,box-shadow .2s ease,border-color .2s ease,transform .2s ease}
.chapter-card:hover{transform:translateY(-3px)}
.btn:hover{transform:translateY(-1px)}
.chapter-card .chap-num{font-size:15px;letter-spacing:-.2px}

window.CHAPTERS=[{"id":"1","label":"第一章","title":"人類發展的研究","desc":"生命全程、發展因素與原則","icon":"◈","status":"已整理","source":"第一章及教師檢定考試.pptx／第一章人類發展的研究.pdf"},{"id":"2","label":"第二章","title":"理論與研究","desc":"主要發展理論與研究方法","icon":"◎","status":"已整理","source":"第二章理論與研究.pptx／第二章理論與研究.pdf"},{"id":"3-4","label":"第三、四章","title":"新生命的形成／三歲前的生理發展","desc":"產前影響、出生、腦神經與動作發展","icon":"❋","status":"已整理","source":"第三、四章課堂投影片與學習單"},{"id":"5","label":"第五章","title":"三歲前的認知發展","desc":"感覺動作、語言發展與習得","icon":"✳","status":"已整理","source":"第五章三歲前的認知發展.pptx／第五章3歲前的認知發展.pdf"},{"id":"6","label":"第六章","title":"三歲前的心理社會發展","desc":"情緒、氣質、自我、依附、自律與兒少保護","icon":"♥","status":"已整理","source":"第六章圖片筆記 CH06-NOTE 01～16（使用者提供）；兒少保護法規另核全國法規資料庫（2026-10-17）"},{"id":"7","label":"第七章","title":"兒童期早期的發展（3～6歲）","desc":"神經與動作成熟、前運思期、守恆、語言與教育支持","icon":"✿","status":"已整理","source":"第七章圖片筆記 CH07-NOTE 01～16（使用者提供）"},{"id":"8","label":"第八章","title":"兒童期早期的心理社會發展（3～6歲）","desc":"自我、性別、遊戲、同儕、親職、攻擊與校園保護","icon":"♥","status":"已整理","source":"第八章圖片筆記 CH08-NOTE 01～31（使用者提供），法規另核教育部主管法規資料庫（2026-10-27）"},{"id":"9","label":"第九章","title":"後續教材待補","desc":"待提供第九章教材後建立筆記與正式章節對照","icon":"◇","status":"待補教材","source":"待補"},{"id":"10","label":"第十章","title":"後續教材待補","desc":"待提供第十章教材後建立筆記與正式章節對照","icon":"◇","status":"待補教材","source":"待補"},{"id":"11-12","label":"第十一、十二章","title":"後續教材待補","desc":"待提供第十一及十二章教材後建立筆記與正式章節對照","icon":"◇","status":"待補教材","source":"待補"}];

window.NOTES=[{"id":"1-01","chapter":"1","title":"人類發展的三大領域","lead":"人類發展研究一生的變化與穩定模式，三大領域彼此交互影響。","points":["身體發展：身體、腦與神經、感覺、動作及健康。","認知發展：學習、注意、記憶、語言、思考、推理與創造力。","心理社會發展：情緒、人格與人際關係。"],"tags":["發展領域","身體","認知","心理社會"],"trap":"三大領域是分析工具，並非互不相干。","source":"教師課堂投影片","related":[]},{"id":"1-02","chapter":"1","title":"生命全程的八個時期","lead":"發展貫穿一生，分期有助研究，但年齡界線也受到社會文化影響。","points":["出生前期：受孕至出生；重要的身體發育階段。","嬰幼兒期：出生至約3歲；感覺動作、語言與依附迅速成長。","兒童期早期：約3–6歲；象徵思考與語言繼續發展。","兒童期中期：約6–11歲；具體邏輯與自我概念逐漸成熟。","青春期：約11–20歲；生理成熟、抽象推理與認同探索。","成人期早期／中期／晚期：依課堂教材約20–40、40–65、65歲以上。"],"tags":["八時期","生命全程","發展階段"],"trap":"這裡使用老師投影片的約略年齡；學者或教材分期可能不同。","source":"教師課堂投影片","related":[]},{"id":"1-03","chapter":"1","title":"遺傳、環境與成熟","lead":"發展並非由單一因素決定；先天條件與生活經驗交互作用。","points":["遺傳：從生物親代獲得的先天性狀與傾向。","成熟：生理與行為依一定發展順序逐漸展開的歷程。","環境：家庭、社會文化、營養、教育與重要生命事件等經驗。","常態性影響：多數同年齡或同世代共享的發展影響。","非常態性影響：非預期且對個人影響顯著的特殊事件。"],"tags":["遺傳","環境","成熟","常態性","非常態性"],"trap":"「常態性」不是好或正常，「非常態性」也不是有問題的同義詞。","source":"教師課堂投影片","related":[]},{"id":"1-04","chapter":"1","title":"關鍵期、敏感期與可塑性","lead":"同樣的經驗，在不同時期可能有不同的發展效果。","points":["關鍵期：特定時段內是否出現某些事件，會對特定發展結果造成深刻影響。","敏感期：對特定經驗較容易產生反應的時期，通常不代表錯過就完全無法學習。","可塑性：表現與發展可因經驗、練習或支持而改變。","銘印是動物研究中討論時間敏感性的重要例子；Genie 案例需同時考慮剝奪、創傷等混雜因素。"],"tags":["關鍵期","敏感期","可塑性","銘印","Genie"],"trap":"不可單憑極端個案認定人類語言有絕對不可逆的年齡門檻。","source":"教師課堂投影片","related":[]},{"id":"1-05","chapter":"1","title":"Baltes：生命全程發展七原則","lead":"生命全程發展觀點強調發展是一輩子的、多重方向且具環境脈絡。","points":["終生性：發展不僅發生在兒童期。","多向度：生理、認知、心理社會領域共同構成發展。","多方向性：某些能力可能增加，另一些能力可能減少。","生物與文化的相對影響會隨生命階段改變。","發展涉及資源配置：成長、維持與恢復，以及調節失落。","可塑性：在一定範圍內仍有改變可能。","歷史文化脈絡：時代與社會條件會形塑發展。"],"tags":["Baltes","生命全程","七原則"],"trap":"不要將多向度（不同領域）與多方向性（增長及衰退並存）混淆。","source":"教師課堂投影片","related":[]},{"id":"2-01","chapter":"2","title":"發展理論的基本爭點","lead":"各理論主要回答：發展由誰驅動？如何改變？","points":["遺傳與環境：發展差異來自哪些因素。","主動與被動：兒童是否主動建構與選擇經驗。","連續與階段：逐漸量變，或具有質的差異之發展階段。","機械論較重刺激反應、被動與量變；有機論較重主動組織與質變。"],"tags":["理論爭點","主動被動","連續階段"],"trap":"理論間並非非黑即白，混合立場需依具體命題判讀。","source":"教師課堂投影片","related":[]},{"id":"2-02","chapter":"2","title":"Freud：人格結構與性心理發展","lead":"心理分析論強調潛意識動機、內在衝突與早期經驗。","points":["本我：追求本能需求的滿足。自我：在現實條件下調節需求。超我：內化的道德標準與良知。","意識、前意識、潛意識是描述心理意識層次的概念，不等同三種人格結構。","性心理發展分期：口腔期、肛門期、性器期、潛伏期、生殖期。","固著是 Freud 理論對早期衝突未適當解決之後續影響的解釋。"],"tags":["Freud","佛洛依德","本我","自我","超我","固著"],"trap":"此為歷史性理論，部分性別相關主張受時代背景限制，不可直接當代科學事實。","source":"教師課堂投影片","related":[]},{"id":"2-03","chapter":"2","title":"防衛機制辨析","lead":"自我面對焦慮與衝突時，可能透過不同方式保護自身。","points":["壓抑：將難以接受的想法排除在意識之外。否認：拒絕承認威脅性的現實。","投射：把自己的不被接受想法歸給他人。合理化：為行為提出看似合理的解釋。","反向作用：以相反的態度或行為掩蓋難以接受的衝動。","退化：回到較早期的行為方式。替代：將情緒轉移到較安全的對象。","昇華：將衝動轉化為社會較能接納的活動。補償：在其他方面努力彌補不足。"],"tags":["防衛機制","投射","合理化","反向作用","替代"],"trap":"「替代」是情緒或衝動移往別的對象；「昇華」是轉化為建設性活動。","source":"教師課堂投影片","related":[]},{"id":"2-04","chapter":"2","title":"Erikson：心理社會發展","lead":"人格在一生中持續發展，每個階段都存在待整合的心理社會課題。","points":["嬰兒：信任對不信任。","幼兒：自主對羞愧懷疑。","學前：主動（自動自發）對罪惡感。","學齡：勤奮對自卑；重要情境為學習表現與能力感。","青少年：自我認同對角色混淆；其餘成人期仍有發展任務。"],"tags":["Erikson","艾瑞克森","勤奮對自卑","心理社會"],"trap":"Freud 偏重性心理與早期經驗，Erikson 強調社會文化且發展貫穿一生。","source":"教師課堂投影片","related":[]},{"id":"2-05","chapter":"2","title":"古典制約：Pavlov","lead":"原本中性的刺激，經與能引發反應的刺激反覆配對後，也能引發反應。","points":["US／UCS（非制約刺激）→ UR／UCR（非制約反應）。","原中性刺激與非制約刺激配對，形成 CS（制約刺激）→ CR（制約反應）。","常見現象：類化、辨別、消弱及自發恢復。","關注刺激與非自主／反應性行為的連結。"],"tags":["Pavlov","古典制約","制約刺激","類化"],"trap":"古典制約著重刺激聯結；操作制約著重行為的後果。","source":"教師課堂投影片","related":[]},{"id":"2-06","chapter":"2","title":"操作制約：Skinner","lead":"行為後果改變未來同一行為出現的可能性。","points":["正增強：加入喜好刺激，使行為增加。負增強：移除嫌惡刺激，使行為增加。","正懲罰（施予式）：加入嫌惡後果，使行為減少。負懲罰（剝奪式）：移除喜好刺激，使行為減少。","初期可連續增強建立行為，維持階段可採間歇增強。","行為塑造：逐步增強接近目標的反應；代幣制度運用象徵增強物。"],"tags":["Skinner","操作制約","正增強","負增強","懲罰","增強時制"],"trap":"正／負指刺激的加入或移除，增強／懲罰指行為增加或減少。","source":"教師課堂投影片","related":[]},{"id":"2-07","chapter":"2","title":"Bandura：社會學習與交互決定論","lead":"個體可透過觀察他人學習，行為並非只有親自受獎懲才會改變。","points":["觀察與模仿：榜樣行為提供學習訊息。","替代增強／懲罰：觀察他人的後果，改變自身是否表現該行為的可能性。","交互決定論：個人、行為與環境三者相互影響。","班度拉以攻擊玩偶研究展示示範行為與結果對兒童表現的影響。"],"tags":["Bandura","班度拉","觀察學習","替代增強","交互決定"],"trap":"學習到行為與實際表現行為可分開看待。","source":"教師課堂投影片","related":[]},{"id":"2-08","chapter":"2","title":"Piaget：認知發展機制","lead":"兒童透過主動建構認知基模、同化與調適理解世界。","points":["基模：用來理解和行動的認知結構。","同化：以既有基模理解新經驗。調適：修改基模因應新經驗。","平衡化：在認知失衡後透過適應重新達到相對穩定。","四期：感覺動作期、前運思期、具體運思期、形式運思期。"],"tags":["Piaget","皮亞傑","同化","調適","基模","平衡"],"trap":"同化不改原有基模，調適才需修正基模；第五章會深入感覺動作期。","source":"教師課堂投影片","related":[]},{"id":"2-09","chapter":"2","title":"Piaget：四階段與典型能力","lead":"不同階段的思考能力具有質的差異。","points":["感覺動作（約0–2）：以感覺與動作認識世界、逐漸形成物體恆存。","前運思（約2–7）：象徵功能擴展，仍易集中於單一特徵與自我中心。","具體運思（約7–11）：守恆、可逆、去集中化與具體邏輯推理。","形式運思（約11歲起）：假設性、抽象與演繹推理。"],"tags":["Piaget","感覺動作","前運思","具體運思","形式運思"],"trap":"分期年齡為典型估計，存在個體與情境差異。","source":"教師課堂投影片","related":[]},{"id":"2-10","chapter":"2","title":"Vygotsky：社會文化與近側發展區","lead":"高層次心智功能透過與他人互動、文化工具及語言而發展。","points":["近側發展區（ZPD）：獨立能力與在協助下可達成能力之間的區間。","鷹架（後續學者擴展的教學概念）：依能力提供支持，逐步撤除。","私我語言可幫助兒童規劃、監控並調整行為。","重視社會互動、語言內化與文化脈絡。"],"tags":["Vygotsky","維高斯基","近側發展區","鷹架","私我語言"],"trap":"鷹架概念與 Vygotsky 關聯密切，但術語由後續研究者提出。","source":"教師課堂投影片","related":[]},{"id":"2-11","chapter":"2","title":"Bronfenbrenner：生態系統","lead":"兒童生活於相互交織的環境系統中。","points":["微系統：直接互動的家庭、學校、同儕。","中系統：不同微系統的連結，如親師合作。","外系統：兒童未直接參與但會間接影響的情境，如家長職場。","大系統：文化、社會價值及制度。時間系統：時間變遷、生命事件及歷史脈絡。"],"tags":["Bronfenbrenner","布朗芬布倫納","微系統","外系統","時間系統"],"trap":"要先判斷兒童是否直接參與，再辨別微系統或外系統。","source":"教師課堂投影片","related":[]},{"id":"2-12","chapter":"2","title":"人本與個別心理學概觀","lead":"課堂將人本、個別心理學列為發展理論的補充比較。","points":["Maslow：需求層級與自我實現。","Rogers：真誠、同理、無條件積極關懷，重視關係中的成長條件。","Adler：強調社會連結、歸屬感與目的性的行為理解。","這些主張與教育心理、諮商輔導重疊，本網站只呈現課堂第二章的概觀。"],"tags":["Maslow","Rogers","Adler","人本主義"],"trap":"個別心理學雖源自精神動力傳統，也強調社會與目標，不宜直接等同人本治療。","source":"教師課堂投影片","related":[]},{"id":"2-13","chapter":"2","title":"研究方法與設計","lead":"理論主張需透過合適研究方法來蒐集與檢驗證據。","points":["橫斷研究：同一時間比較不同年齡群。","縱貫研究：追蹤同一群體隨時間改變。","序列研究：結合不同出生世代與追蹤，以減少單一方法限制。","觀察、自我報告、實驗、相關研究、個案研究等各有用途。","Mead 跨文化研究提醒我們留意社會文化對青春期與性別角色的影響。"],"tags":["橫斷研究","縱貫研究","序列研究","Mead"],"trap":"相關不代表因果；縱貫可看個人變化，但有追蹤流失等問題。","source":"教師課堂投影片","related":[]},{"id":"3-01","chapter":"3-4","title":"產前發展與影響因素","lead":"受孕至出生前的發展受到生理條件與外在環境影響。","points":["課堂特別列舉父母與家庭條件、營養、藥物、酒精、尼古丁、咖啡因及毒品等因素。","疾病、孕期焦慮壓力與生育年齡亦可能改變發展風險。","空氣污染、化學物質與輻射等環境暴露也需考量。","危險因子的效果與接觸劑量、時期及個體狀況有關。"],"tags":["產前發展","環境影響","致畸風險"],"trap":"風險因素不表示接觸即必然造成特定結果。","source":"教師課堂投影片","related":[]},{"id":"3-02","chapter":"3-4","title":"分娩與出生環境","lead":"生產方式及孕產婦所獲得的支持，屬於第三章的課堂討論重點。","points":["生產方式、支持性生產環境、陪產與產婦自主權是課堂議題。","投影片使用臺灣歷史統計資料討論醫療介入與性別偏見，舊數據不應當作當前年份的事實。","以婦幼安全、知情選擇與尊重為主要理解方向。"],"tags":["分娩","出生環境","支持性環境"],"trap":"本網站不重現課堂舊年份醫療統計為現況。","source":"教師課堂投影片","related":[]},{"id":"3-03","chapter":"3-4","title":"出生併發症與發展風險","lead":"出生時可能面臨早產、低出生體重或過期妊娠等情況。","points":["早產、體重不足與過期妊娠是投影片列出的出生併發症類型。","出生風險可能增加後續健康與發展困難機率，但個別結果差異很大。","及時醫療、照顧品質、家庭支持與追蹤介入，有助促進後續發展。"],"tags":["早產","低出生體重","出生風險"],"trap":"不應以單一出生風險預測兒童未來能力。","source":"教師課堂投影片","related":[]},{"id":"3-04","chapter":"3-4","title":"保護性因素與復原力","lead":"支持性環境有助減緩高風險背景對發展的不利影響。","points":["個人保護條件包含氣質、健康狀況與個人能力等。","至少一名穩定支持、關心兒童的家庭成員，是課堂的重要例子。","學校或生活中的參與感與意義感，也可成為保護因素。","課堂提醒，針對高風險嬰幼兒的介入需要有一定的延續性，不只一次性的短暫支持。"],"tags":["保護性因素","復原力","家庭支持"],"trap":"復原力不代表風險完全消失；是個體與支持系統持續交互作用的過程。","source":"教師課堂投影片","related":[]},{"id":"4-01","chapter":"3-4","title":"身體成長兩大方向","lead":"身體與動作能力通常遵循有方向性的發展趨勢。","points":["頭尾原則：發展控制由頭部往身體下方逐漸成熟。","近遠端（基部末梢）原則：由身體中心往四肢末端發展。","例如頭頸控制通常先於獨立步行，肩臂的控制通常先於精細指尖動作。","發展方向屬整體趨勢，不是每位兒童完全一致的時間表。"],"tags":["頭尾原則","近遠端原則","生長"],"trap":"頭尾指上下方向，近遠端指中心往外。","source":"教師課堂投影片","related":[]},{"id":"4-02","chapter":"3-4","title":"神經元、髓鞘化與突觸修剪","lead":"神經系統成熟與訊息傳遞效率息息相關。","points":["神經元透過樹突接收訊息，沿軸突傳導訊息，並經突觸與其他細胞溝通。","髓鞘化提高神經訊息傳遞的速度與效率。","細胞凋亡與突觸修剪涉及多餘連結的減除與網絡精緻化。","大腦的可塑性代表神經連結可隨發展及經驗改變。"],"tags":["神經元","髓鞘化","突觸修剪","可塑性"],"trap":"髓鞘化與突觸修剪不是同一過程：前者改善傳導、後者調整連結。","source":"教師課堂投影片","related":[]},{"id":"4-03","chapter":"3-4","title":"四大腦葉與典型功能","lead":"認識腦區主要功能是理解兒童情緒、感覺與認知行為的重要基礎。","points":["額葉／前額葉：決策、規劃、抑制控制及執行功能。","頂葉：體感覺、空間整合。","顳葉：聽覺處理、部分語言與記憶相關功能。","枕葉：視覺訊息處理。"],"tags":["額葉","前額葉","頂葉","顳葉","枕葉"],"trap":"大腦功能由多區合作完成，不能把複雜行為只歸因於單一腦區。","source":"教師課堂投影片","related":[]},{"id":"4-04","chapter":"3-4","title":"深層構造與邊緣系統","lead":"多個皮質下構造共同參與記憶、情緒與生理調節。","points":["海馬迴：新記憶形成與部分空間記憶歷程。","杏仁核：威脅、情緒顯著性與情緒學習。","下視丘：體內恆定及內分泌相關調節。","視丘：多種感覺訊息傳遞與整合的重要樞紐。","胼胝體：連接左右大腦半球的主要神經纖維束。"],"tags":["海馬迴","杏仁核","下視丘","視丘","胼胝體"],"trap":"海馬迴與杏仁核都和記憶相關，但側重的歷程不同。","source":"教師課堂投影片","related":[]},{"id":"4-05","chapter":"3-4","title":"腦側化與語言區","lead":"左右半球存在部分功能專化，但兩半球持續合作。","points":["多數人的語言功能較偏左半球；布洛卡區與威尼克區涉及不同語言處理環節。","胼胝體支持左右半球之間的訊息交流。","腦側化不代表左腦完全理性、右腦完全感性；過度二分並不精確。"],"tags":["腦側化","布洛卡區","威尼克區","胼胝體"],"trap":"避免把全腦功能簡化成左腦／右腦人格類型。","source":"教師課堂投影片","related":[]},{"id":"4-06","chapter":"3-4","title":"早期感覺與知覺發展","lead":"嬰兒的觸覺、嗅味覺、聽覺與視覺能力在不同時間快速發展。","points":["觸覺、嗅覺及味覺在生命早期已相當重要。","聽覺與對聲音的辨識，在出生前後持續發展。","視覺清晰度與深度知覺逐步成熟，受視覺和移動經驗影響。","視覺懸崖研究提醒：深度知覺、移動經驗與是否跨越危險區域的行為應分開分析。"],"tags":["觸覺","視覺","聽覺","視覺懸崖"],"trap":"「會知覺深度」不等於「一定會害怕高度」。","source":"教師課堂投影片","related":[]},{"id":"4-07","chapter":"3-4","title":"原始反射與動作發展","lead":"反射是早期神經功能的重要指標，後續逐步發展自主動作。","points":["覓食反射、吸吮反射、抓握反射等是早期常見反射。","大肌肉：翻身、坐、爬、站、走、跑跳；小肌肉：抓取、使用手指、扣扣子與書寫。","課堂提供各動作里程碑的約略月齡，應視為參考範圍而非強制時間點。","爬行及探索可提供感覺、動作、距離知覺與社會參照的經驗。"],"tags":["反射","大肌肉","小肌肉","動作里程碑"],"trap":"單一里程碑較晚不等於能自行診斷發展異常。","source":"教師課堂投影片","related":[]},{"id":"4-08","chapter":"3-4","title":"成長條件與環境支持","lead":"兒童成長同時受到生理機制、營養、健康與照顧環境影響。","points":["生物性因素：基因、荷爾蒙與疾病。","環境因素：營養不足或過剩、生活壓力及照顧品質。","非器質性成長遲緩及情緒匱乏相關現象，反映成長與照顧環境的關係。","需要依個別狀況進行專業評估與支持，不能由單一因素直接推斷。"],"tags":["營養","成長遲緩","照顧環境"],"trap":"課堂概念屬發展教育理解，不應替代醫療診斷。","source":"教師課堂投影片","related":[]},{"id":"5-01","chapter":"5","title":"感覺動作期：六個次階段","lead":"約出生至兩歲，嬰兒主要透過感覺與動作建立知識。","points":["反射活動（出生至約1個月）。","初級循環反應（約1–4個月）：重複與自身身體相關的愉快行為。","次級循環反應（約4–8個月）：重複對外在事物造成有趣效果的動作。","次級基模協調（約8–12個月）：組合動作達成目標。","三級循環反應（約12–18個月）：以變化方式主動實驗。","心智表徵（約18–24個月）：能在心中表徵，出現延宕模仿等能力。"],"tags":["Piaget","感覺動作期","六次階段","循環反應"],"trap":"年齡僅為理論上的近似範圍。","source":"教師課堂投影片","related":[]},{"id":"5-02","chapter":"5","title":"循環反應、延宕模仿與物體恆存","lead":"嬰兒重複動作並非毫無意義，而是透過反覆操作探索世界。","points":["循環反應：重複偶然發現的有趣結果，逐步形成穩定行動基模。","延宕模仿：沒有立即呈現示範時，仍能重現先前看過的動作。","物體恆存：即使看不到物體，也理解它仍存在。","現代研究指出部分能力可能比 Piaget 原先觀察的年齡更早出現，須區分實驗方法和理論主張。"],"tags":["循環反應","延宕模仿","物體恆存"],"trap":"「暫時看不見」不等於「物體消失」，也是躲貓貓遊戲的重要認知背景。","source":"教師課堂投影片","related":[]},{"id":"5-03","chapter":"5","title":"三歲前的語言發展歷程","lead":"早期語言從辨音、發聲、首詞逐步走向雙詞與語法組合。","points":["前語言階段包含聲音辨識、發聲與模仿。","首詞通常約在一歲前後逐漸出現；課堂列出約10–14個月作為參考。","約18–24個月可見雙詞組合與電報式話語。","詞彙成長加速（詞彙爆發）在部分幼兒較明顯，但個體差異甚大。"],"tags":["語音","語彙","語句","電報式話語"],"trap":"不同兒童學語速度差異大，月齡是描述趨勢，不是判斷發展的唯一標準。","source":"教師課堂投影片","related":[]},{"id":"5-04","chapter":"5","title":"語言四要素：語音、語意、語法、語用","lead":"辨識語言問題時，先判斷是在「聲音、意義、句子結構或使用情境」哪個層面。","points":["語音：語言的聲音系統與音韻辨識。","語意：詞、句所傳達的意義與關係。","語法：詞彙組合成合乎規則句子的結構。","語用：依對象、意圖與社會情境使用語言，例如暗示、輪流談話或修補訊息。"],"tags":["語音","語意","語法","語用"],"trap":"分不清注音聲音偏語音；理解「弦外之音」偏語用。","source":"教師課堂投影片","related":[]},{"id":"5-05","chapter":"5","title":"語言習得：學習論、先天論、互動論","lead":"不同理論對語言來自何處提供不同的解釋。","points":["學習論：模仿、刺激與增強對語言習得的影響。","先天論：人類具備學習語言的先天準備，Chomsky 的 LAD 為經典主張。","Slobin 提出語言製造能力（LMC），強調兒童主動找出輸入語言的規則。","互動論：生理準備、認知發展與社會互動共同參與。"],"tags":["學習論","先天論","互動論","Chomsky","Slobin"],"trap":"純模仿無法充分解釋幼兒能說出未曾直接聽過的句子。","source":"教師課堂投影片","related":[]},{"id":"5-06","chapter":"5","title":"Vygotsky：社會語言、私語與內在語言","lead":"語言最初用於人際互動，逐漸成為引導自身思考與行為的工具。","points":["社會語言：與他人溝通。","私我語言：自言自語地規劃、調整或解決任務。","內在語言：語言內化成較不外顯的思考工具。","遇到較困難任務時，私語可能增加，以協助認知調節。"],"tags":["Vygotsky","社會語言","私我語言","內在語言"],"trap":"不應把自言自語一概視為沒有社會功能或故意干擾。","source":"教師課堂投影片","related":[]},{"id":"5-07","chapter":"5","title":"Piaget 與 Vygotsky 的語言觀比較","lead":"兩位學者都重視兒童語言，但對自我中心語言的功能有不同詮釋。","points":["Piaget：自我中心語言反映早期難以充分考慮他人觀點，隨社會化而改變。","Vygotsky：私語是外在社會語言逐漸內化、幫助自我調節的過渡歷程。","比較時應對照：語言與認知的先後關係、自言自語的功能、發展方向。"],"tags":["Piaget","Vygotsky","自我中心語言","私語"],"trap":"名稱相近不代表兩人對其功能的解釋相同。","source":"教師課堂投影片","related":[]},{"id":"5-08","chapter":"5","title":"影響語言發展：腦、社會互動與經驗","lead":"語言的發展仰賴神經成熟，也依賴回應性的人際互動。","points":["大腦成熟與可塑性支持早期語言能力發展。","照顧者回應、輪流對話、示範與共讀提供語言經驗。","兒童導向話語（parentese）可透過清楚的語音與互動節奏，支持幼兒注意與理解。","雙語環境可能出現語碼混合及語碼轉換，應在情境與發展脈絡中理解。","親子共讀、開放式提問與多元性別表述也是課堂的教育應用。"],"tags":["大腦成熟","社會互動","兒童導向話語","雙語","親子共讀"],"trap":"雙語語碼混合不宜直接視為語言發展缺陷。","source":"教師課堂投影片","related":[]},{"id":"6-01","chapter":"6","title":"情緒的功能與發展歷程","lead":"情緒不只是感受，更具有溝通需求、引導行為及維護安全的功能；嬰幼兒情緒表達隨成熟與互動逐漸豐富。","points":["情緒的三大功能：①溝通與表達內在感受及需求（如哭泣喚起照顧者回應）；②引導與調節行為（如好奇促進探索）；③維護與保護生命（如恐懼協助避險）。","0～3 個月：社會性微笑與對人臉的反應逐漸增加，開始出現早期社會反應。","3～6 個月：互惠式情緒交流發展，會期待照顧者回應；對互動中斷可能出現失望或不安。","6～9 個月：主動尋求社會互動，情緒表達更具變化，會運用表情、聲音與動作影響他人。","9～12 個月：與熟悉照顧者的依戀表現及社會辨識更加明顯，陌生人焦慮等反應可能增強。","12～18 個月：在熟悉照顧者的支持下，安全感與自主探索逐步發展；18～36 個月自我意識增加，情緒與自我評價能力逐漸萌芽。","情緒發展與神經成熟、認知辨識及照顧互動互相影響；各里程碑是概略整理，並非每位兒童都依相同月齡出現。"],"tags":["情緒功能","嬰幼兒","社會微笑","發展歷程","社會互動"],"trap":"情緒的發展期程不是精確診斷表；哭泣、陌生反應或情緒波動也不能僅憑單一表現推斷發展異常。","source":"第六章圖片筆記 CH06-NOTE 01（使用者提供）；依圖卡內容整理","related":["6-02","6-03","6-06"],"galleryId":"img-6-01"},{"id":"6-02","chapter":"6","title":"氣質與適配良好","lead":"氣質是具有生物基礎、相對穩定的情緒與行為反應傾向；兒童適應情形同時取決於環境是否適切回應。","points":["Thomas 與 Chess 的紐約縱貫研究（NYLS）用氣質描述幼兒的典型反應方式，並非以好壞評價兒童。","容易養育型（Easy）：情緒傾向較正向、作息較規律、對新情境較快適應、反應較溫和。","困難養育型（Difficult）：負向情緒或強烈反應較多、作息較不規律、環境改變時適應可能較慢。","慢熟型（Slow-to-warm-up）：遇到陌生情境起初退縮、謹慎，反應不一定強烈；熟悉後可能逐步參與。","適配良好（Goodness of Fit）指成人提供的要求、支持與兒童氣質和能力相互配合。例如讓慢熟型幼兒先觀察班級，再循序參與活動。","氣質具有穩定傾向，也受環境及生活經驗影響；三種分類是典型概括，並非所有兒童都能明確歸入其中。"],"tags":["Thomas","Chess","NYLS","氣質","慢熟型","適配良好"],"trap":"「困難養育型」不是有問題的孩子；Goodness of Fit 的重點在兒童特徵與環境要求的協調，而非強迫孩子改變氣質。","source":"第六章圖片筆記 CH06-NOTE 02（使用者提供）；依圖卡內容整理","related":["6-01","6-04","6-09"],"galleryId":"img-6-02"},{"id":"6-03","chapter":"6","title":"自我意識與自我概念","lead":"從辨認自己是獨立個體，逐漸形成對自身特徵、能力與行為的認識，並發展與社會評價相關的情緒。","points":["自我察覺（Self-Awareness）：開始意識到自己是有別於他人及環境的個體，與自我辨識能力發展有關。","自我概念（Self-Concept）：逐漸能描述自己的名字、外觀、能力、喜好及角色，幼兒早期常以具體特徵描述自己。","自我評價情緒（Self-Evaluative Emotions）：隨著自我意識和社會標準理解發展，開始出現驕傲、羞愧等感受。","約 18～24 個月是鏡像自我辨識的重要研究區間；「鏡像標記測驗」觀察幼兒是否在鏡子中辨認自己，並觸摸臉上的標記。","約 2～3 歲開始發展更複雜的自我評價能力，逐步理解自己的行為與他人期待的關係。","照顧者回應、遊戲與同儕互動提供探索自我及建立自我概念的經驗；年齡範圍是大致參考。"],"tags":["自我察覺","自我概念","鏡像標記測驗","羞愧","驕傲","自我評價"],"trap":"自我察覺、自我概念與自我評價情緒不是同義詞；鏡像測驗只觀察特定的自我辨識表現，不能代表自我概念的全部。","source":"第六章圖片筆記 CH06-NOTE 03（使用者提供）；依圖卡內容整理","related":["6-01","6-04","6-05"],"galleryId":"img-6-03"},{"id":"6-04","chapter":"6","title":"艾瑞克森的心理社會發展：基本信任與自主","lead":"三歲前以「基本信任對不信任」及「自主對羞愧與懷疑」為主要心理社會發展課題。","points":["Erik Erikson 的心理社會發展論以八個階段說明人生各期需要處理的心理社會危機；本章聚焦前兩階段。","第一階段：基本信任對不信任（出生至約 12～18 個月）。任務是在穩定、敏感、可預測的照顧與需求回應中，建立對他人及環境的基本信任。","第一階段的核心德行是「希望」（Hope）；例如嬰兒哭泣時，照顧者適當回應與安撫，支持安全感。","第二階段：自主對羞愧與懷疑（約 18 個月至 3 歲）。任務是透過選擇、獨立嘗試及自我控制，逐步建立自主性。","第二階段的核心德行是「意志」（Will）；例如幼兒希望自己穿鞋，成人允許嘗試並在必要時協助。","兩階段的健康發展都需要適切的支持與界線；不是完全沒有不信任、羞愧或挫折，而是能形成較有利的調適方式。"],"tags":["Erikson","基本信任","不信任","自主","羞愧與懷疑","希望","意志"],"trap":"心理社會危機是兩種傾向的協調，不是「有信任就完全沒有不信任」。年齡只是約略範圍。","source":"第六章圖片筆記 CH06-NOTE 04（使用者提供）；依圖卡內容整理","related":["2-04","6-03","6-06"],"galleryId":"img-6-04"},{"id":"6-05","chapter":"6","title":"社會情緒學習（SEL）與 CASEL 五大核心能力","lead":"社會情緒學習透過課堂、學校與家庭社區的實踐，培養理解自我、理解他人、管理情緒及負責決策的能力。","points":["社會情緒學習（Social and Emotional Learning, SEL）是一套跨年齡的能力培養架構，並非只屬於三歲前的發展階段。","①自我覺察（Self-Awareness）：辨識情緒、想法、價值及其對行為的影響。","②自我管理（Self-Management）：適當調節情緒、想法與行為，朝向目標努力。","③社會覺察（Social Awareness）：理解他人感受與觀點，發展同理及尊重。","④關係技能（Relationship Skills）：溝通、合作、處理衝突並維持支持性關係。","⑤負責任的決策（Responsible Decision-Making）：考量安全、倫理、行為後果及他人福祉作出選擇。","實施環境包括班級教學、學校整體實踐及家庭與社區合作；教檢情境宜先辨識行為問題對應的能力，再設計教學支持。"],"tags":["SEL","CASEL","自我覺察","自我管理","社會覺察","關係技能","負責任的決策"],"trap":"SEL 是社會情緒能力架構，而非嬰幼兒發展必經的固定五階段。情緒控制困難不一定只對應其中一項能力。","source":"第六章圖片筆記 CH06-NOTE 05（使用者提供）；依圖卡內容整理","related":["6-01","6-03","6-11"],"galleryId":"img-6-05"},{"id":"6-06","chapter":"6","title":"依附理論的基礎：Bowlby 與 Ainsworth","lead":"依附是嬰幼兒與特定照顧者形成的持續情感連結，使其在不安時尋求保護，並在安全支持下探索。","points":["依附（Attachment）是嬰幼兒與特定照顧者之間的情感連結，並不等同於「安全型依附」這一種分類。","Bowlby 以依附行為系統解釋嬰幼兒受到威脅或不安時，傾向靠近照顧者以取得保護與安全。","Ainsworth 發展陌生情境測驗（Strange Situation Procedure），透過分離與重聚反應等線索研究依附模式。","安全避風港（Safe Haven）：在害怕或不安時，向熟悉照顧者尋求靠近、安撫及保護。","安全基地（Secure Base）：因為照顧者可以提供可靠支持，兒童較能放心探索陌生環境。","安全避風港與安全基地相互補充：需要支持時回來尋求安慰；感到安全時再向外探索。","早期依附經驗與日後的人際期待可能相關，但不能視為永久固定的命運。"],"tags":["Bowlby","Ainsworth","依附","安全基地","安全避風港","內在運作模式"],"trap":"「有依附」不等於「安全型依附」；也不能把陌生焦慮、哭泣或單一次重聚反應直接當作依附類型診斷。","source":"第六章圖片筆記 CH06-NOTE 06（使用者提供）；依圖卡內容整理","related":["6-07","6-08","6-09","6-10"],"galleryId":"img-6-06"},{"id":"6-07","chapter":"6","title":"哈洛恆河猴實驗：接觸安慰與早期社會經驗","lead":"哈洛以恆河猴研究凸顯接觸安慰和早期社會經驗的重要性，挑戰把親近照顧者僅歸因於餵食的解釋。","points":["Harry Harlow 以幼猴與不同材質代理照顧者的實驗，比較接觸安慰與食物供應對親近行為的影響。","接觸安慰研究：鐵絲代理照顧者可供奶水；柔軟的絨布代理照顧者提供接觸安慰。幼猴通常更偏好依附絨布代理照顧者。","受驚嚇時的反應：幼猴傾向靠近柔軟代理照顧者尋求安慰，與「安全避風港」的功能相呼應。","社會隔離研究：早期長期缺乏適切社會互動的幼猴可能出現恐懼、社交困難及異常行為；後續互動可能改善部分表現。","以上涉及不同實驗安排，不能把接觸安慰、驚嚇反應與長期隔離說成同一實驗的固定先後階段。","研究以動物為對象，對理解人類依附有啟發，但不能直接把動物實驗結果等同人類兒童的必然發展。"],"tags":["Harlow","恆河猴","接觸安慰","代理照顧者","恐懼反應","社會隔離"],"trap":"不能把「奶水由誰提供」直接解釋為依附的唯一來源；不同恆河猴實驗的條件與研究目的也應分清楚。","source":"第六章圖片筆記 CH06-NOTE 07（使用者提供）；依圖卡內容整理","related":["6-06","6-09"],"galleryId":"img-6-07"},{"id":"6-08","chapter":"6","title":"陌生情境測驗與四種依附類型","lead":"觀察嬰幼兒在探索、分離、重聚情境下的行為模式，尤其重視與照顧者重新相聚時如何尋求或拒絕安慰。","points":["陌生情境測驗（Strange Situation Procedure）運用陌生環境、短暫分離與重聚等情境，評估幼兒的依附行為組織。","B 型｜安全型（Secure）：重聚時願意接近照顧者並接受安慰，獲得安全感後通常能繼續探索。","A 型｜逃避型（Avoidant）：重聚時較少主動接觸，可能忽略或迴避照顧者；不能直接推論幼兒沒有依附需求。","C 型｜矛盾／抗拒型（Resistant/Ambivalent）：分離時常較不安，重聚時可能尋求親近，同時抗拒安慰或難以平復。","D 型｜錯亂型（Disorganized）：依附行為可能出現矛盾、不連貫、停頓、凍結或缺乏一致策略等表現。","分類來源：Ainsworth 提出 A、B、C 主要類型；Main 與 Solomon 後來加入 D 類型。","評估須結合標準化程序及專業判讀；單次哭泣、退縮、拒絕或不接近照顧者，不能獨立決定類型。"],"tags":["Ainsworth","Main","Solomon","陌生情境測驗","安全型","逃避型","抗拒型","錯亂型"],"trap":"D 型不是「比較嚴重的 A、B、C 分數」，也不等同精神疾病；重聚時的行為組織方式比單純哭鬧強度更重要。","source":"第六章圖片筆記 CH06-NOTE 08（使用者提供）；依圖卡內容整理","related":["6-06","6-09","6-10"],"galleryId":"img-6-08"},{"id":"6-09","chapter":"6","title":"依附、照顧者敏感回應與探索行為","lead":"照顧者能覺察幼兒訊號並提供適切回應，與依附安全感及探索環境的方式具有關聯。","points":["照顧者敏感回應指能注意並理解幼兒的需求及互動訊號，及時以適切方式回應，而不是凡事立即滿足。","依附安全感與探索調整彼此相關：幼兒在可獲得支持的情況下，較可能主動探索；需要安撫時再回到照顧者身邊。","安全型依附：探索時可將照顧者視為安全基地，需要時能尋求並利用安慰。","逃避型依附：探索過程可能將注意力轉向玩具或環境，而較少外顯尋求照顧者協助。","矛盾／抗拒型依附：可能過度關注照顧者可否接近，因焦慮難以投入探索。","錯亂型依附：在依附需求被激發時，行為可能呈現短暫中斷或不一致，無法形成穩定的應對模式。","研究指出敏感回應與依附安全感相關，但不代表單一、固定的因果關係；也不能以依附分類斷定照顧者人格或幼兒未來。"],"tags":["敏感回應","照顧互動","安全感","安全基地","探索","依附類型"],"trap":"探索表現需要同時考慮年齡、氣質、情境與照顧者互動；外表安靜或獨立不一定代表安全型依附。","source":"第六章圖片筆記 CH06-NOTE 09（使用者提供）；依圖卡內容整理","related":["6-02","6-06","6-08"],"galleryId":"img-6-09"},{"id":"6-10","chapter":"6","title":"陌生焦慮、分離焦慮與後天安全型依附","lead":"陌生人焦慮與分離焦慮是幼兒常見的情緒反應；早期依附關係具有發展可塑性。","points":["陌生人焦慮（Stranger Anxiety）：遇到不熟悉的人時，可能出現不安、害怕、退縮或尋求照顧者；約 6～9 個月後逐漸可見。","分離焦慮（Separation Anxiety）：熟悉照顧者離開時，可能出現不安、哭泣、抗議或靠近需求；發展時程存在個別差異，圖卡列出約 6～9 個月萌芽、10～18 個月較明顯。","這些焦慮與人物辨識、認知發展及依附需求有關；不能單靠焦慮強弱判定安全、逃避或抗拒型依附。","後天安全型依附（Earned Security）指即使早年照顧經驗不利，日後仍可能建立較安全的依附表徵並整合過往關係經驗。","「後天安全型」多見於成人依附表徵研究，並不是嬰兒陌生情境測驗之外新增的第五種類型。","可能的支持方向包括增加自我理解、情緒調節、穩定支持關係及必要的專業協助；它們不是固定保證成功的階段式治療處方。"],"tags":["陌生人焦慮","分離焦慮","Earned Security","依附可塑性","安全關係"],"trap":"陌生焦慮≠不安全依附；後天安全型依附也不是陌生情境測驗的「第五類」。","source":"第六章圖片筆記 CH06-NOTE 10（使用者提供）；依圖卡內容整理","related":["6-06","6-08","6-09"],"galleryId":"img-6-10"},{"id":"6-11","chapter":"6","title":"自律、順從與規範內化","lead":"從依賴外在提醒逐漸發展能理解並自願遵循規範的自我調節能力。","points":["自律（Self-Regulation）是兒童調整注意、情緒及行為，使之配合內在目標或已理解規範的能力。","Kochanska 等人的研究區分順從表現，協助理解外在監督與規範內化間的關係。","承諾式順從（Committed Compliance）：兒童較自願、積極地配合照顧者合理要求，通常無須持續督促；與規範內化呈正向關聯。","情境式順從（Situational Compliance）：兒童在當下受督促、監督時配合要求，但自主認同較弱；規範內化不一定明顯。","規範內化指兒童逐漸將外在要求理解並接受為自身標準，即使監督者不在場也可能遵守。","例：收玩具時，承諾式順從可能主動配合；情境式順從可能需要反覆提醒。單次配合不能代表成熟良知已完成發展。"],"tags":["自律","順從","Kochanska","承諾式順從","情境式順從","規範內化"],"trap":"「願意照做」不必然表示規範已內化；承諾式與情境式順從是研究中的表現類型，不是每人固定歸類的發展階段。","source":"第六章圖片筆記 CH06-NOTE 11（使用者提供）；依圖卡內容整理","related":["6-04","6-05","6-12"],"galleryId":"img-6-11"},{"id":"6-12","chapter":"6","title":"延後享樂與自我控制研究","lead":"延後享樂反映兒童在誘因面前暫緩即時滿足的能力，與注意調節、認知策略及情境可信度有關。","points":["延後享樂（Delay of Gratification）：為了獲取未來較大的獎勵，暫時抑制立即取得較小獎勵的衝動。","Walter Mischel 的經典等待研究觀察兒童如何面對立即誘因，以及等待時間與自我控制策略的關係。","注意力分散（Distraction）：將注意從誘人物轉移，例如看向別處、唱歌或想其他事情。","認知轉換（Cognitive Transformation）：改變對誘人物的心理表徵，例如把棉花糖想成白雲，降低即時誘惑。","自我指導（Self-Instruction）：用內在或外顯語言提醒等待目的，規劃並調整自己的反應。","後續研究指出等待表現也受環境可靠性、成長背景及認知策略影響；不能只靠一次等待時間判斷兒童意志力或預測未來成就。","與本章自律及前額葉執行功能相關，但不能將延後享樂簡化為單一腦區或人格特質決定。"],"tags":["延後享樂","Mischel","自我控制","注意力分散","認知轉換","自我指導"],"trap":"等待得久不等於一定較成功；情境是否可信、兒童是否理解規則、個別差異都會影響結果。","source":"第六章圖片筆記 CH06-NOTE 12（使用者提供）；依圖卡內容整理","related":["6-05","6-11","4-03"],"galleryId":"img-6-12"},{"id":"6-13","chapter":"6","title":"兒童不當對待：虐待與疏忽類型","lead":"兒童不當對待不僅是可見傷害，也可能侵害心理安全、性自主及基本照顧需求。","points":["兒童不當對待（Child Maltreatment）概括危害兒童健康、安全與發展的傷害或照顧不足，圖卡分為虐待與疏忽。","身體虐待（Physical Abuse）：非意外性身體傷害，如暴力或不當體罰造成瘀傷、燒燙傷等。","精神虐待（Psychological Abuse）：持續或嚴重的羞辱、威脅、貶低、孤立或不當控制等，危害心理及情緒發展。","性虐待（Sexual Abuse）：涉及對兒童的性侵害、性剝削或非自願及不當性接觸行為，可能涉及製作性剝削影像。","疏忽（Neglect）：必要的生活、醫療、教育或安全照顧需求未獲適當滿足，使兒童健康或發展受到危害。","不同類型可能同時存在，也不一定有明顯外傷；具體事件應由適當的專業與主管機關評估，而非以單一徵象逕下結論。"],"tags":["Child Maltreatment","身體虐待","精神虐待","性虐待","疏忽","兒少保護"],"trap":"「沒有外傷」不代表沒有不當對待；但貧窮、情緒問題或單一行為徵兆也不等於虐待已被證實。","source":"第六章圖片筆記 CH06-NOTE 13（使用者提供）；依圖卡內容整理","related":["6-14","6-15","6-16"],"galleryId":"img-6-13"},{"id":"6-14","chapter":"6","title":"兒童不當對待的風險與保護因素","lead":"風險因素可能分布於照顧者、家庭關係及社區環境等層次；保護性支持能降低風險。","points":["風險因素是與不當對待機率增加有關的條件，並非充分或必然原因。","照顧者因素：親職知能或壓力因應不足、過高照顧壓力、情緒與衝動調節困難，或可能影響照顧功能的物質使用問題。","家庭與關係因素：家庭衝突、家庭暴力、經濟與照顧壓力，以及可依靠的家庭支持不足。","社區與環境因素：社會支持網絡薄弱、資源不足，以及托育、醫療、福利服務取得困難。","保護性因素：正向親職支持、穩定關係、社會支持網絡及容易取得的托育、醫療與社會福利資源。","圖卡另提供 2024 年臺灣兒少保護統計示例；統計數值必須搭配年度、統計對象及資料定義閱讀，不應視為當前即時數據。","多層次因素常相互作用；教檢情境可從個人、家庭與社區三層尋找適切的預防與支持策略。"],"tags":["風險因素","保護因子","照顧者","家庭","社區","親職支持","兒少保護"],"trap":"風險因素不等於必然因果；經濟困難、健康問題或特殊需求本身不可直接當成虐待證據。","source":"第六章圖片筆記 CH06-NOTE 14（使用者提供）；依圖卡內容整理","related":["6-13","6-15","6-16"],"galleryId":"img-6-14"},{"id":"6-15","chapter":"6","title":"疑似受虐的徵兆辨識與兒童支持","lead":"教師應敏感察覺可能的警訊，以尊重、客觀記錄與優先安全為原則，而非自行認定或調查虐待。","points":["身體外觀徵兆：難以解釋或反覆出現的傷勢、燒燙傷，或傷勢與所述發生情境不符。","生活與照顧徵兆：經常缺席、持續疲憊、衣著長期明顯不適當，或基本生活與醫療需要長期未獲滿足。","情緒與行為徵兆：持續或明顯退縮、恐懼、過度警覺、情緒或行為劇變，以及學習與社交表現退步。","教師初步關懷：①平靜接納與傾聽，不責備或質疑；②避免誘導、重複盤問或要求孩子自行證明；③客觀記錄觀察時間、事實與兒童原話。","如涉及安全風險，優先保護兒童，依規定啟動通報，並連結社工、心理、醫療或校內資源提供後續支持。","單一徵兆無法確認虐待，教師也不需要先自行查證完整事件才啟動應有的保護與通報程序。"],"tags":["疑似受虐","警訊","溫和傾聽","客觀記錄","兒童支持","通報"],"trap":"校內知會、訪談或自行調查不能取代法定通報；單一可疑徵兆也不能直接下虐待診斷。","source":"第六章圖片筆記 CH06-NOTE 15（使用者提供）；依圖卡內容整理","related":["6-13","6-14","6-16"],"galleryId":"img-6-15"},{"id":"6-16","chapter":"6","title":"兒少保護法規與教育人員通報責任","lead":"當教育人員在執行職務時知悉法定兒少保護情事，應把兒童安全放在首位，依法立即向地方主管機關通報。","points":["《兒童及少年福利與權益保障法》第 49 條規範不得對兒童及少年為傷害其身心健康等法定禁止行為。","同法第 53 條：教育人員執行業務時知悉符合條文列舉的兒少保護情形，應立即向直轄市、縣（市）主管機關通報，至遲不得超過 24 小時。","同法第 100 條：無正當理由違反第 53 條第 1 項通報義務者，處新臺幣 6,000 元以上、60,000 元以下罰鍰。","《兒童及少年保護通報與分級分類處理及調查辦法》第 2 條：依法通報須填具通報表；緊急時可先以言詞或電話通報，再於知悉起 24 小時內完成通報表送達。","圖卡列出 113 保護專線（24 小時）、衛福部「關懷 e 起來」線上通報及危急時撥打 110 請求警政協助；各管道應依事件急迫程度使用。","實務應先顧及安全、客觀記錄並啟動依法通報；保護孩子、提供協助與通報責任可同時進行，不應等待家庭說明、校內討論或教師自行查證完成。","法規內容已依全國法規資料庫與衛福部公開資料核對（2026-10-17）；使用時仍應注意其後修正及最新施行規定。"],"tags":["兒少權益保障法","第49條","第53條","第100條","24小時","113","通報責任"],"trap":"「校內知會」不等於完成向主管機關的法定通報；通報與事實認定、調查程序亦不同。","source":"第六章圖片筆記 CH06-NOTE 16；法條經全國法規資料庫核對（2026-10-17）","related":["6-13","6-14","6-15"],"galleryId":"img-6-16","sourceUrl":"https://law.moj.gov.tw/LawClass/LawAll.aspx?PCode=D0050001"},{"id":"7-01","chapter":"7","title":"腦部與神經系統發展","lead":"兒童期早期的神經成熟仍在持續，腦部大小與功能成熟不能畫上等號。","points":["圖卡將幼兒腦部重量約達成人90%、六歲腦容量約達成人95%列為教材概略值；此非所有兒童適用的固定標準。","前額葉皮質與注意力、計畫及行為控制有關，但執行功能由多個腦區與環境經驗共同支持。","髓鞘化可提高神經訊息傳遞效率；胼胝體連結左右大腦半球，支持跨半球資訊整合。","圖卡提到約四歲前額葉相關突觸密度的高峰；突觸密度高峰不代表功能完全成熟。"],"tags":["腦部重量","腦容量","前額葉皮質","髓鞘化","胼胝體"],"trap":"大腦已接近成人大小，不代表注意與自我控制已等同成人。","source":"第七章圖片筆記 CH07-NOTE 01（使用者提供）；依圖卡內容整理","related":["4-02","4-03","4-04"],"galleryId":"img-7-01"},{"id":"7-02","chapter":"7","title":"動作技能、偏手性與繪畫發展","lead":"兒童期早期大肌肉與小肌肉動作持續精緻化，逐漸展現偏手性及象徵性繪畫。","points":["大肌肉動作包括跑、跳、平衡與姿勢控制；小肌肉動作包括握筆、扣扣子、使用餐具等精細操作。","偏手性是傾向使用某一隻手的習慣，肢體動作通常由對側大腦運動皮質主要控制。","圖卡列出約三歲畫簡單形狀、約四至五歲出現較具象的人物或熟悉物體圖像。","繪畫需要手眼協調、精細動作與符號表徵，也會受到練習、環境與個別差異影響。"],"tags":["大肌肉","小肌肉","偏手性","手眼協調","繪畫"],"trap":"慣用手不等於所有認知功能都由單一大腦半球決定；發展年齡是概略範圍。","source":"第七章圖片筆記 CH07-NOTE 02（使用者提供）；依圖卡內容整理","related":["4-07","4-05"],"galleryId":"img-7-02"},{"id":"7-03","chapter":"7","title":"皮亞傑的認知發展四階段","lead":"皮亞傑以認知結構的質性變化解釋兒童如何由感覺動作進展至抽象思考。","points":["感覺動作期（約0～2歲）：藉由動作與感覺探索，物體恆存逐漸發展。","前運思期（約2～7歲）：符號、語言及假裝遊戲日益豐富，成熟的具體邏輯運思尚未建立。","具體運思期（約7～11歲）：逐漸具備守恆、可逆性、去集中化及對具體事物的邏輯推理。","形式運思期（約11歲起）：假設、抽象與系統性思考逐漸發展。","第七章特別聚焦前運思期3～6歲的實際表現，與第二章理論概覽互相對照。"],"tags":["Piaget","前運思期","具體運思","符號表徵"],"trap":"四階段年齡為大致範圍，不應用生日判定能力，更不是所有領域同步轉換。","source":"第七章圖片筆記 CH07-NOTE 03（使用者提供）；依圖卡內容整理","related":["2-09","5-01"],"galleryId":"img-7-03"},{"id":"7-04","chapter":"7","title":"前運思期的認知能力進展（一）","lead":"前運思期不只是「能力不足」，兒童已能使用符號、初步分類並探索因果及空間關係。","points":["符號使用：以語言、圖畫或替代物表徵真實事物，例如拿香蕉假裝電話。","同一性理解：能辨認衣著或外觀改變前後仍是同一個人，但不等同守恆推理。","因果理解：開始探究事件的原因，但可能依表象或時間先後做出不成熟推論。","初步分類：能依顏色、大小或形狀等顯著特徵分組，與理解類別包含關係不同。","空間理解：可逐漸運用簡單地圖或模型判斷位置關係，表現受任務設計影響。"],"tags":["象徵功能","同一性","因果理解","分類","空間理解"],"trap":"同一性理解≠守恆；初步分類≠類別包含已成熟；因果好奇≠因果推理完整。","source":"第七章圖片筆記 CH07-NOTE 04（使用者提供）；依圖卡內容整理","related":["2-09"],"galleryId":"img-7-04"},{"id":"7-05","chapter":"7","title":"前運思期的認知能力進展（二）","lead":"數目理解、同理心與心智理論在學前階段持續發展，並非具備其中一項就表示其他能力成熟。","points":["數目理解：開始點數、比較數量與處理簡單的數目問題，但數得出個數不等於通過數目守恆。","同理心：辨識、理解與回應別人的感受，可能表現關懷及安慰。","心智理論：逐步理解他人具有與自己不同的知識、想法、信念與意圖。","有些自我中心表現與不成熟的觀點取替並存，不代表孩子完全無法理解他人。"],"tags":["數目理解","同理心","心智理論","他人信念"],"trap":"數目理解≠數目守恆；同理心關心感受，心智理論關心他人的想法、知識與信念。","source":"第七章圖片筆記 CH07-NOTE 05（使用者提供）；依圖卡內容整理","related":["6-01","2-09"],"galleryId":"img-7-05"},{"id":"7-06","chapter":"7","title":"前運思期的七項認知限制","lead":"皮亞傑用多項典型特徵描述前運思期的推理侷限，應依任務表現辨識，而非貼標籤。","points":["集中化：過度聚焦單一明顯特徵，忽略其他面向。","不可逆性：難以在心中反轉操作，推導變化前後的關係。","集中於狀態而非轉換：只比較前後狀態，忽視中間的改變歷程。","橫跨式推理：由個別事件直接連結因果，可能沒有充分理由。","自我中心思維：在某些任務中難以採取他人觀點。","泛靈論：將生命、感覺或意圖歸給無生命事物。","表象與真實混淆：容易把外觀或表象當作物體真實性質。"],"tags":["集中化","不可逆性","橫跨式推理","自我中心","泛靈論","表象真實"],"trap":"七項是概念性整理，不是固定出現的七階段，也不能由單一情境推定兒童能力。","source":"第七章圖片筆記 CH07-NOTE 06（使用者提供）；依圖卡內容整理","related":["2-09"],"galleryId":"img-7-06"},{"id":"7-07","chapter":"7","title":"容易混淆的認知限制比較","lead":"同一個錯誤答案可能源於不同思考困難，辨識概念時要看兒童採用的推理線索。","points":["集中化：只看高杯比較高，未同時注意杯子的寬度。","不可逆性：不易想像將液體倒回原杯後會恢復原本水量。","狀態而非轉換：只看變化前後的水位，忽略倒水過程。","橫跨式推理：妹妹生病剛好在我生氣後，就以為是自己生氣造成疾病。","自我中心：以自己的視角推測他人所見；不等於自私。","泛靈論：認為春天想來、冬天不想離開；與有意識的假扮遊戲不同。","表象與真實混淆：將外表像石頭的海綿誤認為真正石頭。"],"tags":["認知限制比較","集中化","不可逆","泛靈論","自我中心"],"trap":"看到同一種行為可有不同解釋，應分析任務需求及兒童說出的理由。","source":"第七章圖片筆記 CH07-NOTE 07（使用者提供）；依圖卡內容整理","related":["7-06"],"galleryId":"img-7-07"},{"id":"7-08","chapter":"7","title":"守恆概念與三種推理依據","lead":"守恆是理解在沒有增加或減少的情況下，外形或排列改變不一定改變原有的量。","points":["倒水實驗：起初兩杯水等量，將一杯倒入較高、較細的杯子，檢驗兒童能否判斷水量不變。","同一性（Identity）：理解沒有增加或減少，所以原本的量應相同。","可逆性（Reversibility）：能在心中想像倒回原容器，回到相同狀態。","互補性／補償性（Compensation）：同時考慮高度與寬度等相互補償的變化。","三者是解釋守恆的推理依據，不是三種不同的守恆實驗。"],"tags":["守恆","同一性","可逆性","補償性","倒水"],"trap":"「同一性理解」可以用於其他情境；考題須依完整理由辨別守恆推理。","source":"第七章圖片筆記 CH07-NOTE 08（使用者提供）；依圖卡內容整理","related":["2-09"],"galleryId":"img-7-08"},{"id":"7-09","chapter":"7","title":"七類守恆概念與經典實驗","lead":"不同守恆能力可透過不同材料及轉換檢驗，需先確保起點確實等量。","points":["數目守恆：兩排數目相同的物件，拉開其中一排間距後，數目不變。","長度守恆：兩根等長木棒原先平行對齊，移動或旋轉其中一根後，長度不變。","液體守恆：相同水量倒入不同形狀杯子，液體量不變。","質量守恆：等量黏土改變形狀後，黏土的量不變。","重量守恆：等重物體改變形狀後，重量不因形狀改變而改變。","區域／面積守恆：等面積的草地改變農舍配置後，總草地面積不變；本章圖卡的農舍數量以五間為準。","容量守恆（圖卡及教材名稱）：藉由黏土形狀改變、完全浸沒和排水量對照，討論不因形變改變的排水體積；須區別日常容器『容量』與物體體積的用語。"],"tags":["七類守恆","數目","長度","液體","質量","重量","區域","容量"],"trap":"各項實驗應維持初始控制條件；「液體量」、「重量」、「黏土排水體積」不可混成同一題型。","source":"第七章圖片筆記 CH07-NOTE 09（使用者提供）；依圖卡內容整理","related":["7-08"],"galleryId":"img-7-09"},{"id":"7-10","chapter":"7","title":"守恆發展順序與教檢應用","lead":"教材依指定守恆項目討論發展先後，考試作答須忠於題目給定的四項，而非套用完整七類順序。","points":["圖卡將約六至七歲列為數目、長度、質量及液體守恆常見發展時期，八至十歲逐漸出現重量守恆。","圖卡引用113年教檢題目，指定四項守恆順序為：數量→長度→重量→體積（教材標示答案D）。","不同能力的發展時間並非整齊切換；材料設計、訓練、文化與個人經驗可能影響表現。","注意教材『容量』與教檢題目『體積』的不同術語，必要時回看實驗具體操作。"],"tags":["113年教檢","守恆順序","數量","長度","重量","體積"],"trap":"特定試題的四項排序不是七類守恆的完整且普遍固定排序。","source":"第七章圖片筆記 CH07-NOTE 10（使用者提供）；依圖卡內容整理","related":["7-09"],"galleryId":"img-7-10"},{"id":"7-11","chapter":"7","title":"自我中心思維與觀點取替實驗","lead":"前運思期兒童在抽象觀點取替任務上可能受限，熟悉而具體的情境卻可能展現較佳能力。","points":["皮亞傑三山問題：讓兒童從不同位置觀察山模型，再推測另一人所見；幼兒常依自己視角回答。","休斯（Hughes）警官實驗：以玩偶躲避警察的具體情境測試觀點取替，部分三至五歲幼兒能有不錯表現。","兩項研究的認知要求、故事熟悉度與任務設計不同，不宜用一項結果絕對斷言幼兒無法理解他人觀點。","自我中心思維描述認知觀點的限制，不等於道德上的自私或故意不體貼。"],"tags":["三山問題","警官實驗","Hughes","觀點取替","自我中心"],"trap":"比較的是任務設計與觀點取替表現，不能用單一次測驗直接推斷全部認知能力。","source":"第七章圖片筆記 CH07-NOTE 11（使用者提供）；依圖卡內容整理","related":["7-05"],"galleryId":"img-7-11"},{"id":"7-12","chapter":"7","title":"前運思期的思維特徵與理論反思","lead":"橫跨式推理、泛靈論等是典型描述，但後續研究也凸顯情境與任務要求的重要。","points":["橫跨式推理（Transductive Reasoning）：把特定事件直接建立因果聯繫，可能忽略其他因果條件。","泛靈論（Animism）：把生命、想法或意圖歸給非生命事物；要區分真正信念與有意識的擬人化故事遊戲。","三山問題等研究支持皮亞傑部分觀察；較具體、熟悉的警官任務顯示幼兒觀點取替能力可能被低估。","評估兒童能力時，需考慮語言理解、任務難度、情境與個體差異；不能僅以年齡判斷。"],"tags":["橫跨式推理","泛靈論","三山問題","Hughes","理論反思"],"trap":"後續研究修正部分結論，不等於完全否定皮亞傑認知發展理論。","source":"第七章圖片筆記 CH07-NOTE 12（使用者提供）；依圖卡內容整理","related":["7-11","7-07"],"galleryId":"img-7-12"},{"id":"7-13","chapter":"7","title":"兒童早期的語言發展","lead":"兒童在三至六歲持續累積詞彙、語法規則與情境溝通能力。","points":["快速配對（Fast Mapping）：少數幾次接觸新詞後，先建立詞彙與指稱物的初步意義連結，之後再修正。","詞彙量與語意知識增加，孩子逐漸能使用更豐富的語句表達需求。","語法發展：學習安排詞序、組合句子及理解較複雜句式。","語用發展：依對象及情境調整用語，發展禮貌、輪流對話、解決爭執及維持對話。","圖卡以五歲前後的禮貌、對話與處理爭執能力作概略參考，不是硬性達標年齡。"],"tags":["快速配對","詞彙","語法","語用","語言發展"],"trap":"語法關注句子如何構成；語用關注如何在對象與情境中適當運用。","source":"第七章圖片筆記 CH07-NOTE 13（使用者提供）；依圖卡內容整理","related":["5-04","5-05"],"galleryId":"img-7-13"},{"id":"7-14","chapter":"7","title":"語言學習的重要概念與策略","lead":"兒童語言學習不只靠記詞，也依賴成人回應、對規則的覺察與不同線索的推理。","points":["快速配對：先建立新詞與概念的初步連結。","擴展（Expansion）：成人將兒童簡短或不完整語句擴成較完整表達，如『熊熊、蘋果』→『熊熊拿了蘋果』。","後設語言覺知：有意識觀察語言本身的結構與規則，例如比較語序如何改變意思。","語碼轉換：依對話對象及情境在不同語言或語言變體間切換。","句法提攜（Syntactic Bootstrapping）：利用句法框架推測新詞意義；語義提攜（Semantic Bootstrapping）：利用詞彙或語意線索推測語法功能。"],"tags":["擴展","快速配對","後設語言覺知","語碼轉換","句法提攜","語義提攜"],"trap":"「句法→推詞義」與「語義→推語法」方向相反，考題容易互換。","source":"第七章圖片筆記 CH07-NOTE 14（使用者提供）；依圖卡內容整理","related":["5-05","5-07"],"galleryId":"img-7-14"},{"id":"7-15","chapter":"7","title":"私我語言與自我調節","lead":"兒童對自己說話可能承擔計畫、引導與調節的功能；不同學者解讀並不相同。","points":["私我語言（Private Speech）是個體對自己說話，主要不是與他人交換訊息。","皮亞傑將自我中心語言與兒童尚未成熟的觀點協調能力連結。","維高斯基重視私我語言在行為引導、自我調節及語言內化上的作用。","圖卡整理三種教學示例：純粹自我表達、任務相關自言自語、任務導向外顯指令。","自我語言隨發展可能轉為更內隱的思考，但不同型態會因任務與情境而並存。"],"tags":["私我語言","Piaget","Vygotsky","語言內化","自我調節"],"trap":"私我語言≠全部沒有社會功能，也不是與他人對話的社會性語言。","source":"第七章圖片筆記 CH07-NOTE 15（使用者提供）；依圖卡內容整理","related":["2-10","5-06","5-07"],"galleryId":"img-7-15"},{"id":"7-16","chapter":"7","title":"促進認知與語言發展的教育支持","lead":"閱讀、社會互動、運動及適切補償教育能提供多元學習經驗，但效果依情境與支持持續性而異。","points":["閱讀與讀寫準備：共讀、說故事、描述事件並練習理解、推論與表達。","社會互動：透過提問與對話幫助兒童表達想法、理解他人並修正語言。","運動與遊戲：動作協調、視覺觀察、即時決策及策略調整相互支持。","補償教育：對教育資源及機會相對不足的孩子提供額外支持。","美國 Head Start 計畫開始於1965年，圖卡強調學前兒童多面向支持及持續介入的價值。"],"tags":["親子共讀","閱讀準備","運動","補償教育","Head Start"],"trap":"圖卡中的活動是教學例子，不能據此斷言某單一運動或計畫對所有兒童均有相同效果。","source":"第七章圖片筆記 CH07-NOTE 16（使用者提供）；依圖卡內容整理","related":["5-03","5-08","3-04"],"galleryId":"img-7-16"},{"id":"8-01","chapter":"8","title":"自我概念與自我界定","lead":"自我概念是對自身特質、能力、身分的整體認識；自我界定是表達自己是誰的具體描述。","points":["自我概念（self-concept）：涵蓋個人對自身能力、特質與身分的認知。","自我界定（self-definition）：透過語言與具體特徵描述「我是誰」。","兒童早期常描述外貌、喜好、擁有物、家庭成員及可觀察的能力。","發展後可逐漸整合多面向特徵，形成較有組織的自我理解。"],"tags":["自我概念","自我界定","自我認識"],"trap":"自我概念是整體認識，不等於某一次具體自我描述。","source":"第八章圖片筆記 CH08-NOTE 01（使用者提供）；依圖卡內容整理","related":["6-03","8-02"],"galleryId":"img-8-01"},{"id":"8-02","chapter":"8","title":"自我表徵的三階段發展","lead":"幼兒的自我描述可由片段走向連結，再逐步形成較平衡的自我表徵。","points":["單一表徵：約4歲，偏向具體、單一特徵，尚難整合不同面向。","表徵構圖：約5～6歲，開始串聯多項特徵，但容易全有全無或過度概括。","表徵系統：兒童期中期較能整合優點與不足，形成較平衡的自我評價。","真實自我是目前認為的自己；理想自我是希望成為的樣子。"],"tags":["單一表徵","表徵構圖","表徵系統","真實自我","理想自我"],"trap":"此三階段為教材整理的典型發展趨勢，非所有兒童必按同歲數完成。","source":"第八章圖片筆記 CH08-NOTE 02（使用者提供）；依圖卡內容整理","related":["8-01","8-03"],"galleryId":"img-8-02"},{"id":"8-03","chapter":"8","title":"積極主動對罪惡感","lead":"艾瑞克森第三階段著重3～6歲幼兒發展主動性與目的感。","points":["積極主動對罪惡感（initiative vs. guilt）：幼兒嘗試發起活動、規劃與負責。","成人的適當支持、清楚界線與安全引導，有助發展主動性及目的感（purpose）。","長期的羞辱、否定或不合理責備可能抑制嘗試與主動性。","適度反省與理解規範也是發展的一部分，不應將罪惡感視為一概有害。"],"tags":["艾瑞克森","積極主動","罪惡感","目的感"],"trap":"不同學者分期與實際兒童發展年齡有所差異。","source":"第八章圖片筆記 CH08-NOTE 03（使用者提供）；依圖卡內容整理","related":["6-04","8-01"],"galleryId":"img-8-03"},{"id":"8-04","chapter":"8","title":"性別發展的核心概念","lead":"性別發展須區分群體差異、角色期待、刻板印象、認同與表現等不同概念。","points":["性別差異：研究中某些群體特徵可能存在統計差異，不能據以判斷個人。","性別角色：社會文化對不同性別的行為或特質的期待。","性別塑造：個人在社會化過程中學得性別相關的觀念與行為。","性別刻板印象：將性別特徵作固定、概括的判斷。","性別認同與性別多樣性：重視每個人的自我認識與差異。"],"tags":["性別角色","性別差異","性別認同","性別刻板印象"],"trap":"群體平均差異不可推論個別兒童的能力、興趣或認同。","source":"第八章圖片筆記 CH08-NOTE 04（使用者提供）；依圖卡內容整理","related":["8-05","8-06","8-07"],"galleryId":"img-8-04"},{"id":"8-05","chapter":"8","title":"性別發展的六種理論","lead":"生物、演化、心理、認知與社會學習取向從不同角度解釋性別發展。","points":["生物學觀點：探討基因、荷爾蒙及身體因素的影響。","演化論觀點：從演化與適應歷程思考部分行為差異。","心理分析理論：重視心理歷程、認同與家庭關係。","認知發展理論：重視兒童對性別分類及穩定性的理解。","性別基模理論：兒童使用性別分類組織與詮釋資訊。","社會學習理論：觀察、模仿、回饋及增強影響性別相關行為。"],"tags":["性別發展","生物學","演化論","性別基模","社會學習"],"trap":"六種取向不是互斥的單一成因，也不表示行為差異必然由生物決定。","source":"第八章圖片筆記 CH08-NOTE 05（使用者提供）；依圖卡內容整理","related":["8-04","8-06","8-07"],"galleryId":"img-8-05"},{"id":"8-06","chapter":"8","title":"柯爾柏格性別恆定三階段","lead":"柯爾柏格提出兒童對性別類別穩定性的理解具有典型發展歷程。","points":["基本性別認定（gender identity）：約2～3歲，能辨識自己與他人的性別類別。","性別穩定（gender stability）：約4～5歲，理解性別類別在時間上具有延續性。","性別一致（gender consistency）：約6～8歲，理解外貌與活動改變不必然改變類別。","部分研究指出性別角色學習不必等到性別一致完全形成。"],"tags":["柯爾柏格","性別恆定","性別穩定","性別一致"],"trap":"此為經典認知發展模型，不能拿來判定個人的性別認同是否有效或正確。","source":"第八章圖片筆記 CH08-NOTE 06（使用者提供）；依圖卡內容整理","related":["8-04","8-05"],"galleryId":"img-8-06"},{"id":"8-07","chapter":"8","title":"性別刻板印象與社會化","lead":"性別刻板印象是對性別所作的概括推論，會經家庭、學校、同儕與媒體擴散。","points":["同一性別群體內也存在極大個別差異。","家庭分工、學校教材、同儕反應與媒體呈現都可能強化性別期待。","認知發展、性別基模與社會學習理論可補充解釋刻板印象的形成。","教學上提供多元材料、尊重個別興趣，避免「男生一定／女生一定」的要求。"],"tags":["性別刻板印象","性別社會化","個別差異"],"trap":"性別群體趨勢不等於每個孩子的特質，更不能作為教育機會限制。","source":"第八章圖片筆記 CH08-NOTE 07（使用者提供）；依圖卡內容整理","related":["8-04","8-08","8-12"],"galleryId":"img-8-07"},{"id":"8-08","chapter":"8","title":"兒童性別認同與教育支持","lead":"性別認同、性別表現與性傾向是彼此不同的概念，教育應尊重差異並維護安全。","points":["性別認同：個人對自身性別的內在認識與感受。","性別表現：透過服裝、行為、外觀及表達方式呈現自己。","性傾向：情感或性吸引對象的傾向；不能由穿著或表現推論。","DSM-5-TR 的性別不安與 ICD-11 的性別不一致，是不同診斷體系用語；性別多樣性不等同精神疾病。","學校應尊重感受、保護隱私、避免強迫改變表現，必要時提供協助。"],"tags":["性別認同","性別表現","性傾向","性別不安","性別不一致"],"trap":"教師不可依外表或喜好替兒童診斷，也不可假定性別認同、表現與性傾向必然一致。","source":"第八章圖片筆記 CH08-NOTE 08（使用者提供）；依圖卡內容整理","related":["8-04","8-07","8-28"],"galleryId":"img-8-08"},{"id":"8-09","chapter":"8","title":"四種遊戲形式","lead":"從活動形式而非玩具名稱，辨識四種常見的遊戲型態。","points":["功能性遊戲：反覆操作或動作，享受感覺與活動本身。","建構性遊戲：組合材料、建造或創作具體作品。","戲劇性遊戲：運用想像、模仿與角色扮演。","規則性遊戲：依共同約定或既定規則進行活動。","同一玩具可有不同玩法；例如積木可拿來敲打、蓋城堡或扮演電話。"],"tags":["功能性遊戲","建構性遊戲","戲劇性遊戲","規則性遊戲"],"trap":"不要只看玩具材料，應看孩子的實際行動與活動目的。","source":"第八章圖片筆記 CH08-NOTE 09（使用者提供）；依圖卡內容整理","related":["8-10","8-11"],"galleryId":"img-8-09"},{"id":"8-10","chapter":"8","title":"帕頓六種社會性遊戲","lead":"帕頓依社會參與方式整理六種遊戲類型，呈現互動特徵。","points":["非專注行為：沒有明確持續的遊戲活動。","旁觀者行為：觀看並可能與他人交談，但尚未加入活動。","單獨遊戲：獨自玩，沒有與其他孩子直接互動。","平行遊戲：在其他孩子旁邊玩相近活動，互動較少。","聯合遊戲：彼此交談、交換材料，但缺乏明確共同目標。","合作遊戲：為共同目標分工、協調角色與活動。"],"tags":["帕頓","平行遊戲","聯合遊戲","合作遊戲"],"trap":"六類是行為觀察分類，不是固定且不可逆的發展階梯。","source":"第八章圖片筆記 CH08-NOTE 10（使用者提供）；依圖卡內容整理","related":["8-09","8-11","8-13"],"galleryId":"img-8-10"},{"id":"8-11","chapter":"8","title":"三位學者的遊戲理論比較","lead":"皮亞傑、史密蘭斯基與帕頓分別從認知發展、活動形式及社會參與角度分類遊戲。","points":["皮亞傑：遊戲形式與認知發展相關，包含練習、象徵與規則遊戲。","史密蘭斯基：按活動內容與操作方式分功能性、建構性、戲劇性、規則性遊戲。","帕頓：按與他人的社會互動方式，分非專注、旁觀、單獨、平行、聯合與合作遊戲。","同一個餐廳角色扮演活動可同時是「戲劇性遊戲」與「合作遊戲」。"],"tags":["皮亞傑","史密蘭斯基","帕頓","遊戲理論"],"trap":"三套分類彼此平行，不能用某套的類別直接對應另一套的固定階段。","source":"第八章圖片筆記 CH08-NOTE 11（使用者提供）；依圖卡內容整理","related":["8-09","8-10"],"galleryId":"img-8-11"},{"id":"8-12","chapter":"8","title":"遊戲中的性別與文化影響","lead":"遊戲偏好受到個人、文化、家庭、同儕與媒體多重因素影響。","points":["研究可能呈現群體平均趨勢，但兒童的個別差異很大。","家庭、同儕、文化傳統與媒體提供不同遊戲經驗及社會角色示範。","相似活動在不同文化中可能具有不同目的和意義。","教師宜提供多元、開放且不受性別限制的遊戲材料與機會。"],"tags":["遊戲偏好","性別","文化","刻板印象"],"trap":"避免把群體趨勢當作每個孩子的性別本質或能力限制。","source":"第八章圖片筆記 CH08-NOTE 12（使用者提供）；依圖卡內容整理","related":["8-07","8-09"],"galleryId":"img-8-12"},{"id":"8-13","chapter":"8","title":"同儕關係與利社會行為","lead":"同儕關係提供友誼、合作與社會學習的機會；利社會行為是促進他人福祉的自發行動。","points":["同儕關係不等於友誼；同儕接納與同儕地位也不等同關係親密度。","同儕地位可區分受歡迎、被拒絕、被忽略、受爭議與普通等社會計量類型。","利社會行為如幫助、分享、安慰與合作；利他行為強調以他人利益為主要動機。","同理心與利社會行為相關，但理解他人感受不一定導致助人。","良好的互動可練習溝通、衝突協商、自我概念及團體歸屬感。"],"tags":["同儕","友誼","同儕地位","同理心","利社會行為"],"trap":"被忽略不等於被拒絕；利社會行為也不全都是不求回報的利他行為。","source":"第八章圖片筆記 CH08-NOTE 13（使用者提供）；依圖卡內容整理","related":["8-10","8-19","8-21"],"galleryId":"img-8-13"},{"id":"8-14","chapter":"8","title":"四種親職教養風格","lead":"父母教養風格可以透過要求／控制程度與回應／涉入程度的組合來辨識。","points":["權威開明型（authoritative）：高要求、高回應；有規範且願意溝通。","專制威權型（authoritarian）：高要求、低回應；強調服從與控制。","寬容放任型（permissive）：低要求、高回應；支持較多但限制較少。","忽視冷漠型（neglectful）：低要求、低回應；監督與情感支持不足。","Baumrind 提出三種主要教養風格，Maccoby 與 Martin 擴展成四類。"],"tags":["Baumrind","Maccoby","Martin","要求程度","回應程度"],"trap":"高要求不必然等於威權；關鍵是「要求」與「回應」的搭配。","source":"第八章圖片筆記 CH08-NOTE 14（使用者提供）；依圖卡內容整理","related":["6-02","8-15","8-18"],"galleryId":"img-8-14"},{"id":"8-15","chapter":"8","title":"兒童管教、懲罰與體罰","lead":"管教、懲罰與體罰在目的及方式上不同；有效管教重視引導與自我管理。","points":["管教（discipline）：用規範、引導、示範與回饋培養適當行為。","懲罰（punishment）：以降低行為未來發生機率為判準；正性／負性指增加／移除刺激。","體罰（corporal punishment）：使用身體力量造成疼痛或不適，以試圖控制行為。","正向管教包括明確規範、同理溝通、適當回饋及修復責任。","教材引用臺灣教育法規禁止體罰；實際規範應以現行法令為準。"],"tags":["管教","懲罰","體罰","正向管教"],"trap":"行為學「正、負」不等於好或壞；懲罰不必然是體罰。","source":"第八章圖片筆記 CH08-NOTE 15（使用者提供）；依圖卡內容整理","related":["8-14","8-26"],"galleryId":"img-8-15"},{"id":"8-16","chapter":"8","title":"直升機父母與小飛俠症候群","lead":"過度保護、介入與控制可能減少孩子練習自主及負責的機會。","points":["直升機父母是描述過度監督、過度介入或控制的教養現象。","可能涉及代替孩子做決定、過度排除風險、限制自主練習。","小飛俠症候群是描述部分成年人逃避責任的通俗心理學用語，非 DSM／ICD 正式診斷。","過度介入與後續適應的關係需要依研究、年齡及背景解讀，不能簡化成單向因果。","適切的支持是提供安全、協助與年齡合宜的選擇空間。"],"tags":["直升機父母","小飛俠症候群","自主性","責任能力"],"trap":"不可把兩個概念視為相同，或據此診斷孩子。","source":"第八章圖片筆記 CH08-NOTE 16（使用者提供）；依圖卡內容整理","related":["8-14","8-17"],"galleryId":"img-8-16"},{"id":"8-17","chapter":"8","title":"Bowen 家庭系統與三角關係","lead":"Bowen 家庭系統理論強調家庭成員之間的情緒互動與角色關係。","points":["自我分化：在維持情感連結時，仍能獨立思考並調節情緒。","三角關係：三人構成的關係系統；三角化是二人緊張時拉入第三者的過程。","家庭投射歷程：父母可能將焦慮或關注投向子女，影響互動。","三角化、跨世代聯盟、代罪羔羊與親職化彼此相關但不完全相同。","親職化指兒童長期承擔超出年齡適合的照顧或情緒責任。"],"tags":["Bowen","家庭系統","自我分化","三角化","親職化"],"trap":"適當幫忙家務不等於親職化，須看責任程度及對兒童需求的影響。","source":"第八章圖片筆記 CH08-NOTE 17（使用者提供）；依圖卡內容整理","related":["8-14","8-18"],"galleryId":"img-8-17"},{"id":"8-18","chapter":"8","title":"現代親職焦慮與家庭社經差異","lead":"親職焦慮、家庭社經地位與文化條件共同形塑教育機會和教養壓力。","points":["現代親職壓力可與教育競爭、成就期待、資訊負荷、工作照顧壓力及社會比較有關。","社經地位常用家庭收入、父母教育程度、職業與工作條件等面向描述。","不同家庭可能在學習資源、陪伴時間、生活環境與社會支持上有差異。","社經地位不能視為親職品質或對孩子關心程度的直接代名詞。","教師宜尊重家庭差異，提供公平機會、彈性溝通與可近用支持。"],"tags":["親職焦慮","社經地位","家庭資源","教育公平"],"trap":"家庭資源與兒童結果的相關不等於單一原因。","source":"第八章圖片筆記 CH08-NOTE 18（使用者提供）；依圖卡內容整理","related":["8-14","8-17"],"galleryId":"img-8-18"},{"id":"8-19","chapter":"8","title":"兒童攻擊行為的基本分類","lead":"兒童攻擊行為可依意圖與功能辨識工具性、敵意性及關係性攻擊。","points":["工具性攻擊：以攻擊作為達成其他目標的手段，例如推擠以搶玩具。","敵意性攻擊：主要目的是傷害對方，常與憤怒或報復相伴。","關係性攻擊：藉由排擠、威脅友誼或散播謠言傷害人際關係。","三類可同時出現，判斷須考慮行為目的、意圖與情境。"],"tags":["工具性攻擊","敵意性攻擊","關係性攻擊"],"trap":"不能只看行為表面型態；也不可由單一事件推斷固定人格。","source":"第八章圖片筆記 CH08-NOTE 19（使用者提供）；依圖卡內容整理","related":["8-20","8-21","8-23"],"galleryId":"img-8-19"},{"id":"8-20","chapter":"8","title":"攻擊行為的進階分類","lead":"攻擊行為可從「如何造成傷害」與「為何發生」兩個不同向度比較。","points":["外顯攻擊：以直接肢體或語言行為傷害他人。","關係性攻擊：破壞友誼、團體接納或社會地位。","反應性攻擊：受到真實或自認的挑釁時，憤怒或防衛性反擊。","主動性攻擊：為達利益、地位或控制而主動攻擊。","外顯／關係性和反應性／主動性是交叉向度，可以同時存在。"],"tags":["外顯攻擊","關係性攻擊","反應性攻擊","主動性攻擊"],"trap":"把「外顯」等同「主動」或把「關係性」等同「反應性」，都混淆不同分類軸。","source":"第八章圖片筆記 CH08-NOTE 20（使用者提供）；依圖卡內容整理","related":["8-19","8-21"],"galleryId":"img-8-20"},{"id":"8-21","chapter":"8","title":"攻擊行為的形成與媒體影響","lead":"攻擊行為形成可能受個人特質、認知、家庭、同儕與媒體環境共同影響。","points":["可能因素包括氣質、情緒調節、敵意歸因偏誤、家庭衝突、同儕回饋與文化情境。","Bandura 社會學習歷程可從注意、保留、再現、動機理解觀察學習。","敵意歸因偏誤是把含糊行為解讀成帶有惡意。","媒體暴力可能與某些攻擊認知或行為有關，但不代表觀看後必然模仿。","教育宜示範非暴力溝通、辨識歸因偏誤、練習衝突解決並提供支持。"],"tags":["Bandura","社會學習","敵意歸因偏誤","媒體影響"],"trap":"觀察到攻擊不代表一定模仿；相關性也不能直接推斷唯一因果。","source":"第八章圖片筆記 CH08-NOTE 21（使用者提供）；依圖卡內容整理","related":["8-19","8-22","8-23"],"galleryId":"img-8-21"},{"id":"8-22","chapter":"8","title":"網路使用、社群媒體與青少年幸福感","lead":"社群媒體可能提供支持、學習和創造機會，也可能伴隨比較、衝突與壓力。","points":["主動社交、線上學習、內容創作、被動瀏覽與線上遊戲是不同的使用方式。","可能有維繫友誼、學習交流、創意表達、獲得支持等正向經驗。","可能有社會比較、網路衝突、接觸不當內容、睡眠與學習受擾等風險。","研究對上網時間與幸福感的結果不一致，需納入使用內容、動機、個體與家庭文化背景。","教師與家長可聚焦數位素養、時間安排、正向互動及求助管道。"],"tags":["社群媒體","網路使用","幸福感","數位素養"],"trap":"不能用「上網時間愈多幸福感一定愈低」概括所有兒童與青少年。","source":"第八章圖片筆記 CH08-NOTE 22（使用者提供）；依圖卡內容整理","related":["8-21","8-23"],"galleryId":"img-8-22"},{"id":"8-23","chapter":"8","title":"嚴重攻擊行為的多重風險因素","lead":"嚴重攻擊或校園暴力涉及多個風險因素的長期交互作用。","points":["可從生理神經、心理認知、家庭人際、社會文化與當下情境理解風險。","情緒調節、壓力、負面互動與危險物品接近等可能增加風險。","沒有單一疾病、性格或家庭類型足以預測個人是否會發生嚴重暴力。","風險因素不等於必然原因；避免污名化精神疾病、自閉症或家庭背景。","教育重點是早期辨識、提供支持、建構安全環境及跨專業合作。"],"tags":["暴力風險","多重因素","個別差異","安全支持"],"trap":"不得依單一診斷或個人特質給孩子貼上暴力人格標籤。","source":"第八章圖片筆記 CH08-NOTE 23（使用者提供）；依圖卡內容整理","related":["8-19","8-21","8-24"],"galleryId":"img-8-23"},{"id":"8-24","chapter":"8","title":"大腦發展與攻擊行為調節","lead":"前額葉、杏仁核及相關神經網路共同參與情緒與衝動調節。","points":["前額葉皮質參與規劃、決策、抑制控制與行為評估。","杏仁核參與情緒重要性偵測、威脅處理與情緒學習。","情緒與行為調節由相互連結的網路參與，並非單一腦區獨立決定。","神經系統持續成熟，兒童的自我調節也與生活經驗及支持環境相關。","可透過情緒辨識、停頓練習、問題解決及支持性教學促進調節。"],"tags":["前額葉","杏仁核","腦神經","情緒調節"],"trap":"不能把攻擊行為簡化成「杏仁核太活躍」或「前額葉受損」。","source":"第八章圖片筆記 CH08-NOTE 24（使用者提供）；依圖卡內容整理","related":["8-20","8-23"],"galleryId":"img-8-24"},{"id":"8-25","chapter":"8","title":"社會鍵理論、破窗理論與教育應用","lead":"社會鍵理論與破窗理論從社會連結與環境秩序理解偏差行為。","points":["Hirschi 社會鍵理論包含依附、承諾、參與與信念四個面向。","社會連結與規範認同可能與偏差行為的減少有關。","Wilson 與 Kelling 破窗理論提出可見失序可能影響人們對規範及社會控制的感受。","破窗理論在因果推論與實證效果方面存有限制及爭議。","教育上可建立歸屬感、正向參與與安全有序的環境，避免把環境外觀當成對兒童的道德評判。"],"tags":["Hirschi","社會鍵理論","破窗理論","偏差行為"],"trap":"理論解釋不是個體預測公式；環境失序與犯罪沒有簡單必然因果。","source":"第八章圖片筆記 CH08-NOTE 25（使用者提供）；依圖卡內容整理","related":["8-21","8-26"],"galleryId":"img-8-25"},{"id":"8-26","chapter":"8","title":"校園霸凌辨識與防制","lead":"校園霸凌需辨識故意性、持續性、行為方式與造成的損害，並依法通報處理。","points":["霸凌可呈現言語、肢體、關係、網路等形式；校內及校外皆可能發生。","觀察持續不當行為及對身心、財產或學習的影響，必要時依現行準則確認定義。","單次衝突未必符合霸凌定義，但嚴重傷害與安全問題仍須處理。","教師知悉疑似霸凌，應先保護安全、即時通報並交由權責機制處理。","可透過班級規範、同理與衝突解決、可信賴的求助管道及親師合作預防。"],"tags":["校園霸凌","霸凌辨識","言語霸凌","關係霸凌","網路霸凌"],"trap":"教師無須先自行證實「一定是霸凌」才能通報。","source":"第八章圖片筆記 CH08-NOTE 26（使用者提供）；依圖卡內容整理；法規另核教育部主管法規資料庫","related":["8-27","8-29"],"galleryId":"img-8-26","sourceUrl":"https://edu.law.moe.gov.tw/LawContent.aspx?id=GL000683"},{"id":"8-27","chapter":"8","title":"校園霸凌事件處理程序","lead":"校園霸凌事件應先保護與通報，再由學校依法受理、處理與持續輔導。","points":["知悉疑似事件：先確認安全，向學校權責人員通報；依法至遲24小時完成主管機關通報。","後續包括檢舉受理、審查、調和或調查、審議、通知及持續追蹤。","圖卡整理一般生對生霸凌的處理程序；師對生及校園性別事件適用機制可能不同。","各階段期限可能分工作日、日與月，計算起點不同，應逐條查對。","正式辦理案件必須依現行《校園霸凌防制準則》及主管機關指引。"],"tags":["校園霸凌防制準則","依法通報","調和","調查"],"trap":"不可把性平事件期限、一般霸凌期限、受理通知與調查完成期限混用。","source":"第八章圖片筆記 CH08-NOTE 27（使用者提供）；依圖卡內容整理；法規另核教育部主管法規資料庫","related":["8-26","8-29"],"galleryId":"img-8-27","sourceUrl":"https://edu.law.moe.gov.tw/LawContent.aspx?id=GL000683"},{"id":"8-28","chapter":"8","title":"性平三法與校園性別事件","lead":"性平三法分別規範校園、職場與一般生活情境，適用對象與處理程序不同。","points":["《性別平等教育法》：學校課程、校園性別事件防治及校園處理機制。","《性別平等工作法》：工作場域的性別平等與性騷擾防治。","《性騷擾防治法》：適用於其法定規範範圍的性騷擾事件。","校園性別事件包含性侵害、性騷擾、性霸凌及其他依法列入的事件類型。","教師須判斷當事人身分、事件關係與適用程序，不能因發生在校外就一概排除校園法規。"],"tags":["性別平等教育法","性別平等工作法","性騷擾防治法","性平三法"],"trap":"法律的適用須依主體、事件關係及行為性質判斷。","source":"第八章圖片筆記 CH08-NOTE 28（使用者提供）；依圖卡內容整理；法規另核教育部主管法規資料庫","related":["8-08","8-29"],"galleryId":"img-8-28","sourceUrl":"https://edu.law.moe.gov.tw/LawContent.aspx?id=FL030508"},{"id":"8-29","chapter":"8","title":"校園性別事件處理與教師保護責任","lead":"疑似校園性別事件應立即保護與通報，交由法定權責機制調查處理。","points":["知悉疑似校園性別事件應立即向學校權責人員通報，依法至遲24小時完成主管機關及應有的社政通報。","由學校或主管機關的性別平等教育委員會依法調查處理，不得自行另設調查機制。","接獲申請或檢舉後的受理通知與後續調查期限，依性別平等教育法及相關準則辦理。","教師應注意即時安全、尊重、保密、適當紀錄與持續支持，避免重複詢問或自行認定成立。","本圖與 NOTE 27 的霸凌處理程序不同，須分別檢核。"],"tags":["校園性別事件","性別平等教育法","24小時","性平會","保密"],"trap":"圖卡上的日數和期間須核對事件類型與法定起算日，勿作為未查證的個案操作表。","source":"第八章圖片筆記 CH08-NOTE 29（使用者提供）；依圖卡內容整理；法規另核教育部主管法規資料庫","related":["8-27","8-28"],"galleryId":"img-8-29","sourceUrl":"https://edu.law.moe.gov.tw/LawContent.aspx?id=FL030508"},{"id":"8-30","chapter":"8","title":"繪本性平教育與 4F 提問","lead":"以多元繪本結合 4F 提問，促進身體自主、家庭多樣性及反刻板印象教育。","points":["三類繪本主題：身體自主權、多元家庭、反性別刻板印象。","4F：Facts（事實）、Feelings（感受）、Findings（發現）、Future（未來）。","透過觀察故事事件、理解角色感受、反思觀點與提出實踐方式，連結生活經驗。","教學原則包含尊重差異、安全討論、開放提問及將尊重落實於行為。"],"tags":["繪本性平教育","4F","身體自主","多元家庭"],"trap":"4F 不只是閱讀理解，也包含感受、價值反思與行動實踐。","source":"第八章圖片筆記 CH08-NOTE 30（使用者提供）；依圖卡內容整理","related":["8-07","8-08","8-28"],"galleryId":"img-8-30"},{"id":"8-31","chapter":"8","title":"第八章教檢重點總整理","lead":"第八章串聯自我、性別、遊戲、同儕、親職、攻擊行為與校園保護。","points":["自我發展：自我概念、艾瑞克森第三階段與自我表徵。","性別發展：性別認同、角色與刻板印象，認知理論與社會化。","遊戲與同儕：帕頓社會性遊戲、史密蘭斯基活動分類、利社會行為。","親職與家庭：教養風格、家庭系統、家庭文化與社會資源。","攻擊行為：工具／敵意／關係性與外顯／關係性、反應／主動等分類。","教育實務：正向管教、霸凌防制、校園性別事件及4F提問。"],"tags":["第八章總複習","考點比較","跨概念整合"],"trap":"法律類題目務必注意適用法源和題目指定的法規版本。","source":"第八章圖片筆記 CH08-NOTE 31（使用者提供）；依圖卡內容整理","related":["8-01","8-04","8-09","8-14","8-19","8-26"],"galleryId":"img-8-31"}];

小學-兒童發展與輔導.pdf","assignment":"已參照第一至第五章整理；第七章跨章節關聯","relatedNotes":["7-03"],"relatedChapters":["7"],"explanationLevel":"core"},{"id":"106-MC-14","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"106年","num":14,"stem":"在一個為國小高年級學生舉辦的人際互動團體中，小瑛提到每次別人只要看她，\n就覺得別人是在瞪她，所以就會瞪回去，並大聲駡：「看什麼看！」團體領導者\n問小瑛：「我想更了解妳的想法，妳可以再多說一點，發生了什麼事情，讓妳覺得\n別人是在瞪妳？」團體領導者使用了下列哪一項技巧？","options":{"A":"同理","B":"澄清","C":"摘要","D":"解釋"},"answer":"B","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"106國民小學-兒童發展與輔導.pdf","assignment":"尚待對照教師後續章節"},{"id":"106-MC-15","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"106年","num":15,"stem":"輔導老師與小華的晤談過程中，強力指導小華怎麼做才是對的，要成為什麼樣的人\n才會被認可。輔導老師最可能犯的錯誤是下列何者？","options":{"A":"灌輸自己的價值觀給小華","B":"沒有接受進一步的訓練與督導","C":"隱瞞了個別諮商的利弊得失與風險","D":"過度使用面質的技巧，打擊小華的自信心"},"answer":"A","context":"","page":4,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"輔導制度、倫理與兒少保護","concepts":"","filename":"106國民小學-兒童發展與輔導.pdf","assignment":"尚待對照教師後續章節"},{"id":"106-MC-16","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"106年","num":16,"stem":"小明是個十歲的國小四年級生，他不但相當善解人意，且總能用合宜的方式表達自己\n的感受。根據這樣的表現，你會認為小明的哪一種智力比較好？","options":{"A":"情緒智力","B":"結晶智力","C":"實用智力","D":"創造智力"},"answer":"A","context":"","page":4,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"","filename":"106國民小學-兒童發展與輔導.pdf","assignment":"尚待對照教師後續章節"},{"id":"106-MC-17","chapter":"5","noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":17,"stem":"兒童聽到「獵人帶著弓箭上山去了；山上野兔很多；一隻野兔橫屍草叢裡。」的語句\n之後，認為野兔是獵人所殺。此種語言推論能力與下列何者最有關聯？","options":{"A":"快速配對(fast mapping)","B":"代碼轉換(code switching)","C":"後設語言覺察(metalinguistic awareness)","D":"語法線索覺察(syntactical bootstrapping awareness)"},"answer":"C","context":"","page":4,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"語言與讀寫發展","concepts":"","filename":"106國民小學-兒童發展與輔導.pdf", ech)"},"answer":"A","context":"","page":3,"explanation":"核心觀念｜維高斯基的內在語言：維高斯基認為，兒童在社會互動中接觸語言，逐漸把語言用於引導自己的行動。出聲的私我語言可進一步內化為不出聲的內在語言，支持思考、計畫與自我調節。圖卡提供的發展年齡是概略參考，不宜解讀成固定的轉換日期。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"維高斯基","filename":"108-1國民小學-兒童發展與輔導(1).pdf","assignment":"已參照第一至第五章整理；第七章跨章節關聯","relatedNotes":["7-15"],"relatedChapters":["7"],"explanationLevel":"core"},{"id":"1081-MC-09","chapter":"8","noteId":"8-18","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":9,"stem":"李老師發現班上小莉的家庭屬於混合家庭(blended family)，下列敘述何者正確？","options":{"A":"小莉的家庭為三代同堂","B":"小莉的家庭為重組家庭","C":"小莉同時擁有繼父和繼母","D":"小莉的父母共同監護小莉"},"answer":"B","context":"","page":3,"explanation":"核心觀念｜現代親職焦慮與家庭社經差異：家庭型態與適應：混合家庭涉及父母再婚後的家庭組成及角色調整，須區分家庭結構的描述與對兒童適應的價值判斷。不能因家庭型態直接推論教養品質。","review":"文字擷取，待逐題複核","theme":"道德、家庭與同儕關係","concepts":"親職焦慮、社經地位、家庭資源","filename":"108-1國民小學-兒童發展與輔導(1).pdf","assignment":"已依第八章圖卡概念對照（未完成逐選項辨析）"},{"id":"1081-MC-10","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":10,"stem":"陳老師規劃全校學生輔導工作計畫，以促進學生心理健康與社會適應。此計畫最符合\n下列哪一項輔導？","options":{"A":"發展性輔導","B":"介入性輔導","C":"處遇性輔導","D":"危機性輔導"},"answer":"A","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"輔導制度、倫理與兒少保護","concepts":"","filename":"108-1國民小學-兒童發展與輔導(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"1081-MC-11","chapter":"6","noteId":"6-16","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":11,"stem":"根據「兒童及少年福利與權益保障法」，學校人員發現國小學生施用毒品，須於多少\n小時內向當地政府通報？","options":{"A":"12","B":"24","C":"36","D":"48"},"answer":"B","context":"","page":3,"explanation":"依題目所問的兒少保護通報規定，學校人員知悉法定事項應立即通報，最遲不得超過 24 小時。此題應以原考試年度的法規語境理解，實務請查核現行條文。","review":"文字擷取，待逐題複核","theme":"輔導制度、倫理與兒少保護","concepts":"兒少保護法定通報","filename":"108-1國民小學-兒童發展與輔導(1).pdf","assignment":"已對照第六章筆記與圖卡"},{"id":"1081-MC-12","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":12,"stem":"下列有關小瑞對輔導教師的談話內容，何者不須保密？","options":{"A":"提到他有次考試作弊","B":"提到在家中，爸爸常常打他和媽媽","C":"提 :"","type":"past","source":"歷屆教師資格考試","year":"111年","num":22,"stem":"教師資格考試結束後，幾位考生收到成績時分別有下列的反應：\n志明說：「今年題目特別難，我才會不及格。」\n春嬌說：「考試當天我身體不舒服，才會考這麼差！」\n國強說：「我用紫微斗數算過，知道自己今年考運很讚！」\n芳瑜說：「我本來就真的很不會考試啊！」\n根據溫納(B. Weiner)的歸因理論，下列何者正確？","options":{"A":"志明使用外在、可控制的歸因","B":"春嬌使用內在、不穩定的歸因","C":"國強使用外在、穩定的歸因","D":"芳瑜使用內在、可控制的歸因"},"answer":"B","context":"","page":5,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"學習動機與自我調整","concepts":"溫納","filename":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"111-MC-23","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"111年","num":23,"stem":"張老師向全班說明接下來的時間要同學各自做習作練習題，他注意到小方傳一張便利貼\n給小潔。張老師一邊繼續說明一邊走向小潔，不動聲色地拿走便利貼。此屬於下列\n何種班級經營技巧的應用？","options":{"A":"全面掌控(withitness)","B":"團體聚焦(group focus)","C":"同時進行多項活動(overlapping)","D":"動作管理(movement management)"},"answer":"A","context":"","page":5,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"行為學習與班級經營","concepts":"","filename":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"111-MC-24","chapter":"8","noteId":"8-15","type":"past","source":"歷屆教師資格考試","year":"111年","num":24,"stem":"全班同學跑完操場十圈之後，體育老師對著又餓又累急於下課的同學說：「你們什麼\n時候把體育用品整理好，就什麼時候下課。」老師運用的是下列何種機制？","options":{"A":"消弱","B":"負增強","C":"剝奪式懲罰","D":"施予式懲罰"},"answer":"B","context":"","page":5,"explanation":"核心觀念｜兒童管教、懲罰與體罰：行為後果與增強：以能否下課作為行為後果，須辨識行為後添加或移除的刺激及其對未來行為的影響；正、負不表示好壞。","review":"文字擷取，待逐題複核","theme":"行為學習與班級經營","concepts":"管教、懲罰、體罰","filename":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","assignment":"已依第八章圖卡概念對照（未完成逐選項辨析）"},{"id":"111-MC-25","chapter":"5","noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"111年","num":25,"stem":"陳老師是國小一年級的導師。有一天，班上小朋友非常吵鬧，陳老師很生氣地說：\n「你們的聲音快把屋頂掀掉了！」小朋友看著屋頂滿臉疑惑的說：「屋頂好好的啊！」\n針對小朋友的反應，下列解釋何者較為正確？","options":{"A":"學生對陳老師這麼說很不高興，所以故意說那些話氣陳老師","B":"這班學生可能在語言上有發展遲緩的現象，才會聽不懂陳老師的話","C":"當時班上實在太吵了，學生沒有注意陳老師說什麼，所以聽不懂老師的話","D":"理解比喻和反諷語的發展年齡較晚，小一學生聽不懂陳老師的話是正常的"},"answer":"D","context":"","page":6,"explanation":"已核對官方選擇題答案；本題尚未完成逐選 ,"noteId":"","type":"past","source":"歷屆教師資格考試","year":"112年","num":5,"stem":"小慧全家從北部搬到南部，因而轉學到新學校。他很快就熟悉學校周遭的環境，能跟\n老師及同學有不錯的互動，也能掌握導師的期許和班規。依據史坦伯格(R. Sternberg)\n的智力三元論，大智展現了哪一種智力？","options":{"A":"情境智力(contextual intelligence)","B":"經驗智力(experiential intelligence)","C":"社交智力(interpersonal intelligence)","D":"組合智力(componential intelligence)"},"answer":"A","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"史坦伯格","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"尚待對照教師後續章節"},{"id":"112-MC-06","chapter":"2","noteId":"2-12","type":"past","source":"歷屆教師資格考試","year":"112年","num":6,"stem":"下列哪些是個人中心學派治療關係的要件？\n甲、同情心\n乙、真誠一致\n丙、積極鼓勵\n丁、無條件積極關注","options":{"A":"甲乙","B":"甲丁","C":"乙丙","D":"乙丁"},"answer":"D","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"已參照第一至第五章整理"},{"id":"112-MC-07","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"112年","num":7,"stem":"下列何者不是小團體初期階段的重要目標？","options":{"A":"確立成員須共同遵守的規範","B":"協助成員感到自己是團體的一份子","C":"協助成員深入了解、掌握與發展自我","D":"幫助成員建立自己參與團隊的個人目標"},"answer":"C","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"尚待對照教師後續章節"},{"id":"112-MC-08","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"112年","num":8,"stem":"學生跟老師說：「每次分組，小豪都拒絕跟我同組，他是不是在排擠我？｣下列老師的\n回答，何者是較具有同理心的回應？","options":{"A":"「是他自己有問題，你不要理他。｣","B":"「你很難過，覺得自己不被接納。｣","C":"「別這麼說，事情應該不是這樣。｣","D":"「你這樣想，對你一點好處都沒有。｣"},"answer":"B","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"同理/我訊息","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"尚待對照教師後續章節"},{"id":"112-MC-09","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"112年","num":9,"stem":"下列哪一個學派主張將諮商的目標放在具體的問題行為上，以可觀察、可測量的行為\n來敘述諮商的目標，且特別強調提出具體、明確的解決步驟？","options":{"A":"心理分析學派","B":"認知治療學派","C":"行為治療學派","D":"個人中心學派"},"answer":"C","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"尚待對照教師後續章節"},{"id":"112-MC-10","chapter":"2","noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"112年","num":10,"stem":"小英這次閱讀測驗考了65 分，遠低於全班的平均成績，所以林老師讓他放學後留下\n接受課後輔導。老師使用交互教學法(reciprocal teaching) 教小英摘要與提問等閱讀\n策略，並逐漸將責任轉移給小英。小英在一週後重寫相同測驗的複本，得到了85 分。\n根據以上的情境，下列敘述何者錯誤？","options":{"A":"老師的作法符合維高思基(L. Vygotsky) 的社會文化論","B":"老師提供的鷹架(scaffolding) 有助於提升小英的閱讀表現","C":"85 分代表小英的近側發展區(zone of proximal development, ZPD)","D":"65 分可視為小英近側發展區(zone of proximal development, ZPD) 的下限"},"answer":"C","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"維高斯基、近側發展區與鷹架","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"已參照第一至第五章整理"},{"id":"112-MC-11","chapter":"7","noteId":"7-05","type":"past","source":"歷屆教師資格考試","year":"112年","num":11,"stem":"老師給小元看兩個盒子，一個盒子有泡芙圖案，另一個則有糖果圖案。老師在小元\n面前把泡芙放入糖果圖案的盒子。這時，老師問小元：「等一下小華進來後，會到\n哪個盒子找泡芙吃？」老師主要想測試小元的哪一種能力？","options":{"A":"自我調節(self-regulating)","B":"道德推理(moral reasoning)","C":"語言組成(language making)","D":"觀點取替(perspective taking)"},"answer":"D","context":"","page":3,"explanation":"核心觀念｜心智理論與觀點取替：心智理論涉及理解他人具有自己的知識、信念與觀點，而且可能不同於自己的所知。盒子情境要求兒童推測「沒有看到實際放置過程的人」會根據什麼資訊尋找物品，考查的是能否從另一人的資訊條件與觀點推論其行動，而不只是依自己的所見回答。","review":"文字擷取，待逐題複核","theme":"道德、家庭與同儕關係","concepts":"心智理論與觀點取替","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"已對照第七章圖卡與文字筆記","explanationLevel":"core","relatedNotes":["7-11"]},{"id":"112-MC-12","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"112年","num":12,"stem":"下列敘述何者不符合柯柏格(L. Kohlberg) 道德發展階段論的觀點？","options":{"A":"發展階段的前後順序會因不同文化而異","B":"道德發展可依俗例(convention) 分為三期(levels)","C":"發展階段所提供的道德思考架構，可應用至各種情境", 下列何者較能\n說明怡君安慰妹妹的現象？","options":{"A":"怡君能夠清楚意識到自己的情緒","B":"怡君對於自己的情緒調節掌握得很好","C":"怡君非常遵守文化中情緒表達的規則","D":"怡君能根據過去經驗預測並理解妹妹的情緒"},"answer":"D","context":"","page":6,"explanation":"姊姊根據過往與母親短暫分離的經驗，預測妹妹可能害怕並給予安慰，重點是對他人情緒的理解。此題用學齡兒童情境考跨年齡的社會情緒能力。","review":"文字擷取，待逐題複核","theme":"情緒、人格與自我發展","concepts":"社會覺察與理解他人情緒","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"已對照第六章筆記與圖卡"},{"id":"112-MC-25","chapter":"8","noteId":"8-13","type":"past","source":"歷屆教師資格考試","year":"112年","num":25,"stem":"五年級的小貞和小惠是好朋友，他們常常聊天分享生活點滴。最近小貞的父母發生\n一些爭吵，小貞和小惠每天談論父母的問題，他們的心情也因此跟著低落下來。\n此一現象符應下列哪一個概念？","options":{"A":"同儕壓力(peer pressure)","B":"共同反芻(co-rumination)","C":"替代學習(vicarious learning)","D":"負增強陷阱(negative reinforcement trap)"},"answer":"B","context":"","page":6,"explanation":"核心觀念｜同儕關係與利社會行為：同儕情緒互動：朋友互相傾聽可提供支持，但持續反覆討論問題、彼此放大擔憂也可能讓負向情緒相互增強。","review":"文字擷取，待逐題複核","theme":"道德、家庭與同儕關係","concepts":"同儕、友誼、同儕地位","filename":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","assignment":"已依第八章圖卡概念對照（未完成逐選項辨析）"},{"id":"113-MC-01","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":1,"stem":"小元是班上最擅長組裝積木模型的人，甚至不需要說明書就可以拼出複雜的物件，讓\n同學們都非常敬佩。若根據迦納(H. Gardner)的觀點，小元於下列何種智力展現較獨特的\n優勢能力？","options":{"A":"內省","B":"空間","C":"人際","D":"肢體動覺"},"answer":"B","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"迦納","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"113-MC-02","chapter":"7","noteId":"7-08","type":"past","source":"歷屆教師資格考試","year":"113年","num":2,"stem":"兒童若能瞭解「8 + 6 = 14」，以及「14 −6 = 8」，需要具備下列何種運思能力？","options":{"A":"集中性","B":"遞移性","C":"可逆性","D":"恆存性"},"answer":"C","context":"","page":2,"explanation":"核心觀念｜可逆性與反向運思：可逆性是能在心中將某項操作反向還原，理解變化前後的關係。知道「8＋6＝14」可以反向得到「14－6＝8」，顯示能協調加法與減法的逆向關係。可逆性也是具體運思的重要特徵，並能作為理解守恆現象的推理依據之一。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"可逆性與反向運思","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"已對照第七章圖卡與文字筆記","explanationLevel":"core","relatedNotes":["7-06"]},{"id":"113-MC-03","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":3,"stem":"月考後，小勤說：「我考了92 分，只差1 分就是全班最高分，我下次一定要考\n第一名。」從目標導向(goal orientation)的觀點，小勤為下次考試設定的目標屬於下列\n何者？","options":{"A":"逃避精熟目標","B":"趨向精熟目標","C":"逃避表現目標","D":"趨向表現目標"},"answer":"D","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"學習動機與自我調整","concepts":"","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"113-MC-04","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":4,"stem":"小勻經常使用社交平台分享自己的生活，觀看別人的日常動態，建立更多社交連結。\n小勻也熱愛蝴蝶，常利用平台觀看不同種類蝴蝶幼蟲成長與蛻變過程的紀錄片。根據\n馬斯洛(A. Maslow)的需求理論，小勻是為了滿足下列哪些層次的需求？","options":{"A":"自尊、安全","B":"自尊、認知","C":"愛與隸屬、認知","D":"愛與隸屬、自我實現"},"answer":"C","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"學習動機與自我調整","concepts":"馬斯洛","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"113-MC-05","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":5,"stem":"小安認為考試不應該作弊，因為作弊會得到本來不應得的分數，這樣對其他考生不公平。\n根據柯柏格(L. Kohlberg)的道德發展理論，小安處於下列何種階段？","options":{"A":"相對功利取向","B":"社會契約取向","C":"尋求認可取向","D":"法律與秩序取向"},"answer":"B","context":"","page":2,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"道德、家庭與同儕關係","concepts":"柯柏格","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"113-MC-06","chapter":"2","noteId":"2-09","type":"past","source":"歷屆教師資格考試","year":"113年","num":6,"stem":"皮亞傑(J. Piaget)的認知理論中，兒童對保留概念的發展順序，下列何者正確？","options":{"A":"重量保留→數量保留→長度保留→質量保留","B":"長度保留→數量保留→體積保留→重量保留","C":"質量保留→重量保留→數量保留→體積保留","D":"數量保留→長度保留→重量保留→體積保留"},"answer":"D","context":"","page":2,"explanation":"核心觀念｜守恆能力的發展順序：守恆是理解外觀、排列或容器改變時，若原有數量未增減，其特定的量仍保持不變。依本題及第七章圖卡所列的四項，發展順序為「數量→長度→重量→體積」。這是針對題目指定項目的比較，不應誤認為七類守恆能力都有完全固定且一致的成熟時點。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"皮亞傑","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"已參照第一至第五章整理；第七章跨章節關聯","relatedNotes":["7-10","7-09"],"relatedChapters":["7"],"explanationLevel":"core"},{"id":"113-MC-07","chapter":"8","noteId":"8-15","type":"past","source":"歷屆教師資格考試","year":"113年","num":7,"stem":"六年級的小志常故意「為反對而反對」，在課堂上與任課老師起衝突，導師也收到不少\n學校師生的投訴。導師可以採用下列哪些正向管教的措施？\n甲、要求小志對任課老師口頭道歉\n乙、理解小志和老師衝突的背後原因\n丙、討論和老師持續發生衝突的可能後果\n丁、當小志和老師理性溝通時，給予稱讚","options":{"A":"甲乙丙","B":"甲乙丁","C":"乙丙丁","D":"甲丙丁"},"answer":"C","context":"","page":3,"explanation":"核心觀念｜兒童管教、懲罰與體罰：正向管教：透過明確規範、尊重溝通、替代行為與修復責任來減少失序，而不是只靠威嚇、羞辱或體罰。","review":"文字擷取，待逐題複核","theme":"行為學習與班級經營","concepts":"管教、懲罰、體罰","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"已依第八章圖卡概念對照（未完成逐選項辨析）"},{"id":"113-MC-08","chapter":"1","noteId":"1-03","type":"past","source":"歷屆教師資格考試","year":"113年","num":8,"stem":"研究發現同一家庭長大的同卵雙胞胎，其智商的相關係數高於在不同家庭長大的同卵\n雙胞胎。根據以上結果推論智商跟遺傳或環境的關聯性，下列何者正確？","options":{"A":"智商與環境有關","B":"智商與遺傳有關","C":"智商與遺傳無關，與環境也無關","D":"智商與遺傳有關，與環境也有關"},"answer":"A","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"生理發展與腦神經","concepts":"","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"已參照第一至第五章整理"},{"id":"113-MC-09","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":9,"stem":"小華在期末的游泳課中沒有通過50 公尺自由式測驗，他很失落地告訴老師：「真不公平！\n我的水道剛好在最旁邊，游泳時一直怕自己會碰到牆壁！」小華的歸因最符合下列何者？","options":{"A":"內在、穩定、可控","B":"內在、穩定、不可控","C":"外在、不穩定、可控","D":"外在、不穩定、不可控"},"answer":"D","context":"","page":3,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"學習動機與自我調整","concepts":"","filename":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"113-MC-10","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"113年","num":10,"stem":"根據阿德勒學派的觀點，下列何者是德萊克斯(R. Dreikurs)認為兒童不當行為的可能\n原因？","options":{"A":"低自我控制","B":"偏差同儕影響","C":"錯誤的行為目標","D":"社會連結不完整"},"answer":"C","context":"","page":3,"explanation":"已核對官方選擇題 chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"114年","num":18,"stem":"小達最近作業經常缺交，老師欲以三明治溝通法與家長溝通此事。以下哪一種對話\n方式較符合？","options":{"A":"「您把小達教得很好，平時熱心助人，但他最近作業經常缺交，再不注意可能就\n跟不上進度。」","B":"「小達雖然很聰明，但他最近經常沒交作業。輔導老師說能幫忙此事，您是否同意\n我請輔導老師協助小達？」","C":"「小達最近作業時常未交，可能與他在家中的作息有關，我知道您很關心他的\n學習，我需要您一起幫忙改善他的作息。」","D":"「您把小達教得很好，平時熱心助人，但他最近作業經常缺交，請您協助了解他\n的學習困難，有您的支持他定能做得更好。」"},"answer":"D","context":"","page":5,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"114-MC-19","chapter":"7","noteId":"7-03","type":"past","source":"歷屆教師資格考試","year":"114年","num":19,"stem":"小信能理解即使將水倒入形狀不同的容器，總量仍不改變。他也能依長短將吸管排列\n順序，並逐漸可以同時考慮事物的多個面向。下列何者最符合小信的認知發展？","options":{"A":"能對具體事物進行邏輯思考","B":"能以抽象邏輯進行假設推理","C":"主要學習方式是模仿教師行為","D":"傾向單一視角，難理解因果關係"},"answer":"A","context":"","page":5,"explanation":"核心觀念｜具體運思期：守恆、序列與去集中化：能理解倒入不同容器後水的總量不變，表示具備液體守恆；能按照吸管長短排序，涉及序列能力；能兼顧多個面向，則顯示逐漸去集中化。這些都是皮亞傑具體運思期的典型表現，代表可針對具體事物進行邏輯操作，尚不等於成熟的抽象假設推理。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"具體運思期：守恆、序列與去集中化","filename":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"已對照第七章圖卡與文字筆記","explanationLevel":"core","relatedNotes":["7-08"]},{"id":"114-MC-20","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"114年","num":20,"stem":"下列對於注意力缺陷過動症的描述何者正確？\n甲、多數個案是在幼年時期就出現症狀\n乙、在國內被歸類為情緒行為障礙類別\n丙、目前尚無藥物能改善注意力缺陷過動之症狀\n丁、分為四大類：過動衝動、注意力不足、幻想型及合併型","options":{"A":"甲乙","B":"甲丁","C":"乙丙","D":"丙丁"},"answer":"A","context":"","page":5,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"特殊需求與學生適應","concepts":"ADHD","filename":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"114-MC-21","chapter":"2","noteId":"","type":"past","source":"歷屆教師資格考試","year":"114年","num":21,"stem":"小林說：「『不能在教室吃口香糖』的班規不合理，不需要遵守它。」小嘉認為學生就\n應該要遵守老師訂下的規矩。根據皮亞傑(J. Piaget)的理論，小嘉的想法最符合下列\n何種道德發展的特性？","options":{"A":"認為規則是一套廣泛被採用的社會標準","B":"認為規則是根據公平正義原則而訂定的","C":"抱 年","num":21,"stem":"關於認知發展理論的敘述，下列何者正確？\n甲、皮亞傑(J. Piaget)認為兒童會主動建構認知結構\n乙、行為學派認為兒童認知結構是靠後天文化與學習歷程而建構\n丙、布魯納(J. Bruner)認為兒童是主動求知者，教育則可以促進認知發展\n丁、維高斯基(L. Vygotsky)認為兒童在認知發展過程中不具自主性，而是靠外在環境\n建構認知","options":{"A":"甲乙","B":"乙丁","C":"丙丁","D":"甲丙"},"answer":"D","context":"","page":5,"explanation":"核心觀念｜認知發展中的主動建構與教育支持：皮亞傑強調兒童透過與環境互動，主動組織並調整既有認知基模；布魯納也重視學習者主動探索，以及教學對認知發展的支持。維高斯基進一步強調社會互動與文化工具的作用，但這並不表示兒童在學習歷程中毫無主動性。比較學派時要區分側重點，而非將其絕對對立。","review":"文字擷取，待逐題複核","theme":"認知發展、智力與創造力","concepts":"皮亞傑、維高斯基","filename":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"已參照第一至第五章整理；第七章跨章節關聯","relatedNotes":["7-03","7-12"],"relatedChapters":["7"],"explanationLevel":"core"},{"id":"115-MC-22","chapter":"2","noteId":"2-07","type":"past","source":"歷屆教師資格考試","year":"115年","num":22,"stem":"下列哪一個例子最能完整反映班度拉(A. Bandura)的三元交互因果關係？","options":{"A":"小安的數學老師很鼓勵她多做數學題，並且適時給予獎勵和輔導，這讓小安的數學\n能力越來越好","B":"父母經常讚美小辰在學習上的努力，不但讓小辰對學習更有信心，也讓她調整了\n自己的學習目標","C":"小惠具備高學業自我效能，因而努力學習，使得成績優異，獲得老師的讚美後\n他更認真學習，對學業也更有信心","D":"小佑對下週段考的成績表現有高度期望，因此努力準備考試，他的努力不但得到\n老師的高度讚美，也讓父母讚不絕口"},"answer":"C","context":"","page":6,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"行為學習與班級經營","concepts":"班度拉、自我效能","filename":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"已參照第一至第五章整理"},{"id":"115-MC-23","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"115年","num":23,"stem":"老師問：「我發現你上臺報告時會握緊拳頭，當握拳時，你當下有什麼樣的感覺？」\n上述老師的問句較符合下列哪一種心理諮商學派的做法？","options":{"A":"認知行為","B":"精神分析","C":"現實治療","D":"完形治療"},"answer":"D","context":"","page":6,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項解析。","review":"文字擷取，待逐題複核","theme":"諮商學派與輔導技巧","concepts":"","filename":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","assignment":"尚待對照教師後續章節"},{"id":"115-MC-24","chapter":"","noteId":"","type":"past","source":"歷屆教師資格考試","year":"115年","num":24,"stem":"根據荆摩曼(R. Zimmerman)的前備－表現－反思三階段自我調整學習模式，下列\n哪一項是學生在反思階段會做的？","options":{"A":"自我監控","B":"任務分析","C":"策略使用","D":"成敗歸因"},"answer":"D","context":"","page":6,"explanation":"已核對官方選擇題答案；本題尚未完成逐選項
