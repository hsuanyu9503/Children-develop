window.ESSAYS=[{"id":"106-SA-01","chapter":"8","year":"106年","num":1,"stem":"兒童與同儕間的攻擊行為，常分類為工具性攻擊(instrumental aggression)、敵意性攻擊\n(hostile aggression)、以及關係性攻擊(relational aggression)。試述此三類攻擊行為的特性，\n並各舉一例分別說明之。","context":"","source":"106國民小學-兒童發展與輔導.pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"道德、家庭與同儕關係","type":"非選擇題","noteId":"8-19","coreConcept":"核心觀念方向｜工具性、敵意性與關係性攻擊的定義／例子"},{"id":"106-SA-02","chapter":"","year":"106年","num":2,"stem":"小彬考完數學後，非常焦慮地找導師談話。小彬說：「雖然成績尚未公布，我認為\n我會不及格。爸媽知道後，我一定完蛋，好可怕！我數學不好，不是一個好學生。\n除非我考好，不然我就是個失敗者。我看到數學老師與我互動怪怪的，好像我考不好，\n他不理我了！」請以認知治療取向，指出小彬話語中三種認知扭曲及其相對應的句子\n並加以說明。","context":"","source":"106國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"非選擇題"},{"id":"106-SA-03","chapter":"","year":"106年","num":3,"stem":"陳老師懷疑班上的小強智力遲緩，因此趁著中午休息時間把小強找來辦公室做智力\n測驗。測完後，因為急著回教室上課，就把測驗結果放在辦公桌上。之後，科任老師\n對陳老師說：「小強似乎學習有困難｣，陳老師就說：「他智力遲緩，學不來也是正常的。｣\n試列舉四項陳老師違反實施心理測驗之倫理原則，並簡要說明。","context":"","source":"106國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"輔導制度、倫理與兒少保護","type":"非選擇題"},{"id":"106-SA-04","chapter":"","year":"106年","num":4,"stem":"郭老師發現小志身上常有傷痕，表情憂傷。郭老師懷疑小志有受虐待的現象。\n(1)試說明兒童虐待的類型。(4 分)\n(2)郭老師宜如何對小志與家長確認小志是否受虐(3 分)？根據「兒童及少年福利與權益\n保障法」的規定，郭老師應採取什麼行動(3 分)？","context":"","source":"106國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"輔導制度、倫理與兒少保護","type":"非選擇題"},{"id":"1081-SA-01","chapter":"8","year":"108年第1次","num":1,"stem":"試述三項國小學童攻擊行為的成因，並說明之。","context":"","source":"108-1國民小學-兒童發展與輔導(1).pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"道德、家庭與同儕關係","type":"非選擇題","noteId":"8-21","coreConcept":"核心觀念方向｜從個人、認知、家庭及社會環境辨識攻擊形成因素"},{"id":"1081-SA-02","chapter":"","year":"108年第1次","num":2,"stem":"學校推行「閱讀運動」，當孩子擁有越多的閱讀經驗，對於所閱讀的內容，也會有較好\n的理解。列舉三項並說明閱讀經驗越多時，越能增進理解能力的理由。","context":"","source":"108-1國民小學-兒童發展與輔導(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"語言與讀寫發展","type":"非選擇題"},{"id":"1081-SA-03","chapter":"2","year":"108年第1次","num":3,"stem":"根據操作制約的原理，列舉三項並說明教師應用於兒童行為改變的技巧。","context":"","source":"108-1國民小學-兒童發展與輔導(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"非選擇題"},{"id":"1081-SA-04","chapter":"8","year":"108年第1次","num":4,"stem":"小明是國小五年級學生，由於父母離異，家庭完整性破壞，導致家庭功能無法發揮，\n對小明的適應影響重大。\n(1)試述三項父母離異對小明心理與行為可能產生的影響。(6 分)\n(2)針對小明的心理適應問題，試擬定兩項主要的輔導目標，並說明之。(4 分)","context":"","source":"108-1國民小學-兒童發展與輔導(1).pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"道德、家庭與同儕關係","type":"非選擇題","noteId":"8-18","coreConcept":"核心觀念方向｜離異家庭的可能影響與支持，避免宿命論"},{"id":"1082-SA-01","chapter":"","year":"108年第2次","num":1,"stem":"小恩是一年級新生，每天早上媽媽送他到學校時，他總會淚眼汪汪，不願與媽媽分離。\n在此當下，如果你是小恩的導師，宜如何協助他調整情緒？試舉出並說明三項做法。","context":"","source":"108-2國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"1082-SA-02","chapter":"","year":"108年第2次","num":2,"stem":"王老師發現小明沒有和同學一起去上體育課，反而在教室裡偷取同學的財物。王老師\n該如何輔導小明？試舉出三項說明之。","context":"","source":"108-2國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"1082-SA-03","chapter":"","year":"108年第2次","num":3,"stem":"兒童受虐個案通報與受虐致死人數累計快速攀升，故兒童受虐問題不容忽視。\n(1)試舉出並說明三項兒童受虐的因素。(6 分)\n(2)試述二項長期受虐可能對兒童造成的影響。(4 分)","context":"","source":"108-2國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"輔導制度、倫理與兒少保護","type":"非選擇題"},{"id":"1082-SA-04","chapter":"5","year":"108年第2次","num":4,"stem":"國小高年級兒童的語言發展，在語音上已可覺察語詞裡所有音素，並能如成人般正確\n發出字音。請列舉另外三個語言成分，並說明此時期兒童在此三個成分上的發展情形。","context":"","source":"108-2國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"語言與讀寫發展","type":"非選擇題"},{"id":"109-SA-01","chapter":"","year":"109年","num":1,"stem":"蔡老師剛接任班級導師，他很快就注意到班上有幾位學生明顯有肥胖的問題。\n(1)列舉四項兒童肥胖的原因。(4 分)\n(2)蔡老師可以採取哪些作法來有效協助肥胖的學生減重，並扼要說明之。(列出二項)\n(6 分)","context":"","source":"109國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"生理發展與腦神經","type":"非選擇題"},{"id":"109-SA-02","chapter":"8","year":"109年","num":2,"stem":"試說明如何減少學齡兒童的性別歧視？(列出五項)","context":"","source":"109國民小學-兒童發展與輔導.pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"道德、家庭與同儕關係","type":"非選擇題","noteId":"8-07","coreConcept":"核心觀念方向｜反刻板印象與反歧視教學策略"},{"id":"109-SA-03","chapter":"","year":"109年","num":3,"stem":"小君很重視學業成績，但每到考試都會很緊張，常有肚子痛或害怕上學等焦慮情形。\n(1)列出二項引發小君焦慮反應的可能原因。(4 分)\n(2)陳老師想要改善小君的焦慮反應，他可以採取哪些輔導策略，並扼要說明之。(列出\n二項)(6 分)","context":"","source":"109國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"109-SA-04","chapter":"","year":"109年","num":4,"stem":"羅吉斯(C. Rogers)的個人中心諮商法認為，諮商員只要提供一個適當的環境，當事人\n就能夠朝正向成長，試述此適當環境中諮商員的核心條件為何，並扼要說明之。(列出\n三項)","context":"","source":"109國民小學-兒童發展與輔導.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"非選擇題"},{"id":"110-SA-01","chapter":"2","year":"110年","num":1,"stem":"比較維高斯基(L. Vygotsky)與皮亞傑(J. Piaget)的理論觀點在認知發展階段、認知成長\n機制，以及影響認知發展因素上的差異。(10 分)\n將下列表格繪製於答案卷，並於答案卷的表格內作答。\n理論觀點\n維高斯基\n皮亞傑\n認知發展階段\n認知成長機制\n影響認知發展因素","context":"","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"認知發展、智力與創造力","type":"非選擇題"},{"id":"110-SA-02","chapter":"","year":"110年","num":2,"stem":"張老師即將接任小一新生的導師，他非常重視學生的適應問題。說明學生可能出現的\n適應困難，列出兩種適應困難的類別，並針對每一類寫出兩項行為特徵。(10 分)","context":"","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"110-SA-03","chapter":"","year":"110年","num":3,"stem":"某教師在教導「閃電」單元時，教科書僅有文字內容說明，為了提升學生之理解，\n製作了A 版教材，以動畫搭配語音解說。他擔心學生聽不清楚，又製作了B 版教材，\n除了原有動畫及語音解說外，再加上字幕。結果發現：A 版的學習效果優於教科書，\n而B 版的成效最差。\n從學習觀點，認知負荷的來源可分為：\n(1) 內在認知負荷(intrinsic cognitive load)是指理解學習內容所需要的\n認知資源，主要取決於教材內容難易度。\n(2) 外在認知負荷(extraneous cognitive load)是無效的認知負荷。學習過程\n中，為了處理設計不良的教材或教學設計，所需要的認知負荷。\n(3) 增生認知負荷(germane cognitive load)是有效的認知負荷。為了處理\n良好的教材或教學設計，以幫助認知基模的建立，所需的認知負荷。\n比較教科書、A、B 版三種教材，在三種認知負荷來源的異同，並說明為何B 版的\n學習效果較不理想。(10 分)","context":"","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"記憶與訊息處理","type":"非選擇題"},{"id":"110-CA-04","chapter":"","year":"110年","num":4,"stem":"從訊息處理論的角度，說明老師要求學生在抄完後馬上考試，會產生什麼問題？(2 分)","context":"閱讀下文後，回答4-6 題。 \n六年級的國語課，朱老師請學生抄寫黑板上生字延伸的補充詞語，抄完後要直接   \n考聽寫。小程開始焦躁，舉手向老師反映：「老師，太難了！」老師卻回答：「不會太難，       \n你加油。」小程勉為其難抄了一會兒，老師看其他同學都抄完了，便叫大家把課本收     \n起來，準備考聽寫。還未抄完的小程著急地大叫：「老師，我還沒抄完！」老師不理他，\n逕自擦掉黑板上的詞語……","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"記憶與訊息處理","type":"綜合題"},{"id":"110-CA-05","chapter":"","year":"110年","num":5,"stem":"老師先教課文中的「汽油」，然後補充「油」的形似字延伸語詞。在「柚子」、「抽取」、\n「釉彩」、「直笛」、「啟迪」、「軸心」這些語詞中，你會建議老師挑選哪些延伸語詞？\n並根據讀寫教學的認知原則，說明你選擇的理由。(4 分)","context":"閱讀下文後，回答4-6 題。 \n六年級的國語課，朱老師請學生抄寫黑板上生字延伸的補充詞語，抄完後要直接   \n考聽寫。小程開始焦躁，舉手向老師反映：「老師，太難了！」老師卻回答：「不會太難，       \n你加油。」小程勉為其難抄了一會兒，老師看其他同學都抄完了，便叫大家把課本收     \n起來，準備考聽寫。還未抄完的小程著急地大叫：「老師，我還沒抄完！」老師不理他，\n逕自擦掉黑板上的詞語……","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"語言與讀寫發展","type":"綜合題"},{"id":"110-CA-06","chapter":"","year":"110年","num":6,"stem":"小程是一個國語文自我效能較低的學生。朱老師該如何提升小程的自我效能？寫出\n兩項。(4 分)","context":"閱讀下文後，回答4-6 題。 \n六年級的國語課，朱老師請學生抄寫黑板上生字延伸的補充詞語，抄完後要直接   \n考聽寫。小程開始焦躁，舉手向老師反映：「老師，太難了！」老師卻回答：「不會太難，       \n你加油。」小程勉為其難抄了一會兒，老師看其他同學都抄完了，便叫大家把課本收     \n起來，準備考聽寫。還未抄完的小程著急地大叫：「老師，我還沒抄完！」老師不理他，\n逕自擦掉黑板上的詞語……","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"110-CA-07","chapter":"","year":"110年","num":7,"stem":"陳老師雖明訂規則，卻默許小高違反規則並加分。從行為主義的觀點，老師的行為有何\n不妥之處？你認為當小高第一次出現違規搶答的情況時，老師宜採取何種做法？寫出\n兩項。(6 分)","context":"閱讀下文後，回答7-8 題。\n五年級的課堂上，初次帶班的陳老師在班規中已明訂回答問題前要先舉手，但小高\n沒有舉手便搶答，老師仍幫他加分，一開始其他同學表情略微不開心，但還是安靜地\n放下手。第二次，同學開始出言抱怨「啊不就好棒棒」、「吼！一直插嘴餒」。第三次，\n同學大聲表達「吵死了」、「小心我打你」，小高立刻向老師告狀「老師，愷愷說要打我」。\n聽小高這麼一說，愷愷很不高興地從座位站起身，舉起椅子衝向小高，教室頓時陷入\n一片混亂。","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"},{"id":"110-CA-08","chapter":"","year":"110年","num":8,"stem":"經此事件後，輔導老師建議陳老師教導學生善用「我訊息」(I-message)策略，增進\n學生的溝通技巧。選出以下最符合「我訊息」策略的選項？並說明理由。(4 分)\n(A)你總是不舉手就回答，那你要我怎麼樣\n(B)小高你這樣不舉手就回答，我認為是錯的\n(C)老師不公平！我認為應該選有舉手的同學回答\n(D)小高犯規還被加分，讓老師點不到我，對我不公平","context":"閱讀下文後，回答7-8 題。\n五年級的課堂上，初次帶班的陳老師在班規中已明訂回答問題前要先舉手，但小高\n沒有舉手便搶答，老師仍幫他加分，一開始其他同學表情略微不開心，但還是安靜地\n放下手。第二次，同學開始出言抱怨「啊不就好棒棒」、「吼！一直插嘴餒」。第三次，\n同學大聲表達「吵死了」、「小心我打你」，小高立刻向老師告狀「老師，愷愷說要打我」。\n聽小高這麼一說，愷愷很不高興地從座位站起身，舉起椅子衝向小高，教室頓時陷入\n一片混亂。","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"綜合題"},{"id":"111-SA-01","chapter":"8","year":"111年","num":1,"stem":"在包姆林(D. Baumrind)的研究基礎上，學者將父母的教養風格分成四種。寫出此四種\n教養風格，並說明它們如何受父母控制程度(demandingness)和涉入程度(responsiveness)\n的影響。(10 分)","context":"","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":6,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"道德、家庭與同儕關係","type":"非選擇題","noteId":"8-14","coreConcept":"核心觀念方向｜四種教養風格及要求×回應程度"},{"id":"111-SA-02","chapter":"","year":"111年","num":2,"stem":"在數學課的課堂上，五年級的小凱從不會主動舉手回答老師提出的問題；若老師指名\n小凱重述同學的答案，他的聲音總是非常的小。有時同學會開玩笑說：「聲音比蚊子\n還小，聽不見」，小凱就會漲紅了臉。老師請大家寫練習題時，小凱也都趕快作答，\n只是答案常是錯的。老師私下問他，小凱回答：「我從一年級開始數學就很爛，怎麼\n學都學不會。」老師知道小凱的父母在夜市擺攤，無暇顧及小凱的功課。綜上所述，\n分析並提出四項造成小凱數學學習問題的原因，簡要說明之。(10 分)","context":"","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":6,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"非選擇題"},{"id":"111-SA-03","chapter":"","year":"111年","num":3,"stem":"六年級的小華跟導師說：｢這次段考我的自然成績很爛，同學笑我題目這麼簡單都不會\n寫，我真的很笨，感覺超難過。」依理情行為學派的觀點，回答以下三個問題。(10 分)\n(1)引發小華心理困擾的ABC 架構中，A、B、C 分別代表何者？\n(2)導師在協助小華了解ABC 架構後，可以採取何種作法改善小華的負面情緒？\n(3)如果導師的輔導有效，小華的信念或想法可能會有什麼改變？","context":"","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":6,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"非選擇題"},{"id":"111-CA-04","chapter":"","year":"111年","num":4,"stem":"針對子微作業一直都寫得很不完整，劉老師在教學上可以怎麼做？(2 分)","context":"閱讀下文後，回答4-7 題。 \n子微是國小二年級學生。無論是聽課或是寫學習單，他常會起身離開座位，也常    \n轉頭跟前後左右的同學講話。上課中劉老師常需要提醒子微，剛開始他會短暫專注，    \n但劉老師提醒的次數一多，他就會開始生悶氣、踢桌子，干擾班上秩序。子微作業一直\n都寫得很不完整；劉老師交代班級事務時，他也好像都沒在聽。 \n下課時到遊戲場玩，子微也常因為耐不住性子，推擠正在排隊的同學，結果跟同學\n發生肢體衝突，造成同學受傷。班上同學都不喜歡跟他交朋友，三天兩頭就跟劉老師    \n抱怨子微。","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"綜合題"},{"id":"111-CA-05","chapter":"","year":"111年","num":5,"stem":"針對子微無論是聽課或寫學習單，常會起身離開座位或常轉頭跟前後左右同學講話的\n狀態，從行為管理和教學調整兩個面向，分別說明劉老師可以怎麼做？(4 分)","context":"閱讀下文後，回答4-7 題。 \n子微是國小二年級學生。無論是聽課或是寫學習單，他常會起身離開座位，也常    \n轉頭跟前後左右的同學講話。上課中劉老師常需要提醒子微，剛開始他會短暫專注，    \n但劉老師提醒的次數一多，他就會開始生悶氣、踢桌子，干擾班上秩序。子微作業一直\n都寫得很不完整；劉老師交代班級事務時，他也好像都沒在聽。 \n下課時到遊戲場玩，子微也常因為耐不住性子，推擠正在排隊的同學，結果跟同學\n發生肢體衝突，造成同學受傷。班上同學都不喜歡跟他交朋友，三天兩頭就跟劉老師    \n抱怨子微。","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"綜合題"},{"id":"111-CA-06","chapter":"","year":"111年","num":6,"stem":"子微的行為表現與下列何者症狀相似？(2 分)\n(A)自閉症\n(B)憂鬱症\n(C)妥瑞症\n(D)注意力缺陷過動症","context":"閱讀下文後，回答4-7 題。 \n子微是國小二年級學生。無論是聽課或是寫學習單，他常會起身離開座位，也常    \n轉頭跟前後左右的同學講話。上課中劉老師常需要提醒子微，剛開始他會短暫專注，    \n但劉老師提醒的次數一多，他就會開始生悶氣、踢桌子，干擾班上秩序。子微作業一直\n都寫得很不完整；劉老師交代班級事務時，他也好像都沒在聽。 \n下課時到遊戲場玩，子微也常因為耐不住性子，推擠正在排隊的同學，結果跟同學\n發生肢體衝突，造成同學受傷。班上同學都不喜歡跟他交朋友，三天兩頭就跟劉老師    \n抱怨子微。","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"綜合題"},{"id":"111-CA-07","chapter":"","year":"111年","num":7,"stem":"為協助子微家長取得評量與鑑定之相關資源，劉老師應優先採取的步驟為何？(2 分)","context":"閱讀下文後，回答4-7 題。 \n子微是國小二年級學生。無論是聽課或是寫學習單，他常會起身離開座位，也常    \n轉頭跟前後左右的同學講話。上課中劉老師常需要提醒子微，剛開始他會短暫專注，    \n但劉老師提醒的次數一多，他就會開始生悶氣、踢桌子，干擾班上秩序。子微作業一直\n都寫得很不完整；劉老師交代班級事務時，他也好像都沒在聽。 \n下課時到遊戲場玩，子微也常因為耐不住性子，推擠正在排隊的同學，結果跟同學\n發生肢體衝突，造成同學受傷。班上同學都不喜歡跟他交朋友，三天兩頭就跟劉老師    \n抱怨子微。","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"輔導制度、倫理與兒少保護","type":"綜合題"},{"id":"111-CA-08","chapter":"","year":"111年","num":8,"stem":"陳老師跟大明談話時，採用了下列哪個技巧？簡要說明此溝通技巧的適切性。(2 分)\n(A)詢問\n(B)引導\n(C)澄清\n(D)立即性","context":"閱讀下文後，回答8-10 題。\n陳老師的社會課很受學生歡迎。唯有大明在社會課常常無精打采，總要被點名才會\n發言，學習單也寫得不完整。陳老師趁下課時問大明：「老師發現你上課總是打不起精神\n來，你對社會課學習有什麼感覺或想法呢？」大明說：「社會課有一堆名詞，我學不會也\n記不住；我覺得那些知識在生活中也用不上，我不喜歡社會課。」\n有一次上課，陳老師採用合作學習法，請各組學生依據火車路線規劃三天兩夜小鎮\n之旅。在小組中，大明認真地跟同學討論。他告訴同學，藉由自己常常跟家人出遊的\n經驗，一定能順利完成分組作業。\n各組報告後，大明這一組的企劃案被全班票選最有趣的作品。他很開心地跟同學說，\n要建議爸媽用這個行程帶他去旅行，爸媽一定會覺得他很厲害！","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"綜合題"},{"id":"111-CA-09","chapter":"","year":"111年","num":9,"stem":"期望價值論(expectancy-value theory)主張個人的動機主要受到個人對達成目標的期望\n高低和該目標對個人的價值所影響。依據該理論說明大明在動機上的轉變。(4 分)","context":"閱讀下文後，回答8-10 題。\n陳老師的社會課很受學生歡迎。唯有大明在社會課常常無精打采，總要被點名才會\n發言，學習單也寫得不完整。陳老師趁下課時問大明：「老師發現你上課總是打不起精神\n來，你對社會課學習有什麼感覺或想法呢？」大明說：「社會課有一堆名詞，我學不會也\n記不住；我覺得那些知識在生活中也用不上，我不喜歡社會課。」\n有一次上課，陳老師採用合作學習法，請各組學生依據火車路線規劃三天兩夜小鎮\n之旅。在小組中，大明認真地跟同學討論。他告訴同學，藉由自己常常跟家人出遊的\n經驗，一定能順利完成分組作業。\n各組報告後，大明這一組的企劃案被全班票選最有趣的作品。他很開心地跟同學說，\n要建議爸媽用這個行程帶他去旅行，爸媽一定會覺得他很厲害！","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"111-CA-10","chapter":"","year":"111年","num":10,"stem":"有些成就目標理論學者將成就目標導向分為趨向表現、趨向精熟、逃避表現、逃避\n精熟四個類型，試依此理論回答以下兩個問題。(4 分)\n(1)大明在「小鎮之旅」任務的成就目標導向類型為何？(引用情境簡述判定原因)\n(2)「小鎮之旅」的任務為什麼有助於發展學生精熟目標導向的動機？","context":"閱讀下文後，回答8-10 題。\n陳老師的社會課很受學生歡迎。唯有大明在社會課常常無精打采，總要被點名才會\n發言，學習單也寫得不完整。陳老師趁下課時問大明：「老師發現你上課總是打不起精神\n來，你對社會課學習有什麼感覺或想法呢？」大明說：「社會課有一堆名詞，我學不會也\n記不住；我覺得那些知識在生活中也用不上，我不喜歡社會課。」\n有一次上課，陳老師採用合作學習法，請各組學生依據火車路線規劃三天兩夜小鎮\n之旅。在小組中，大明認真地跟同學討論。他告訴同學，藉由自己常常跟家人出遊的\n經驗，一定能順利完成分組作業。\n各組報告後，大明這一組的企劃案被全班票選最有趣的作品。他很開心地跟同學說，\n要建議爸媽用這個行程帶他去旅行，爸媽一定會覺得他很厲害！","source":"2_111國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"112-SA-01","chapter":"2","year":"112年","num":1,"stem":"王老師在教六年級的柱體與錐體時，發現班上有些孩子已經可以熟練地從展開圖對應\n到正確的形狀，有些孩子卻無法做到。根據皮亞傑(J. Piaget) 的認知發展論，此時期\n的學童大多在具體運思期階段過渡到形式運思期階段，請針對具體運思期與形式運思\n期各舉出三個思考特徵(6 分)。試針對王老師班上發展落後學生的特徵，建議兩種可能\n的教學做法(4 分)。","context":"","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"認知發展、智力與創造力","type":"非選擇題"},{"id":"112-SA-02","chapter":"","year":"112年","num":2,"stem":"小宇是三年級的學生，由於頗受爸媽疼愛，導致他行為較為調皮任性。有一天下課時，\n小宇跑到他喜歡的陳老師身旁，抱住老師又摸了他的頭髮。陳老師覺得不舒服，決定\n使用遊戲治療的「設限」(setting limits) 技巧來協助小宇學習界線。簡述「設限」\n技巧的意涵與重要性(4 分)。「設限」時須注意三個面向：同理兒童的感受、訂下一些\n限制以符合真實世界及關係中應負的責任、提出替代方案，為了真正地幫助小宇學習，\n試分別從三個面向替陳老師向小宇各表達一句適切的溝通例句(6 分)。","context":"","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"非選擇題"},{"id":"112-SA-03","chapter":"2","year":"112年","num":3,"stem":"某地區經常為限水問題所苦，因此老師帶領學生思考臺灣面臨的缺水困境。學童分析\n水資源浪費成因後，決定從省水的角度切入。老師首先用影像介紹國外學童的創意\n省水裝置發明。他們一開始覺得有些困難，但是老師鼓勵他們：｢別人做得到，你們\n也做得到。」經過討論，他們發明了一個有趣的省水裝置。此外，對於校長讓他們\n在朝會上分享設計的邀請，這群學童感到十分興奮。他們製作了各種海報傳遞省水\n理念，同學開始叫他們省水達人。讓他們深切體會愛家鄉是每個人都可以實踐的具體\n行動。\n根據班杜拉(A. Bandura) 的理論，影響自我效能的來源有四。請分析參與上述\n活動可能如何影響學童們的自我效能(8 分)，並指出其中哪個要素最關鍵(2 分)？","context":"","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":7,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"非選擇題"},{"id":"112-CA-04","chapter":"","year":"112年","num":4,"stem":"試評述陳老師與學生的約定會對學生的學習動機和學習成效產生哪些負面影響，寫出\n三點並詳加說明。(6 分)","context":"閱讀下文後，回答4-5 題。\n為了提高學生學習意願，陳老師與學生有個約定，若學生單元小考成績超過90 分，\n就可以免做回家作業一次。下課時，婷婷說：「我週末一定要努力讀書，成為全班拿最多\n免做功課獎勵的人。」凱凱說：「老師的標準太高，我一定考不到，我乾脆不要讀了。」\n阿澤說：「大家好像都很喜歡免做功課的獎勵，但我覺得寫回家作業可以讓我更了解學習\n的內容。」\n上述約定試行一陣子後，陳老師發現有些學生表現有進步，但是有些學生的成績\n仍然不理想。因此陳老師又增加第二個約定，小考成績未達70 分的學生就要罰寫。\n陳老師心想，下次全班的成績應該都會進步了吧！","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"112-CA-05","chapter":"","year":"112年","num":5,"stem":"提出一個理論說明凱凱的學習問題，並依據該理論建議輔導策略。(4 分)","context":"閱讀下文後，回答4-5 題。\n為了提高學生學習意願，陳老師與學生有個約定，若學生單元小考成績超過90 分，\n就可以免做回家作業一次。下課時，婷婷說：「我週末一定要努力讀書，成為全班拿最多\n免做功課獎勵的人。」凱凱說：「老師的標準太高，我一定考不到，我乾脆不要讀了。」\n阿澤說：「大家好像都很喜歡免做功課的獎勵，但我覺得寫回家作業可以讓我更了解學習\n的內容。」\n上述約定試行一陣子後，陳老師發現有些學生表現有進步，但是有些學生的成績\n仍然不理想。因此陳老師又增加第二個約定，小考成績未達70 分的學生就要罰寫。\n陳老師心想，下次全班的成績應該都會進步了吧！","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"112-CA-06","chapter":"","year":"112年","num":6,"stem":"根據阿德勒學派對不良行為目標的觀點，分析明芳可能的行為目標並說明判斷的理由\n(4 分)。並根據該學派的理論，針對明芳的行為提出兩項因應作法(2 分)。","context":"閱讀下文後，回答6-7 題。\n六年級的明芳上課時常跟林老師唱反調，例如，當林老師發現他的桌上空無一物，\n請他和其他同學一樣拿出課本和習作時，他會跟老師說「我沒帶」、「我不知道」或\n「被我丟掉了」。然後笑著轉頭看其他同學，同學們也會跟著竊笑。\n今天，在林老師講課時，明芳拿出尺敲桌面，接著大聲說：「上課好無聊，老師\n很不會教呢！」林老師中斷教學，制止明芳的行為，他卻對林老師扮起鬼臉，繼續敲，\n還跟著敲打的節奏唱「啦啦啦…」。班上同學看著這一幕紛紛大笑、跟著起鬨，於是明芳\n敲得更用力、唱得更大聲了。\n在命令學生保持安靜並指派習作後，林老師把明芳叫到教室外走廊去談話。他責備\n明芳在班上搗蛋的行為，並嚴厲警告再犯的可能後果。","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":8,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"},{"id":"112-CA-07","chapter":"","year":"112年","num":7,"stem":"針對上述事件，請利用「我－訊息」(I-message) 的語氣幫林老師擬一段針對全班\n說的話，以向全班傳達指示，進而恢復班上秩序。(4 分)","context":"閱讀下文後，回答6-7 題。\n六年級的明芳上課時常跟林老師唱反調，例如，當林老師發現他的桌上空無一物，\n請他和其他同學一樣拿出課本和習作時，他會跟老師說「我沒帶」、「我不知道」或\n「被我丟掉了」。然後笑著轉頭看其他同學，同學們也會跟著竊笑。\n今天，在林老師講課時，明芳拿出尺敲桌面，接著大聲說：「上課好無聊，老師\n很不會教呢！」林老師中斷教學，制止明芳的行為，他卻對林老師扮起鬼臉，繼續敲，\n還跟著敲打的節奏唱「啦啦啦…」。班上同學看著這一幕紛紛大笑、跟著起鬨，於是明芳\n敲得更用力、唱得更大聲了。\n在命令學生保持安靜並指派習作後，林老師把明芳叫到教室外走廊去談話。他責備\n明芳在班上搗蛋的行為，並嚴厲警告再犯的可能後果。","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":8,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"綜合題"},{"id":"113-SA-01","chapter":"","year":"113年","num":1,"stem":"從訊息處理理論的觀點提出增進記憶成效的策略。分別針對感官登錄提出一項、短期\n記憶提出二項、長期記憶提出二項有效的策略。(10 分)","context":"","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":6,"status":"非選擇題參考作答待建立","theme":"記憶與訊息處理","type":"非選擇題"},{"id":"113-SA-02","chapter":"2","year":"113年","num":2,"stem":"馬老師教「時間單位的換算」時，先詢問已學過的日、時、分、秒等時間單位的關係，\n再進入正式教學活動：先利用一系列提問引導學生解決問題；再由不同能力學生組成\n的小組討論解決類似題並進行小組分享；最後由學生獨立解題，教師再給予回饋；回家\n作業則指定「數學日記」，讓學生紀錄今天討論了什麼、學到什麼、哪裡不懂。\n(1)請解釋布魯納等學者(Bruner, Ross & Wood, 1976)所提出的鷹架作用，並說明馬老師\n教學歷程符合鷹架作用之處。(4 分)\n(2)從馬老師的作法，指出其符合維高思基(L. Vygotsky)理論的二項重要概念或觀點，並\n說明之。(6 分)","context":"","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":6,"status":"非選擇題參考作答待建立","theme":"認知發展、智力與創造力","type":"非選擇題"},{"id":"113-SA-03","chapter":"","year":"113年","num":3,"stem":"小高因發生交通事故意外身亡，使得小高就讀的班級瀰漫著一片難過的氣氛。列點陳述\n四項導師可以對班級採取的輔導策略，以幫助學生從傷痛中走出。(10 分)","context":"","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":6,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"113-CA-04","chapter":"","year":"113年","num":4,"stem":"針對表格中「目標行為的設定與敘寫」，提出兩個導致小善行為改變計畫失敗的可能原因，\n並針對這些原因提出相應的改善作法。(6 分)","context":"閱讀下文後，回答4-5 題。\n小善平時沒有天天洗澡，導致身上有異味，他吃完午餐常用衣服擦手，也習慣用袖子\n擦鼻涕，他的教室座位地板上有很多垃圾，因此同學不喜歡跟小善在一起。陳老師為了要\n改善小善的衛生習慣，設計了一個集點活動來幫助他達成目標。他給小善一張記錄表，\n跟他共同訂定要改進的四個行為，每項只要當天完全做到，小善就可以自己打一個○，\n累積10 個○就能換一個小善喜歡的獎品。以下是小善交回的表格，從表格看起來小善每天\n都有畫○，但一段時間後，小善的衛生習慣卻沒有明顯改善。\n【原卷表格擷取文字（排版請參照PDF）】\n目標行為\n5/6\n(一)\n5/7\n(二)\n5/8\n(三)\n5/9\n(四)\n5/10\n(五)\n5/13\n(一)\n5/14\n(二)\n5/15\n(三)\n5/16\n(四)\n5/17\n(五)\n每天洗澡換乾淨衣服\n○\n○\n○\n○\n○\n○\n○\n○\n○\n○\n維持座位乾淨\n○\n○\n○\n○\n○\n○\n○\n○\n○\n○\n不要把衣服當抹布\n○\n○\n○\n○\n○\n每次擤鼻涕都使用衛\n生紙\n○\n○","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"},{"id":"113-CA-05","chapter":"8","year":"113年","num":5,"stem":"老師希望藉由同儕的力量來幫助小善的衛生習慣，提出一項作法並說明所依據的理論。\n(4 分)","context":"閱讀下文後，回答4-5 題。\n小善平時沒有天天洗澡，導致身上有異味，他吃完午餐常用衣服擦手，也習慣用袖子\n擦鼻涕，他的教室座位地板上有很多垃圾，因此同學不喜歡跟小善在一起。陳老師為了要\n改善小善的衛生習慣，設計了一個集點活動來幫助他達成目標。他給小善一張記錄表，\n跟他共同訂定要改進的四個行為，每項只要當天完全做到，小善就可以自己打一個○，\n累積10 個○就能換一個小善喜歡的獎品。以下是小善交回的表格，從表格看起來小善每天\n都有畫○，但一段時間後，小善的衛生習慣卻沒有明顯改善。\n【原卷表格擷取文字（排版請參照PDF）】\n目標行為\n5/6\n(一)\n5/7\n(二)\n5/8\n(三)\n5/9\n(四)\n5/10\n(五)\n5/13\n(一)\n5/14\n(二)\n5/15\n(三)\n5/16\n(四)\n5/17\n(五)\n每天洗澡換乾淨衣服\n○\n○\n○\n○\n○\n○\n○\n○\n○\n○\n維持座位乾淨\n○\n○\n○\n○\n○\n○\n○\n○\n○\n○\n不要把衣服當抹布\n○\n○\n○\n○\n○\n每次擤鼻涕都使用衛\n生紙\n○\n○","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"行為學習與班級經營","type":"綜合題","noteId":"8-13","coreConcept":"核心觀念方向｜透過同儕互動與社會學習促進適當行為"},{"id":"113-CA-06","chapter":"8","year":"113年","num":6,"stem":"方老師向學校通報後，他希望增加班上學生目睹霸凌行為當下的因應能力，試舉出三項\n方老師可採取的具體作法。(6 分)","context":"閱讀下文後，回答6-7 題。\n方老師新任五年級的班導師。他發現班上的小君常以老大自居，對於剛轉入的小義\n有些不友善的舉動，像是聯合其他同學取笑小義長得像猴子，還鼓動班上其他同學不要\n跟小義一起玩。雖然小義盡量避開他們，但仍不時被小君騷擾。後來小義看到小君會覺得\n害怕、甚至逃開，還跟家長說害怕來上課。","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":8,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"輔導制度、倫理與兒少保護","type":"綜合題","noteId":"8-26","coreConcept":"核心觀念方向｜同儕目睹霸凌時的求助、保護與支持策略"},{"id":"113-CA-07","chapter":"","year":"113年","num":7,"stem":"小君經輔導後，對班上同學不再有不友善的舉動，但是小義看到他依然想逃開，甚至\n害怕來上課。方老師傾聽並同理小義之後，試從消除害怕與創造正向經驗的兩個方向，\n各提出一項輔導小義的具體策略？(4 分)","context":"閱讀下文後，回答6-7 題。\n方老師新任五年級的班導師。他發現班上的小君常以老大自居，對於剛轉入的小義\n有些不友善的舉動，像是聯合其他同學取笑小義長得像猴子，還鼓動班上其他同學不要\n跟小義一起玩。雖然小義盡量避開他們，但仍不時被小君騷擾。後來小義看到小君會覺得\n害怕、甚至逃開，還跟家長說害怕來上課。","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"諮商學派與輔導技巧","type":"綜合題"},{"id":"114-SA-01","chapter":"","year":"114年","num":1,"stem":"小宇近半年每天玩手機超過6 小時，甚至半夜也會偷偷爬起來玩。當爸媽要他少玩\n手機時，他顯得很不耐煩，甚至發脾氣。下課時總是獨自一人低頭玩手機，越來越少\n和朋友互動。生理－心理－社會模式(bio-psycho-social model)強調健康是生理、心理、\n社會三個因素互動的結果。試分別從生理、心理、社會各舉一例，說明過度使用手機\n對小宇所產生的負面影響(6 分)，並提出二項老師可以輔導小宇的具體做法(4 分)。","context":"","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"特殊需求與學生適應","type":"非選擇題"},{"id":"114-SA-02","chapter":"","year":"114年","num":2,"stem":"人類長期記憶中的知識分為陳述性知識(declarative knowledge)、程序性知識(procedural\nknowledge)、及自我調整的知識(self-regulatory knowledge)／條件性知識(conditional\nknowledge)。舉例說明這三種知識並提出可增進該種知識的具體做法。(10 分)\n作答格式(請依照下表，在答案卷上繪製表格作答)\n知識類型\n舉例\n增進知識的具體做法\n陳述性知識\n程序性知識\n自我調整的知識／\n條件性知識","context":"","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"記憶與訊息處理","type":"非選擇題"},{"id":"114-SA-03","chapter":"","year":"114年","num":3,"stem":"小軒彎腰撿東西，不慎碰到小立，雖然立刻道歉，小立仍然忍不住破口大罵。其他同學\n試著勸解小立不要生氣，小立卻反駁自己沒有生氣，而且責怪勸架的同學多管閒事。\n根據社會情緒學習理論(Social Emotional Learning, SEL)，舉出四項小立欠缺的社會情緒\n能力並說明原因。(10 分)\n作答格式(請依照下表，在答案卷上繪製表格作答)\n社會情緒能力名稱\n根據情境說明原因","context":"","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"情緒、人格與自我發展","type":"非選擇題"},{"id":"114-CA-04","chapter":"","year":"114年","num":4,"stem":"選擇一個教育心理學的理論／概念，分析筱玲進資優班後表現不好的可能原因？(4 分)\n作答格式：\n理論／概念：\n可能原因：","context":"閱讀下文後，回答4-5 題 \n筱玲是經濟弱勢學生，父母習慣以責罵方式要求孩子服從。導師觀察她數理表現  \n比同儕傑出，經家長同意後，推薦筱玲參加資優鑑定。本以為幫助她找到適當的教育   \n資源，讓她展現潛能，但發現筱玲在抽離或外加課程的數學學習表現，明顯低於她的   \n實力，且對自己的學習感到焦慮。 \n筱玲告訴老師：「我不喜歡在多數是男生的班級中學習數學。媽媽告訴我，她和  \n爸爸從小就不會讀書，勉強才讀完國中。況且我們是女生，不像男生這麼擅長數理，    \n在數理資優班不可能贏過男生，但是我不覺得女生的數理一定比男生差。」","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"114-CA-05","chapter":"","year":"114年","num":5,"stem":"根據二個不同的動機理論，分別提出老師可幫助筱玲發展數學學習正向態度的具體\n做法。(6 分)\n作答格式(請依照下表，在答案卷上繪製表格作答)\n理論名稱\n具體做法","context":"閱讀下文後，回答4-5 題 \n筱玲是經濟弱勢學生，父母習慣以責罵方式要求孩子服從。導師觀察她數理表現  \n比同儕傑出，經家長同意後，推薦筱玲參加資優鑑定。本以為幫助她找到適當的教育   \n資源，讓她展現潛能，但發現筱玲在抽離或外加課程的數學學習表現，明顯低於她的   \n實力，且對自己的學習感到焦慮。 \n筱玲告訴老師：「我不喜歡在多數是男生的班級中學習數學。媽媽告訴我，她和  \n爸爸從小就不會讀書，勉強才讀完國中。況且我們是女生，不像男生這麼擅長數理，    \n在數理資優班不可能贏過男生，但是我不覺得女生的數理一定比男生差。」","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"114-CA-06","chapter":"","year":"114年","num":6,"stem":"根據行為主義的原理，分別說明小千和小皓學會上述互動行為的歷程。(4 分)\n作答格式(請依照下表，在答案卷上繪製表格作答)\n人物\n以原理解釋行為的習得歷程\n小千\n小皓","context":"閱讀下文後，回答6-7 題\n小千性格強勢，小皓個性內向不擅長拒絕，因此常被小千要求幫忙跑腿。後來小千\n越來越過分，常用凶狠語氣對小皓說話，還取笑小皓、搶他的零食，甚至破壞小皓的\n作業本害他被老師責備。校外教學時，小千要求小皓買紀念品給他，並威脅他說：\n「如果你不買給我，我就告訴老師你平常都會偷帶零食。」小皓因為害怕只好買給小千。\n老師深入了解後，發現很多同學都跟小皓有類似的遭遇。","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"},{"id":"114-CA-07","chapter":"","year":"114年","num":7,"stem":"老師想提升班級學生的應對能力，避免下次再發生類似情形。舉出老師對全班進行\n班級輔導的三項重點並說明內容。(6 分)","context":"閱讀下文後，回答6-7 題\n小千性格強勢，小皓個性內向不擅長拒絕，因此常被小千要求幫忙跑腿。後來小千\n越來越過分，常用凶狠語氣對小皓說話，還取笑小皓、搶他的零食，甚至破壞小皓的\n作業本害他被老師責備。校外教學時，小千要求小皓買紀念品給他，並威脅他說：\n「如果你不買給我，我就告訴老師你平常都會偷帶零食。」小皓因為害怕只好買給小千。\n老師深入了解後，發現很多同學都跟小皓有類似的遭遇。","source":"114國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"道德、家庭與同儕關係","type":"綜合題"},{"id":"115-SA-01","chapter":"2","year":"115年","num":1,"stem":"陳老師是一位國小三年級的班導師。她注意到班上有些學生在課業上覺得吃力，因而\n感到擔憂。根據艾瑞克森(E. Erikson)的理論說明陳老師為什麼擔憂(4 分)。寫出兩項\n陳老師如何幫助學生渡過這階段危機的策略，並說明其具體做法(6 分)。","context":"","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"情緒、人格與自我發展","type":"非選擇題"},{"id":"115-SA-02","chapter":"8","year":"115年","num":2,"stem":"在一次課堂討論中，小凱提出了與多數同學不同的想法。小林立刻回應：「你怎麼會\n想出這麼蠢的點子？」旁邊兩三位同學立刻附和說：「對啊！你自以為很厲害，\n但每次都講得很爛！」小凱當下愣住，臉色變得很難看。其他同學見狀也紛紛不敢再\n表達想法。\n(1)根據社會學習理論的兩項機制，分別說明上述學習情境中言語攻擊事件對班級學生\n行為可能產生的影響。(4 分)\n(2)根據前題的分析，為了促進安全友善的討論環境，提出兩項教師可採取的具體做法。\n(6 分)","context":"","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"第八章已對應圖片與核心觀念；申論完整參考作答待整理","theme":"行為學習與班級經營","type":"非選擇題","noteId":"8-21","coreConcept":"核心觀念方向｜觀察學習與暴力言語對班級氛圍的影響"},{"id":"115-SA-03","chapter":"","year":"115年","num":3,"stem":"某國小六年級學生小杰，近期在校內引起熱烈討論。他主動報名參加一項難度極高、\n風險也較大的高空跳傘活動。活動過程被拍成影片上傳網路，迅速獲得大量關注與討論。\n網路上出現以下看法：\n同學甲：「他就是想被大家注意吧，掌聲越多，他下次一定還會再挑戰更誇張的事。」\n同學乙：「他會報名是因為他之前已經玩過滑翔翼，所以覺得這次自己一定也做得到。」\n同學丙：「我所認識的他，就是不斷自我挑戰，這次他又突破新的極限了。」\n同學丁：「他能夠成功完成高空跳傘是因為有好的設備和天氣配合，和技巧關係不大。」\n從下列動機理論判斷上述四位同學對小杰參加高空跳傘活動的評論各自符合哪一個\n理論並說明之。(10 分)\n‧ 自我決定論\n‧ 目標導向論\n‧ 歸因理論\n‧ 期望價值論\n‧ 社會認知論\n‧ 行為學習理論","context":"","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"非選擇題參考作答待建立","theme":"生理發展與腦神經","type":"非選擇題"},{"id":"115-CA-04","chapter":"3-4","year":"115年","num":4,"stem":"前額葉皮質負責高階認知功能，包含計畫、抑制控制、工作記憶及認知彈性增加。\n說明小威哪兩項高階認知功能可能受損，並從文本中各舉出兩項佐證的行為特徵。\n(4 分)","context":"閱讀下文後，回答4-5 題\n國小三年級的小威被診斷為注意力不足過動症(ADHD)。上課時，他常常無法好好\n的坐在位置上，且容易被窗外的聲音干擾。王老師發現，小威對於重複性高或需長時間\n專注的任務(如國語生字抄寫)，常表現出挫折及排斥，小威常發脾氣說：「這好無聊，\n我不想寫了！反正我永遠寫不完！」此外，對於較複雜的指令，他常無法記住，或是\n遺漏細節，日常生活也常忘東忘西。\n然而，在有動手操作或即時回饋的自然課中，小威的表現卻相對積極。所以，小威\n的問題並非來自不努力，很可能是大腦前額葉皮質(prefrontal cortex, PFC)發展延遲，\n而影響到他的執行功能與學習動機。","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"生理發展與腦神經","type":"綜合題"},{"id":"115-CA-05","chapter":"","year":"115年","num":5,"stem":"針對小威對重複性任務的學習動機低落，王老師想運用自我決定論\n(self-determination theory, SDT)與行為改變技術，分別設計一項具體的教學輔導策略，\n並詳加說明。(6 分)","context":"閱讀下文後，回答4-5 題\n國小三年級的小威被診斷為注意力不足過動症(ADHD)。上課時，他常常無法好好\n的坐在位置上，且容易被窗外的聲音干擾。王老師發現，小威對於重複性高或需長時間\n專注的任務(如國語生字抄寫)，常表現出挫折及排斥，小威常發脾氣說：「這好無聊，\n我不想寫了！反正我永遠寫不完！」此外，對於較複雜的指令，他常無法記住，或是\n遺漏細節，日常生活也常忘東忘西。\n然而，在有動手操作或即時回饋的自然課中，小威的表現卻相對積極。所以，小威\n的問題並非來自不努力，很可能是大腦前額葉皮質(prefrontal cortex, PFC)發展延遲，\n而影響到他的執行功能與學習動機。","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":8,"status":"非選擇題參考作答待建立","theme":"學習動機與自我調整","type":"綜合題"},{"id":"115-CA-06","chapter":"","year":"115年","num":6,"stem":"行為功能分析(functional analysis) 是透過行為發生前的前事(antecedent) 、行為\n(behavior)、該行為的後果(consequence)來分析行為功能，了解不當行為背後的目的。\n請完成下表，並分析小宇的行為功能。(請在作答區內列出A、B、C、D，並分別寫出\n對應的答案，共4 分)\n前事\n行為\n後果\n行為功能\n(老師推測學生行為的目的)\nA\nB\nC\nD","context":"閱讀下文後，回答6-7 題\n國小五年級的數學課在練習題目時，小宇和同學竊竊私語，互丟紙條，老師提醒過\n一次，小宇他們安靜了一下。但不到五分鐘，又開始竊笑。老師再次提醒，小宇說：\n「數學很無聊耶，可以下課了嗎？」全班同學聽到後大笑。小宇看起來很得意，對老師\n做鬼臉，並更大聲地說：「所以，可以下課了嗎？」。同學聽到後，也附和說：「下課、\n下課、下課」。","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"},{"id":"115-CA-07","chapter":"","year":"115年","num":7,"stem":"為促進小宇的適當行為，根據上題的行為功能分析結果，針對改變前事與教導新行為\n各舉一個教師可採取的具體做法。(6 分)","context":"閱讀下文後，回答6-7 題\n國小五年級的數學課在練習題目時，小宇和同學竊竊私語，互丟紙條，老師提醒過\n一次，小宇他們安靜了一下。但不到五分鐘，又開始竊笑。老師再次提醒，小宇說：\n「數學很無聊耶，可以下課了嗎？」全班同學聽到後大笑。小宇看起來很得意，對老師\n做鬼臉，並更大聲地說：「所以，可以下課了嗎？」。同學聽到後，也附和說：「下課、\n下課、下課」。","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":9,"status":"非選擇題參考作答待建立","theme":"行為學習與班級經營","type":"綜合題"}];

function gallery(){
 const built=G.filter(g=>g.src).length, uploaded=G.filter(g=>!g.src&&state.images[g.id]).length;
 const term=state.gallerySearch.trim().toLowerCase();
 const filtered=G.filter(g=>(state.galleryChapter==='all'||g.chapter===state.galleryChapter)
   && (state.galleryKind==='all'||(g.kind==='application'?'application':'core')===state.galleryKind)
   && (!term||[g.title,g.summary||'',g.category||'',g.originalNumber||'',...(g.keywords||[]),...(g.tags||[])].join(' ').toLowerCase().includes(term)));
 const chapterOrder=C.map(c=>c.id);
 const sorted=arr=>[...arr].sort((a,b)=>{
   const ci=chapterOrder.indexOf(a.chapter)-chapterOrder.indexOf(b.chapter);if(ci)return ci;
   if(state.gallerySort==='study'){
     const sa=a.studyOrder??Number(a.originalNumber??a.id.split('-').at(-1));
     const sb=b.studyOrder??Number(b.originalNumber??b.id.split('-').at(-1));
     return sa-sb;
   }
   return Number(a.originalNumber??a.id.split('-').at(-1))-Number(b.originalNumber??b.id.split('-').at(-1));
 });
 const cards=(items)=>`<div class="gallery-grid">${sorted(items).map(g=>{
   const src=g.src||state.images[g.id];const label=g.src?'已內建':src?'已匯入':'待匯入';
   const cls=g.src?'built':src?'added':'neutral';
   const tags=(g.keywords||[]).slice(0,4).map(k=>`<span class="gallery-keyword">${e(k)}</span>`).join('');
   const cardNum=g.originalNumber?`<span class="gallery-number">${e(g.originalNumber)}</span>`:'';
   return `<article class="card gallery-card ${src?'has-image':''}">
    <button type="button" class="img-cover" data-act="preview" data-v="${e(g.id)}" aria-label="放大閱讀 ${e(g.title)}">
      ${src?`<img loading="lazy" decoding="async" alt="${e(g.title)}" src="${g.src?g.thumb||g.src:src}">`:'<span class="outline">✎</span>'}
      ${cardNum}${g.src?'<span class="gallery-corner">網站內建</span>':''}
    </button>
    <div class="gallery-foot"><div class="gallery-label-row"><small>${e(chapterLabel(g.chapter))} · ${e(g.category||'待分類')}</small><span class="gallery-status ${cls}">${label}</span></div>
      <h3>${e(g.title)}</h3>${g.summary?`<p class="gallery-summary">${e(g.summary)}</p>`:''}
      ${tags?`<div class="gallery-tags">${tags}</div>`:''}
      ${g.relatedChapters?.length?`<div class="gallery-related">關聯章節：${g.relatedChapters.map(c=>e(chapterLabel(c))).join('、')}</div>`:''}
      <div class="gallery-actions">${src?`<button class="btn small primary" data-act="preview" data-v="${e(g.id)}">放大閱讀 ↗</button>`:`<button class="btn small" data-act="upload" data-v="${e(g.id)}">匯入圖卡</button>`}
        ${g.relatedNote?`<button class="btn small" data-act="gotoNote" data-v="${e(g.relatedNote)}">文字重點</button>`:''}</div>
    </div></article>`;}).join('')}</div>`;
 const groups={
  '1':['核心概念','發展分期','影響因素','發展時機','理論與學者','教檢應用'],
  '2':['發展理論總覽','心理分析與心理社會發展','行為與社會學習','認知與社會文化發展','環境與文化發展','人本與個體心理學','研究方法與設計','理論比較與整合'],
  '3-4':['產前發展與身體成長','神經元與神經系統成熟','大腦構造與認知情緒功能','感覺知覺與動作發展','教檢應用與概念整合'],
  '5':['皮亞傑的認知建構機制','三歲前語言發展歷程與結構','語言習得理論','語言思維與社會互動','語言發展的影響因素'],
  '6':['情緒、氣質與自我發展','依附理論與早期照顧','社會情緒學習與自我調節','兒少保護與教檢應用']
 };
 const groupedMode=state.gallerySort==='study'&&!term&&state.galleryKind==='all';
 const chapterCards=(ch,items)=>{
  if(!items.length)return '';
  if(!groupedMode||!groups[ch])return cards(items);
  const existing=new Set(items.map(g=>g.category));
  return groups[ch].filter(cat=>existing.has(cat)).map(cat=>{
     const entries=items.filter(g=>g.category===cat);
     return `<div class="gallery-section-title"><strong>${e(cat)}</strong><span>${entries.length} 張圖卡</span></div>${cards(entries)}`;
   }).join('')+ (items.some(g=>!groups[ch].includes(g.category))?cards(items.filter(g=>!groups[ch].includes(g.category))):'');
 };
 const selectedChapters=state.galleryChapter==='all'?chapterOrder:[state.galleryChapter];
 const main=selectedChapters.map(ch=>{
   const entries=filtered.filter(g=>g.chapter===ch);
   if(!entries.length)return '';
   const header=state.galleryChapter==='all'?`<div class="gallery-chapter-title"><h2>${e(chapterLabel(ch))}｜${e(chapter(ch)?.title||'圖片筆記')}</h2><span>${entries.length} 張</span></div>`:'';
   return header+chapterCards(ch,entries);
 }).join('');
 return `${pageHead('VISUAL NOTES','圖片筆記庫','前八章共 113 張原始圖卡已內建，依知識主題閱讀，或切換原始編號查找。')}
  <div class="gallery-overview"><strong>已內建 ${built} 張</strong><span>另外 ${uploaded} 張儲存於此裝置 · ${G.length-built-uploaded} 張待匯入</span><span class="gallery-overview-hint">原圖隨網站發布，點選圖片可放大閱讀</span></div>

  <div class="gallery-filterbar"><div class="tabs">${chip('全部類型',state.galleryKind==='all','galleryKind','all')}${chip('核心知識',state.galleryKind==='core','galleryKind','core')}${chip('教檢應用',state.galleryKind==='application','galleryKind','application')}</div>
    <input class="gallery-search" id="gallerySearch" type="search" autocomplete="off" placeholder="搜尋主題、學者、概念…" value="${e(state.gallerySearch)}" aria-label="搜尋圖片筆記"></div>
  <div class="gallery-sortbar" aria-label="圖片筆記排序"><span>閱讀排序</span>${chip('知識學習順序',state.gallerySort==='study','gallerySort','study')}${chip('原始圖卡編號',state.gallerySort==='number','gallerySort','number')}<small>排序不改變圖卡原始編號</small></div>
  ${filtered.length?main:'<div class="card empty">沒有符合條件的圖卡。請切換章節或搜尋詞。</div>'}
  <input id="imageUpload" type="file" accept="image/jpeg,image/png,image/webp" class="file-input">`;
}

function renderQuiz(){if(!state.quiz)return statsQuiz();if(state.quizFinal)return showQuizResult();const a=state.quiz,idx=state.quizIdx,q=a[idx],sel=state.quizSelected[q.id],answered=!!sel,show=state.quizMode==='practice'&&answered;const progress=Object.keys(state.quizSelected).length;return `${pageHead('PRACTICE MODE',state.quizMode==='mock'?'模擬測驗':'選擇題練習','作答後記錄練習結果，並可收藏與錯題重練。')}
<div class="question-card"><div class="card" style="margin-bottom:13px"><div class="card-top"><div class="q-meta"><span class="tag">第 ${idx+1} / ${a.length} 題</span><span class="tag neutral">${e(chapterLabel(q.chapter))}</span><span class="tag neutral">${q.type==='past'?'歷屆試題':'自編練習'}</span></div><button class="btn small" data-act="finishQuiz">${state.quizMode==='mock'?'交卷':'結束練習'}</button></div><div class="progress-track"><b style="width:${progress/a.length*100}%"></b></div></div>
<div class="card"><div class="q-meta"><span class="caps">${e(q.year)} ${q.type==='past'?'｜第 '+q.num+' 題':'｜自編題'}</span><span class="tiny muted" style="margin-left:auto">${e(q.id)}</span></div>${q.context?`<div class="q-context">${p(q.context)}</div>`:''}<div class="q-stem">${p(q.stem)}</div><div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option ${show&&(k===q.answer?'good':(k===sel?'bad':''))} ${!show&&sel===k?'active':''}" data-act="answer" data-v="${k}" ${show?'disabled':''}><span class="letter">${k}</span><span>${p(v)}</span></button>`).join('')}</div>
${show?`<div class="answerbox ${sel===q.answer?'good':'bad'}"><strong>${sel===q.answer?'✓ 回答正確':'✕ 答錯了'}｜正確答案：${e(q.answer)}</strong><div style="margin-top:7px">${e(q.explanation)}</div>${(q.noteId||(q.relatedNotes||[]).length)?[...new Set([q.noteId,...(q.relatedNotes||[])].filter(Boolean))].slice(0,3).map(id=>`<button class="btn small" style="margin-top:10px" data-act="gotoNote" data-v="${e(id)}">${e(chapterLabel(note(id)?.chapter))}｜${e(note(id)?.title||"相關觀念")} ↗</button>`).join(''):''}</div>`:''}
<div class="q-bottom"><div class="btn-row"><button class="btn small" data-act="prevQ" ${idx===0?'disabled':''}>← 上一題</button><button class="btn small" data-act="nextQ">${idx===a.length-1?'完成作答':'下一題 →'}</button></div><div class="btn-row"><button class="btn small ghost" data-act="bookmark" data-v="${e(q.id)}">${saved.bookmarked.includes(q.id)?'★ 已收藏':'☆ 收藏題目'}</button></div></div>
</div><p class="tiny muted" style="text-align:center">${e(q.theme||'')}${q.theme?' · ':''}${e(q.review||'')}</p></div>`}

function markAttempts(){for(const q of state.quiz||[]){const v=state.quizSelected[q.id];if(!v)continue;const a=saved.attempts[q.id]||[];a.push({choice:v,correct:v===q.answer,at:new Date().toISOString()});saved.attempts[q.id]=a.slice(-20)}persist()}
function showQuizResult(){const a=state.quiz||[],attempted=a.filter(x=>state.quizSelected[x.id]);const correct=attempted.filter(x=>state.quizSelected[x.id]===x.answer);return `${pageHead('SESSION COMPLETED','本次練習結果','完成一個小段落後，把不確定的概念重新補強。')}
<div class="card question-card" style="text-align:center"><div class="caps">正確作答／已作答</div><div class="score-big" style="margin:10px">${correct.length} <span class="tiny muted" style="font-size:19px">/ ${attempted.length}</span></div><p class="muted">共 ${a.length} 題，答對率 ${attempted.length?Math.round(correct.length/attempted.length*100):0}%</p><div class="btn-row" style="justify-content:center;margin:20px 0"><button class="btn primary" data-act="goto" data-v="mistakes">檢視錯題</button><button class="btn" data-act="restartQuiz">再練一回</button><button class="btn" data-act="resetQuiz">重新選題</button></div></div>
<div class="section-head"><h2>本回作答清單</h2></div><div class="list-cards">${a.map(q=>{const v=state.quizSelected[q.id],yes=v===q.answer;return `<div class="card review-row"><div><div class="btn-row"><span class="tag ${!v?'neutral':yes?'':'red'}">${!v?'未作答':yes?'答對':'答錯'}</span><span class="tiny muted">${e(q.year)} · ${e(chapterLabel(q.chapter))}</span></div><h3 style="margin-top:7px">${e(q.stem.slice(0,125))}${q.stem.length>125?'…':''}</h3><p>作答 ${e(v||'—')} ・ 正解 ${e(q.answer)}</p></div>${q.noteId?`<button class="btn small" data-act="gotoNote" data-v="${e(q.noteId)}">複習筆記</button>`:''}</div>`}).join('')}</div>`}
function wrongIds(){return Q.filter(q=>{const a=saved.attempts[q.id];return a?.length&&a[a.length-1].correct===false}).map(q=>q.id)}
function mistakes(){const w=wrongIds(),selected=state.mistakeTab||'wrong',ids=selected==='wrong'?w:saved.bookmarked,qs=Q.filter(q=>ids.includes(q.id));return `${pageHead('REVIEW & RECALL','錯題與收藏','錯題依每題最近一次已完成的作答結果判定；可回到相關筆記複習。')}
<div class="toolbar"><div class="tabs">${chip('待複習錯題 '+w.length,selected==='wrong','mistakeTab','wrong')}${chip('收藏題目 '+saved.bookmarked.length,selected==='book','mistakeTab','book')}</div><button class="btn small" data-act="retryWrong" ${!w.length?'disabled':''}>開始錯題重練 ↻</button></div>
${qs.length?`<div class="list-cards">${qs.map(q=>`<div class="card review-row"><div><div class="q-meta"><span class="tag ${selected==='wrong'?'red':'neutral'}">${selected==='wrong'?'待複習':'已收藏'}</span><span class="tiny muted">${e(q.year)} · ${e(chapterLabel(q.chapter))} · ${e(q.id)}</span></div><h3>${e(q.stem)}</h3><p>官方／設定正解：${e(q.answer)}　${q.type==='past'?'｜歷屆原題':'｜課堂練習'}</p></div><div class="btn-row">${q.noteId?`<button class="btn small" data-act="gotoNote" data-v="${e(q.noteId)}">看筆記</button>`:''}<button class="btn small" data-act="singleQuiz" data-v="${e(q.id)}">再做一次</button></div></div>`).join('')}</div>`:`<div class="card empty"><div class="empty-symbol">✧</div><strong>${selected==='wrong'?'目前沒有待複習錯題':'還沒有收藏題目'}</strong><p>先去題庫完成一回練習吧。</p><button class="btn" data-act="goto" data-v="quiz">前往題庫 →</button></div>`}`}
function essayView(){const items=eligibleEssays();return `${pageHead('WRITTEN PRACTICE','申論與綜合題練習','全部 62 題歷屆非選擇與綜合題。沿用「題庫練習」設定的章節組合與未對照題目開關。')}
<div class="infostrip" style="margin-bottom:16px">目前可閱讀 ${items.length} / ${E.length} 題。先至「題庫練習」勾選想要的章節組合，這裡會同步過濾；未確定章節的試題標示為「待章節對照」。作答會保存在本機，沒有未經校對的標準答案。</div>
<div class="btn-row" style="margin:0 0 18px"><button class="btn small" data-act="goto" data-v="quiz">調整章節組合 ↗</button><button class="btn small" data-act="allChapters">查看全部章節（含待對照）</button></div>
<div class="list-cards">${items.map((x,i)=>`<div class="card essay-item"><div class="q-meta"><span class="tag">${e(chapterLabel(x.chapter))}</span><span class="tag neutral">${e(x.year)} ${e(x.type)} ${x.num}</span><span class="tag neutral">${e(x.theme||'')}</span></div>${x.context?`<div class="q-context">${p(x.context)}</div>`:''}<div class="essaybox">${p(x.stem)}</div>${x.noteId?`<div class="infostrip" style="margin:12px 0 6px"><strong>${e(x.coreConcept||'核心觀念已對照')}</strong><div style="margin-top:9px"><button class="btn small" data-act="gotoNote" data-v="${e(x.noteId)}">對應圖片與文字筆記：${e(note(x.noteId)?.title||'')||e(x.noteId)} ↗</button></div></div>`:''}<div class="form-field" style="margin:16px 0 8px"><label for="essay-${i}">我的練習作答</label><textarea id="essay-${i}" class="writing-area" data-essay="${e(x.id)}" placeholder="先釐清題目的理論、關鍵概念，再提出具體應用……">${e(saved.essayText[x.id]||'')}</textarea></div><div class="tiny muted">${e(x.status)}</div></div>`).join('')||'<div class="card empty">目前組合沒有相符的申論題；請調整章節或包含待章節對照的題目。</div>'}</div>`}

function settings(){const total=Object.values(saved.attempts).flat().length;return `${pageHead('PREFERENCES','資料與設定','儲存設定僅作用於這個瀏覽器；GitHub Pages 靜態版不會自動同步跨裝置進度。')}
<div class="card"><div class="setting-item"><div><strong>匯出學習紀錄</strong><p>下載含已讀、選擇題作答、收藏、申論草稿與已匯入圖卡的備份檔。</p></div><button class="btn" data-act="export">匯出 JSON ↓</button></div>
<div class="setting-item"><div><strong>匯入學習紀錄</strong><p>在其他裝置復原已匯出的紀錄；匯入會取代此裝置的進度。</p></div><div><button class="btn" data-act="import">匯入 JSON ↑</button><input type="file" accept="application/json,.json" id="importFile" class="file-input"></div></div>
<div class="setting-item"><div><strong>深色顯示模式</strong><p>切換護眼閱讀配色。</p></div><button class="btn" data-act="toggleTheme">${saved.theme==='dark'?'切回淺色':'使用深色'}</button></div>
<div class="setting-item"><div><strong>清除學習紀錄</strong><p>移除已讀狀態、答題歷程、收藏及申論草稿；圖片另外保存在裝置資料庫。</p></div><button class="btn danger" data-act="clear">清除紀錄</button></div></div>
<div class="section-head"><h2>本版資料說明</h2></div><div class="infostrip">章節筆記：${N.length} 個單元；第一至第五章延續課堂教材，第六章 16 張、第七章 16 張、第八章 31 張圖卡皆已建立文字重點。第八章霸凌與性平相關規範已對照教育部現行法規（2026-10-27），日後仍須注意修法。選擇題：歷屆 ${Q.filter(x=>x.type==='past').length} 題；另有 ${Q.filter(x=>x.type==='course').length} 題課堂自編練習。申論與綜合題：歷屆 ${E.length} 題。第九至第十二章教材尚待整理，相關題目保留待章節對照，不代表它們不在考試範圍。歷屆答案已與官方選擇題參考答案配對；試題文字尚待逐題校對。圖卡：${G.length} 個索引，其中 ${G.filter(x=>x.src).length} 張已內建於網站，其餘待後續上傳整理。</div>`}
function render(){switch(state.page){case'dashboard':$('page').innerHTML=dashboard();break;case'notes':$('page').innerHTML=noteView();break;case'gallery':$('page').innerHTML=gallery();bindGalleryImages();break;case'quiz':$('page').innerHTML=renderQuiz();break;case'mistakes':$('page').innerHTML=mistakes();break;case'essays':$('page').innerHTML=essayView();break;case'settings':$('page').innerHTML=settings();break}document.title=keyTitles[state.page]+'｜兒童發展・全範圍複習站'}
function startQuiz(list){let arr=list||eligibleQuiz();if(!arr.length){toast('這個範圍目前沒有可練習的選擇題，請調整章節、考點或開啟「待章節對照」。');return;}if(!list){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}arr=arr.slice(0,state.quizCount===999?999:state.quizCount);}state.quiz=[...arr];state.quizSelected={};state.quizIdx=0;state.quizFinal=false;state.page='quiz';nav('quiz')}

function finishQuiz(){if(!state.quiz)return;const num=Object.keys(state.quizSelected).length;if(state.quizMode==='mock'&&num<state.quiz.length&&!confirm(`還有 ${state.quiz.length-num} 題未作答，確定交卷？`))return;markAttempts();state.quizFinal=true;render()}
function gotoNote(id){const n=note(id);if(!n){toast('尚無對應筆記');return}state.chapter=String(n.chapter);state.noteSearch='';state.expanded.add(n.id);nav('notes');setTimeout(()=>document.querySelector('[data-note="'+id+'"]')?.scrollIntoView({behavior:'smooth',block:'nearest'}),70)}
async function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject('indexedDB not available');const r=indexedDB.open('childdev-midterm-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function imageReadAll(){try{const db=await openDB();const keys=await new Promise((resolve,reject)=>{const x=db.transaction('images','readonly').objectStore('images').getAllKeys();x.onsuccess=()=>resolve(x.result);x.onerror=()=>reject(x.error)});for(const key of keys){const v=await new Promise((resolve,reject)=>{const x=db.transaction('images','readonly').objectStore('images').get(key);x.onsuccess=()=>resolve(x.result);x.onerror=()=>reject(x.error)});if(v)state.images[key]=v}db.close()}catch(err){/* private browsing or restrictive browser */}}
async function imagePut(id,data){const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(data,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();state.images[id]=data}
function bindGalleryImages(){/* Gallery thumbnails render from loaded IndexedDB values. */}
function preview(id){
 const item=G.find(x=>x.id===id);if(!item)return;
 const src=item.src||state.images[id];
 $('modalRoot').innerHTML=`<div class="modal-back" data-act="closeModal"><div class="modal-card" role="dialog" aria-modal="true" aria-label="圖片筆記預覽">
   <div class="modal-head"><div><strong>${e(item.title)}</strong><div class="tiny muted">${e(item.category||'圖片筆記')} · ${e(chapterLabel(item.chapter))}${item.src?' · 網站內建':''}</div></div><div class="modal-buttons">${src?'<button class="btn small" data-act="zoomPhoto">放大查看</button>':''}<button class="icon-btn" data-act="closeModal" aria-label="關閉預覽">×</button></div></div>
   ${src?`<div class="modal-image-space"><img class="modal-photo" alt="${e(item.title)}" src="${src}"></div>`:'<div class="empty">尚未匯入圖片。請使用卡片上的「匯入圖卡」選取原始圖片。</div>'}
   ${item.keywords?.length?`<p class="modal-keywords">關鍵概念：${item.keywords.map(e).join('、')}</p>`:''}
   ${item.relatedNote?`<button class="btn small" data-act="gotoNote" data-v="${e(item.relatedNote)}">閱讀對應文字筆記 ↗</button>`:''}
   ${item.relatedCards?.length?`<div class="gallery-links"><strong>延伸閱讀</strong><div class="gallery-actions">${item.relatedCards.map(id=>{const peer=G.find(g=>g.id===id);return peer?`<button class="btn small" data-act="preview" data-v="${e(peer.id)}">${e(chapterLabel(peer.chapter))} · ${e(peer.title)} ↗</button>`:''}).join('')}</div></div>`:''}
 </div></div>`;
}

function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const act=(name,v)=>{
 switch(name){
 case'goto':nav(v);break;
 case'openChapter':state.chapter=String(v);state.noteSearch='';nav('notes');break;
 case'openGalleryChapter':state.galleryChapter=String(v);state.gallerySearch='';state.galleryKind='all';nav('gallery');break;
 case'setChapter':state.chapter=String(v);state.noteSearch='';render();break;
 case'galleryChapter':state.galleryChapter=String(v);render();break;
 case'galleryKind':state.galleryKind=String(v);render();break;
 case'gallerySort':state.gallerySort=String(v);render();break;
 case'expand':state.expanded.has(v)?state.expanded.delete(v):state.expanded.add(v);render();break;
 case'markDone':saved.completed=saved.completed.includes(v)?saved.completed.filter(x=>x!==v):[...saved.completed,v];persist();render();break;
 case'noteQuiz':{const arr=Q.filter(x=>questionForNote(x,v));if(!arr.length){toast('目前沒有直接對應這項筆記的考題，可改用自選章節組合。');state.quizChapters=[note(v)?.chapter||'1'];state.includePending=false;state.quizTheme='all';state.quizType='all';nav('quiz')}else{state.quizMode='practice';startQuiz(arr)}break}
 case'gotoNote':gotoNote(v);break;
 case'allChapters':captureQuizFilters();state.quizChapters=C.map(c=>c.id);state.includePending=true;render();break;
 case'earlyChapters':captureQuizFilters();state.quizChapters=['1','2','3-4','5'];state.includePending=false;render();break;
 case'clearChapters':captureQuizFilters();state.quizChapters=[];state.includePending=false;render();break;
 case'startQuiz':captureQuizFilters();startQuiz();break;
 case'answer':{if(!state.quiz||state.quizFinal)return;const q=state.quiz[state.quizIdx];if(state.quizMode==='practice'&&state.quizSelected[q.id])return;state.quizSelected[q.id]=v;render();break}
 case'prevQ':state.quizIdx=Math.max(0,state.quizIdx-1);render();break;
 case'nextQ':if(state.quizIdx===state.quiz.length-1){finishQuiz()}else{state.quizIdx++;render()}break;
 case'finishQuiz':finishQuiz();break;
 case'restartQuiz':{const list=[...state.quiz];startQuiz(list);break}
 case'resetQuiz':state.quiz=null;state.quizFinal=false;render();break;
 case'bookmark':saved.bookmarked=saved.bookmarked.includes(v)?saved.bookmarked.filter(x=>x!==v):[...saved.bookmarked,v];persist();render();break;
 case'mistakeTab':state.mistakeTab=v;render();break;
 case'retryWrong':{const ids=wrongIds();if(!ids.length)return;state.quizMode='practice';startQuiz(Q.filter(x=>ids.includes(x.id)));break}
 case'singleQuiz':{const q=Q.find(x=>x.id===v);if(q){state.quizMode='practice';startQuiz([q])}break}
 case'upload':state.activeUpload=v;$('imageUpload')?.click();break;
 case'preview':preview(v);break;
 case'zoomPhoto':{const photo=document.querySelector('.modal-photo');if(photo){photo.classList.toggle('is-zoomed');const b=document.querySelector('[data-act="zoomPhoto"]');if(b)b.textContent=photo.classList.contains('is-zoomed')?'縮回適應視窗':'放大查看'}break;}
 case'closeModal':$('modalRoot').innerHTML='';break;
 case'toggleTheme':setTheme(saved.theme==='dark'?'light':'dark');render();break;
 case'export':downloadJSON({app:'childdev-study',version:2,progress:saved,images:state.images},'兒童發展_複習紀錄.json');toast('已準備下載備份');break;
 case'import':$('importFile')?.click();break;
 case'clear':if(confirm('確定清除所有已讀、答題、收藏及申論草稿？此動作無法復原。')){saved={completed:[],bookmarked:[],attempts:{},essayText:{},theme:saved.theme};persist();render();toast('已清除學習紀錄')}break;
 }
};

document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-act]');if(btn){if(btn.dataset.act==='closeModal'&&ev.target!==btn&&!ev.target.closest('.icon-btn'))return;act(btn.dataset.act,btn.dataset.v)}const navB=ev.target.closest('[data-page]');if(navB)nav(navB.dataset.page)});
document.addEventListener('input',ev=>{if(ev.target.id==='gallerySearch'){const v=ev.target.value;const pos=ev.target.selectionStart;state.gallerySearch=v;render();const n=$('gallerySearch');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}else if(ev.target.id==='noteSearch'){const v=ev.target.value;const pos=ev.target.selectionStart;state.noteSearch=v;render();const n=$('noteSearch');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}else if(ev.target.dataset.essay){saved.essayText[ev.target.dataset.essay]=ev.target.value;persist()}});
document.addEventListener('change',async ev=>{if(ev.target.dataset.chapterChoice){captureQuizFilters();const id=ev.target.dataset.chapterChoice;state.quizChapters=ev.target.checked?[...state.quizChapters,id]:state.quizChapters.filter(x=>x!==id);state.includePending=false;render();return}if(ev.target.id==='includePending'){captureQuizFilters();state.includePending=ev.target.checked;render();return}if(['qType','qTheme','qMode','qCount'].includes(ev.target.id)){captureQuizFilters();render();return}if(ev.target.id==='imageUpload'&&ev.target.files?.[0]){const file=ev.target.files[0];if(file.size>7*1024*1024){toast('圖片太大，建議小於 7 MB。');return}const reader=new FileReader();reader.onload=async()=>{try{await imagePut(state.activeUpload,reader.result);render();toast('圖片已儲存到本機圖卡庫')}catch{toast('此瀏覽器無法儲存圖片，請改用一般瀏覽模式。')}};reader.readAsDataURL(file)}else if(ev.target.id==='importFile'&&ev.target.files?.[0]){try{const j=JSON.parse(await ev.target.files[0].text());if(!['childdev-midterm','childdev-study'].includes(j.app)||!j.progress)throw Error('檔案格式不符');if(!confirm('匯入備份會取代現有紀錄，確定繼續？'))return;saved={...saved,...j.progress};persist();if(j.images){for(const [id,data] of Object.entries(j.images)){if(typeof data==='string'&&/^data:image\//.test(data))await imagePut(id,data)}}setTheme(saved.theme||'light');render();toast('學習紀錄已匯入')}catch(err){toast('匯入失敗：'+(err.message||err))}}});
$('navToggle').addEventListener('click',()=>{$('sidebar').classList.add('open');$('shade').hidden=false});$('navClose').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').hidden=true});$('shade').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').hidden=true});$('themeToggle').addEventListener('click',()=>{setTheme(saved.theme==='dark'?'light':'dark');render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modalRoot').innerHTML=''});
render();imageReadAll().then(()=>{if(state.page==='gallery')render()});
})();

</script>
</body></html>
