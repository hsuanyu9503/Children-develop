window.NOTES=[{"id":"1-01","chapter":1,"title":"人類發展的三大領域","lead":"人類發展研究一生的變化與穩定模式，三大領域彼此交互影響。","points":["身體發展：身體、腦與神經、感覺、動作及健康。","認知發展：學習、注意、記憶、語言、思考、推理與創造力。","心理社會發展：情緒、人格與人際關係。"],"tags":["發展領域","身體","認知","心理社會"],"trap":"三大領域是分析工具，並非互不相干。","source":"教師課堂投影片","related":[]},{"id":"1-02","chapter":1,"title":"生命全程的八個時期","lead":"發展貫穿一生，分期有助研究，但年齡界線也受到社會文化影響。","points":["出生前期：受孕至出生；重要的身體發育階段。","嬰幼兒期：出生至約3歲；感覺動作、語言與依附迅速成長。","兒童期早期：約3–6歲；象徵思考與語言繼續發展。","兒童期中期：約6–11歲；具體邏輯與自我概念逐漸成熟。","青春期：約11–20歲；生理成熟、抽象推理與認同探索。","成人期早期／中期／晚期：依課堂教材約20–40、40–65、65歲以上。"],"tags":["八時期","生命全程","發展階段"],"trap":"這裡使用老師投影片的約略年齡；學者或教材分期可能不同。","source":"教師課堂投影片","related":[]},{"id":"1-03","chapter":1,"title":"遺傳、環境與成熟","lead":"發展並非由單一因素決定；先天條件與生活經驗交互作用。","points":["遺傳：從生物親代獲得的先天性狀與傾向。","成熟：生理與行為依一定發展順序逐漸展開的歷程。","環境：家庭、社會文化、營養、教育與重要生命事件等經驗。","常態性影響：多數同年齡或同世代共享的發展影響。","非常態性影響：非預期且對個人影響顯著的特殊事件。"],"tags":["遺傳","環境","成熟","常態性","非常態性"],"trap":"「常態性」不是好或正常，「非常態性」也不是有問題的同義詞。","source":"教師課堂投影片","related":[]},{"id":"1-04","chapter":1,"title":"關鍵期、敏感期與可塑性","lead":"同樣的經驗，在不同時期可能有不同的發展效果。","points":["關鍵期：特定時段內是否出現某些事件，會對特定發展結果造成深刻影響。","敏感期：對特定經驗較容易產生反應的時期，通常不代表錯過就完全無法學習。","可塑性：表現與發展可因經驗、練習或支持而改變。","銘印是動物研究中討論時間敏感性的重要例子；Genie 案例需同時考慮剝奪、創傷等混雜因素。"],"tags":["關鍵期","敏感期","可塑性","銘印","Genie"],"trap":"不可單憑極端個案認定人類語言有絕對不可逆的年齡門檻。","source":"教師課堂投影片","related":[]},{"id":"1-05","chapter":1,"title":"Baltes：生命全程發展七原則","lead":"生命全程發展觀點強調發展是一輩子的、多重方向且具環境脈絡。","points":["終生性：發展不僅發生在兒童期。","多向度：生理、認知、心理社會領域共同構成發展。","多方向性：某些能力可能增加，另一些能力可能減少。","生物與文化的相對影響會隨生命階段改變。","發展涉及資源配置：成長、維持與恢復，以及調節失落。","可塑性：在一定範圍內仍有改變可能。","歷史文化脈絡：時代與社會條件會形塑發展。"],"tags":["Baltes","生命全程","七原則"],"trap":"不要將多向度（不同領域）與多方向性（增長及衰退並存）混淆。","source":"教師課堂投影片","related":[]},{"id":"2-01","chapter":2,"title":"發展理論的基本爭點","lead":"各理論主要回答：發展由誰驅動？如何改變？","points":["遺傳與環境：發展差異來自哪些因素。","主動與被動：兒童是否主動建構與選擇經驗。","連續與階段：逐漸量變，或具有質的差異之發展階段。","機械論較重刺激反應、被動與量變；有機論較重主動組織與質變。"],"tags":["理論爭點","主動被動","連續階段"],"trap":"理論間並非非黑即白，混合立場需依具體命題判讀。","source":"教師課堂投影片","related":[]},{"id":"2-02","chapter":2,"title":"Freud：人格結構與性心理發展","lead":"心理分析論強調潛意識動機、內在衝突與早期經驗。","points":["本我：追求本能需求的滿足。自我：在現實條件下調節需求。超我：內化的道德標準與良知。","意識、前意識、潛意識是描述心理意識層次的概念，不等同三種人格結構。","性心理發展分期：口腔期、肛門期、性器期、潛伏期、生殖期。","固著是 Freud 理論對早期衝突未適當解決之後續影響的解釋。"],"tags":["Freud","佛洛依德","本我","自我","超我","固著"],"trap":"此為歷史性理論，部分性別相關主張受時代背景限制，不可直接當代科學事實。","source":"教師課堂投影片","related":[]},{"id":"2-03","chapter":2,"title":"防衛機制辨析","lead":"自我面對焦慮與衝突時，可能透過不同方式保護自身。","points":["壓抑：將難以接受的想法排除在意識之外。否認：拒絕承認威脅性的現實。","投射：把自己的不被接受想法歸給他人。合理化：為行為提出看似合理的解釋。","反向作用：以相反的態度或行為掩蓋難以接受的衝動。","退化：回到較早期的行為方式。替代：將情緒轉移到較安全的對象。","昇華：將衝動轉化為社會較能接納的活動。補償：在其他方面努力彌補不足。"],"tags":["防衛機制","投射","合理化","反向作用","替代"],"trap":"「替代」是情緒或衝動移往別的對象；「昇華」是轉化為建設性活動。","source":"教師課堂投影片","related":[]},{"id":"2-04","chapter":2,"title":"Erikson：心理社會發展","lead":"人格在一生中持續發展，每個階段都存在待整合的心理社會課題。","points":["嬰兒：信任對不信任。","幼兒：自主對羞愧懷疑。","學前：主動（自動自發）對罪惡感。","學齡：勤奮對自卑；重要情境為學習表現與能力感。","青少年：自我認同對角色混淆；其餘成人期仍有發展任務。"],"tags":["Erikson","艾瑞克森","勤奮對自卑","心理社會"],"trap":"Freud 偏重性心理與早期經驗，Erikson 強調社會文化且發展貫穿一生。","source":"教師課堂投影片","related":[]},{"id":"2-05","chapter":2,"title":"古典制約：Pavlov","lead":"原本中性的刺激，經與能引發反應的刺激反覆配對後，也能引發反應。","points":["US／UCS（非制約刺激）→ UR／UCR（非制約反應）。","原中性刺激與非制約刺激配對，形成 CS（制約刺激）→ CR（制約反應）。","常見現象：類化、辨別、消弱及自發恢復。","關注刺激與非自主／反應性行為的連結。"],"tags":["Pavlov","古典制約","制約刺激","類化"],"trap":"古典制約著重刺激聯結；操作制約著重行為的後果。","source":"教師課堂投影片","related":[]},{"id":"2-06","chapter":2,"title":"操作制約：Skinner","lead":"行為後果改變未來同一行為出現的可能性。","points":["正增強：加入喜好刺激，使行為增加。負增強：移除嫌惡刺激，使行為增加。","正懲罰（施予式）：加入嫌惡後果，使行為減少。負懲罰（剝奪式）：移除喜好刺激，使行為減少。","初期可連續增強建立行為，維持階段可採間歇增強。","行為塑造：逐步增強接近目標的反應；代幣制度運用象徵增強物。"],"tags":["Skinner","操作制約","正增強","負增強","懲罰","增強時制"],"trap":"正／負指刺激的加入或移除，增強／懲罰指行為增加或減少。","source":"教師課堂投影片","related":[]},{"id":"2-07","chapter":2,"title":"Bandura：社會學習與交互決定論","lead":"個體可透過觀察他人學習，行為並非只有親自受獎懲才會改變。","points":["觀察與模仿：榜樣行為提供學習訊息。","替代增強／懲罰：觀察他人的後果，改變自身是否表現該行為的可能性。","交互決定論：個人、行為與環境三者相互影響。","班度拉以攻擊玩偶研究展示示範行為與結果對兒童表現的影響。"],"tags":["Bandura","班度拉","觀察學習","替代增強","交互決定"],"trap":"學習到行為與實際表現行為可分開看待。","source":"教師課堂投影片","related":[]},{"id":"2-08","chapter":2,"title":"Piaget：認知發展機制","lead":"兒童透過主動建構認知基模、同化與調適理解世界。","points":["基模：用來理解和行動的認知結構。","同化：以既有基模理解新經驗。調適：修改基模因應新經驗。","平衡化：在認知失衡後透過適應重新達到相對穩定。","四期：感覺動作期、前運思期、具體運思期、形式運思期。"],"tags":["Piaget","皮亞傑","同化","調適","基模","平衡"],"trap":"同化不改原有基模，調適才需修正基模；第五章會深入感覺動作期。","source":"教師課堂投影片","related":[]},{"id":"2-09","chapter":2,"title":"Piaget：四階段與典型能力","lead":"不同階段的思考能力具有質的差異。","points":["感覺動作（約0–2）：以感覺與動作認識世界、逐漸形成物體恆存。","前運思（約2–7）：象徵功能擴展，仍易集中於單一特徵與自我中心。","具體運思（約7–11）：守恆、可逆、去集中化與具體邏輯推理。","形式運思（約11歲起）：假設性、抽象與演繹推理。"],"tags":["Piaget","感覺動作","前運思","具體運思","形式運思"],"trap":"分期年齡為典型估計，存在個體與情境差異。","source":"教師課堂投影片","related":[]},{"id":"2-10","chapter":2,"title":"Vygotsky：社會文化與近側發展區","lead":"高層次心智功能透過與他人互動、文化工具及語言而發展。","points":["近側發展區（ZPD）：獨立能力與在協助下可達成能力之間的區間。","鷹架（後續學者擴展的教學概念）：依能力提供支持，逐步撤除。","私我語言可幫助兒童規劃、監控並調整行為。","重視社會互動、語言內化與文化脈絡。"],"tags":["Vygotsky","維高斯基","近側發展區","鷹架","私我語言"],"trap":"鷹架概念與 Vygotsky 關聯密切，但術語由後續研究者提出。","source":"教師課堂投影片","related":[]},{"id":"2-11","chapter":2,"title":"Bronfenbrenner：生態系統","lead":"兒童生活於相互交織的環境系統中。","points":["微系統：直接互動的家庭、學校、同儕。","中系統：不同微系統的連結，如親師合作。","外系統：兒童未直接參與但會間接影響的情境，如家長職場。","大系統：文化、社會價值及制度。時間系統：時間變遷、生命事件及歷史脈絡。"],"tags":["Bronfenbrenner","布朗芬布倫納","微系統","外系統","時間系統"],"trap":"要先判斷兒童是否直接參與，再辨別微系統或外系統。","source":"教師課堂投影片","related":[]},{"id":"2-12","chapter":2,"title":"人本與個別心理學概觀","lead":"課堂將人本、個別心理學列為發展理論的補充比較。","points":["Maslow：需求層級與自我實現。","Rogers：真誠、同理、無條件積極關懷，重視關係中的成長條件。","Adler：強調社會連結、歸屬感與目的性的行為理解。","這些主張與教育心理、諮商輔導重疊，本網站只呈現課堂第二章的概觀。"],"tags":["Maslow","Rogers","Adler","人本主義"],"trap":"個別心理學雖源自精神動力傳統，也強調社會與目標，不宜直接等同人本治療。","source":"教師課堂投影片","related":[]},{"id":"2-13","chapter":2,"title":"研究方法與設計","lead":"理論主張需透過合適研究方法來蒐集與檢驗證據。","points":["橫斷研究：同一時間比較不同年齡群。","縱貫研究：追蹤同一群體隨時間改變。","序列研究：結合不同出生世代與追蹤，以減少單一方法限制。","觀察、自我報告、實驗、相關研究、個案研究等各有用途。","Mead 跨文化研究提醒我們留意社會文化對青春期與性別角色的影響。"],"tags":["橫斷研究","縱貫研究","序列研究","Mead"],"trap":"相關不代表因果；縱貫可看個人變化，但有追蹤流失等問題。","source":"教師課堂投影片","related":[]},{"id":"3-01","chapter":3,"title":"產前發展與影響因素","lead":"受孕至出生前的發展受到生理條件與外在環境影響。","points":["課堂特別列舉父母與家庭條件、營養、藥物、酒精、尼古丁、咖啡因及毒品等因素。","疾病、孕期焦慮壓力與生育年齡亦可能改變發展風險。","空氣污染、化學物質與輻射等環境暴露也需考量。","危險因子的效果與接觸劑量、時期及個體狀況有關。"],"tags":["產前發展","環境影響","致畸風險"],"trap":"風險因素不表示接觸即必然造成特定結果。","source":"教師課堂投影片","related":[]},{"id":"3-02","chapter":3,"title":"分娩與出生環境","lead":"生產方式及孕產婦所獲得的支持，屬於第三章的課堂討論重點。","points":["生產方式、支持性生產環境、陪產與產婦自主權是課堂議題。","投影片使用臺灣歷史統計資料討論醫療介入與性別偏見，舊數據不應當作當前年份的事實。","以婦幼安全、知情選擇與尊重為主要理解方向。"],"tags":["分娩","出生環境","支持性環境"],"trap":"本網站不重現課堂舊年份醫療統計為現況。","source":"教師課堂投影片","related":[]},{"id":"3-03","chapter":3,"title":"出生併發症與發展風險","lead":"出生時可能面臨早產、低出生體重或過期妊娠等情況。","points":["早產、體重不足與過期妊娠是投影片列出的出生併發症類型。","出生風險可能增加後續健康與發展困難機率，但個別結果差異很大。","及時醫療、照顧品質、家庭支持與追蹤介入，有助促進後續發展。"],"tags":["早產","低出生體重","出生風險"],"trap":"不應以單一出生風險預測兒童未來能力。","source":"教師課堂投影片","related":[]},{"id":"3-04","chapter":3,"title":"保護性因素與復原力","lead":"支持性環境有助減緩高風險背景對發展的不利影響。","points":["個人保護條件包含氣質、健康狀況與個人能力等。","至少一名穩定支持、關心兒童的家庭成員，是課堂的重要例子。","學校或生活中的參與感與意義感，也可成為保護因素。","課堂提醒，針對高風險嬰幼兒的介入需要有一定的延續性，不只一次性的短暫支持。"],"tags":["保護性因素","復原力","家庭支持"],"trap":"復原力不代表風險完全消失；是個體與支持系統持續交互作用的過程。","source":"教師課堂投影片","related":[]},{"id":"4-01","chapter":4,"title":"身體成長兩大方向","lead":"身體與動作能力通常遵循有方向性的發展趨勢。","points":["頭尾原則：發展控制由頭部往身體下方逐漸成熟。","近遠端（基部末梢）原則：由身體中心往四肢末端發展。","例如頭頸控制通常先於獨立步行，肩臂的控制通常先於精細指尖動作。","發展方向屬整體趨勢，不是每位兒童完全一致的時間表。"],"tags":["頭尾原則","近遠端原則","生長"],"trap":"頭尾指上下方向，近遠端指中心往外。","source":"教師課堂投影片","related":[]},{"id":"4-02","chapter":4,"title":"神經元、髓鞘化與突觸修剪","lead":"神經系統成熟與訊息傳遞效率息息相關。","points":["神經元透過樹突接收訊息，沿軸突傳導訊息，並經突觸與其他細胞溝通。","髓鞘化提高神經訊息傳遞的速度與效率。","細胞凋亡與突觸修剪涉及多餘連結的減除與網絡精緻化。","大腦的可塑性代表神經連結可隨發展及經驗改變。"],"tags":["神經元","髓鞘化","突觸修剪","可塑性"],"trap":"髓鞘化與突觸修剪不是同一過程：前者改善傳導、後者調整連結。","source":"教師課堂投影片","related":[]},{"id":"4-03","chapter":4,"title":"四大腦葉與典型功能","lead":"認識腦區主要功能是理解兒童情緒、感覺與認知行為的重要基礎。","points":["額葉／前額葉：決策、規劃、抑制控制及執行功能。","頂葉：體感覺、空間整合。","顳葉：聽覺處理、部分語言與記憶相關功能。","枕葉：視覺訊息處理。"],"tags":["額葉","前額葉","頂葉","顳葉","枕葉"],"trap":"大腦功能由多區合作完成，不能把複雜行為只歸因於單一腦區。","source":"教師課堂投影片","related":[]},{"id":"4-04","chapter":4,"title":"深層構造與邊緣系統","lead":"多個皮質下構造共同參與記憶、情緒與生理調節。","points":["海馬迴：新記憶形成與部分空間記憶歷程。","杏仁核：威脅、情緒顯著性與情緒學習。","下視丘：體內恆定及內分泌相關調節。","視丘：多種感覺訊息傳遞與整合的重要樞紐。","胼胝體：連接左右大腦半球的主要神經纖維束。"],"tags":["海馬迴","杏仁核","下視丘","視丘","胼胝體"],"trap":"海馬迴與杏仁核都和記憶相關，但側重的歷程不同。","source":"教師課堂投影片","related":[]},{"id":"4-05","chapter":4,"title":"腦側化與語言區","lead":"左右半球存在部分功能專化，但兩半球持續合作。","points":["多數人的語言功能較偏左半球；布洛卡區與威尼克區涉及不同語言處理環節。","胼胝體支持左右半球之間的訊息交流。","腦側化不代表左腦完全理性、右腦完全感性；過度二分並不精確。"],"tags":["腦側化","布洛卡區","威尼克區","胼胝體"],"trap":"避免把全腦功能簡化成左腦／右腦人格類型。","source":"教師課堂投影片","related":[]},{"id":"4-06","chapter":4,"title":"早期感覺與知覺發展","lead":"嬰兒的觸覺、嗅味覺、聽覺與視覺能力在不同時間快速發展。","points":["觸覺、嗅覺及味覺在生命早期已相當重要。","聽覺與對聲音的辨識，在出生前後持續發展。","視覺清晰度與深度知覺逐步成熟，受視覺和移動經驗影響。","視覺懸崖研究提醒：深度知覺、移動經驗與是否跨越危險區域的行為應分開分析。"],"tags":["觸覺","視覺","聽覺","視覺懸崖"],"trap":"「會知覺深度」不等於「一定會害怕高度」。","source":"教師課堂投影片","related":[]},{"id":"4-07","chapter":4,"title":"原始反射與動作發展","lead":"反射是早期神經功能的重要指標，後續逐步發展自主動作。","points":["覓食反射、吸吮反射、抓握反射等是早期常見反射。","大肌肉：翻身、坐、爬、站、走、跑跳；小肌肉：抓取、使用手指、扣扣子與書寫。","課堂提供各動作里程碑的約略月齡，應視為參考範圍而非強制時間點。","爬行及探索可提供感覺、動作、距離知覺與社會參照的經驗。"],"tags":["反射","大肌肉","小肌肉","動作里程碑"],"trap":"單一里程碑較晚不等於能自行診斷發展異常。","source":"教師課堂投影片","related":[]},{"id":"4-08","chapter":4,"title":"成長條件與環境支持","lead":"兒童成長同時受到生理機制、營養、健康與照顧環境影響。","points":["生物性因素：基因、荷爾蒙與疾病。","環境因素：營養不足或過剩、生活壓力及照顧品質。","非器質性成長遲緩及情緒匱乏相關現象，反映成長與照顧環境的關係。","需要依個別狀況進行專業評估與支持，不能由單一因素直接推斷。"],"tags":["營養","成長遲緩","照顧環境"],"trap":"課堂概念屬發展教育理解，不應替代醫療診斷。","source":"教師課堂投影片","related":[]},{"id":"5-01","chapter":5,"title":"感覺動作期：六個次階段","lead":"約出生至兩歲，嬰兒主要透過感覺與動作建立知識。","points":["反射活動（出生至約1個月）。","初級循環反應（約1–4個月）：重複與自身身體相關的愉快行為。","次級循環反應（約4–8個月）：重複對外在事物造成有趣效果的動作。","次級基模協調（約8–12個月）：組合動作達成目標。","三級循環反應（約12–18個月）：以變化方式主動實驗。","心智表徵（約18–24個月）：能在心中表徵，出現延宕模仿等能力。"],"tags":["Piaget","感覺動作期","六次階段","循環反應"],"trap":"年齡僅為理論上的近似範圍。","source":"教師課堂投影片","related":[]},{"id":"5-02","chapter":5,"title":"循環反應、延宕模仿與物體恆存","lead":"嬰兒重複動作並非毫無意義，而是透過反覆操作探索世界。","points":["循環反應：重複偶然發現的有趣結果，逐步形成穩定行動基模。","延宕模仿：沒有立即呈現示範時，仍能重現先前看過的動作。","物體恆存：即使看不到物體，也理解它仍存在。","現代研究指出部分能力可能比 Piaget 原先觀察的年齡更早出現，須區分實驗方法和理論主張。"],"tags":["循環反應","延宕模仿","物體恆存"],"trap":"「暫時看不見」不等於「物體消失」，也是躲貓貓遊戲的重要認知背景。","source":"教師課堂投影片","related":[]},{"id":"5-03","chapter":5,"title":"三歲前的語言發展歷程","lead":"早期語言從辨音、發聲、首詞逐步走向雙詞與語法組合。","points":["前語言階段包含聲音辨識、發聲與模仿。","首詞通常約在一歲前後逐漸出現；課堂列出約10–14個月作為參考。","約18–24個月可見雙詞組合與電報式話語。","詞彙成長加速（詞彙爆發）在部分幼兒較明顯，但個體差異甚大。"],"tags":["語音","語彙","語句","電報式話語"],"trap":"不同兒童學語速度差異大，月齡是描述趨勢，不是判斷發展的唯一標準。","source":"教師課堂投影片","related":[]},{"id":"5-04","chapter":5,"title":"語言四要素：語音、語意、語法、語用","lead":"辨識語言問題時，先判斷是在「聲音、意義、句子結構或使用情境」哪個層面。","points":["語音：語言的聲音系統與音韻辨識。","語意：詞、句所傳達的意義與關係。","語法：詞彙組合成合乎規則句子的結構。","語用：依對象、意圖與社會情境使用語言，例如暗示、輪流談話或修補訊息。"],"tags":["語音","語意","語法","語用"],"trap":"分不清注音聲音偏語音；理解「弦外之音」偏語用。","source":"教師課堂投影片","related":[]},{"id":"5-05","chapter":5,"title":"語言習得：學習論、先天論、互動論","lead":"不同理論對語言來自何處提供不同的解釋。","points":["學習論：模仿、刺激與增強對語言習得的影響。","先天論：人類具備學習語言的先天準備，Chomsky 的 LAD 為經典主張。","Slobin 提出語言製造能力（LMC），強調兒童主動找出輸入語言的規則。","互動論：生理準備、認知發展與社會互動共同參與。"],"tags":["學習論","先天論","互動論","Chomsky","Slobin"],"trap":"純模仿無法充分解釋幼兒能說出未曾直接聽過的句子。","source":"教師課堂投影片","related":[]},{"id":"5-06","chapter":5,"title":"Vygotsky：社會語言、私語與內在語言","lead":"語言最初用於人際互動，逐漸成為引導自身思考與行為的工具。","points":["社會語言：與他人溝通。","私我語言：自言自語地規劃、調整或解決任務。","內在語言：語言內化成較不外顯的思考工具。","遇到較困難任務時，私語可能增加，以協助認知調節。"],"tags":["Vygotsky","社會語言","私我語言","內在語言"],"trap":"不應把自言自語一概視為沒有社會功能或故意干擾。","source":"教師課堂投影片","related":[]},{"id":"5-07","chapter":5,"title":"Piaget 與 Vygotsky 的語言觀比較","lead":"兩位學者都重視兒童語言，但對自我中心語言的功能有不同詮釋。","points":["Piaget：自我中心語言反映早期難以充分考慮他人觀點，隨社會化而改變。","Vygotsky：私語是外在社會語言逐漸內化、幫助自我調節的過渡歷程。","比較時應對照：語言與認知的先後關係、自言自語的功能、發展方向。"],"tags":["Piaget","Vygotsky","自我中心語言","私語"],"trap":"名稱相近不代表兩人對其功能的解釋相同。","source":"教師課堂投影片","related":[]},{"id":"5-08","chapter":5,"title":"影響語言發展：腦、社會互動與經驗","lead":"語言的發展仰賴神經成熟，也依賴回應性的人際互動。","points":["大腦成熟與可塑性支持早期語言能力發展。","照顧者回應、輪流對話、示範與共讀提供語言經驗。","兒童導向話語（parentese）可透過清楚的語音與互動節奏，支持幼兒注意與理解。","雙語環境可能出現語碼混合及語碼轉換，應在情境與發展脈絡中理解。","親子共讀、開放式提問與多元性別表述也是課堂的教育應用。"],"tags":["大腦成熟","社會互動","兒童導向話語","雙語","親子共讀"],"trap":"雙語語碼混合不宜直接視為語言發展缺陷。","source":"教師課堂投影片","related":[]}];

卷複核。"},{"id":"109-MC-03","chapter":2,"noteId":"2-06","type":"past","source":"歷屆教師資格考試","year":"109年","num":3,"stem":"小明上課吵鬧不停，老師不准他下課時間到教室外面玩。爾後要求他安靜上課，若小明\n不再吵鬧就取消他不准出去玩的禁令，此時老師主要是運用下列何種策略？","options":{"A":"負增強","B":"正增強","C":"消弱","D":"懲罰"},"answer":"A","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-10","chapter":2,"noteId":"2-07","type":"past","source":"歷屆教師資格考試","year":"109年","num":10,"stem":"根據班度拉(A. Bandura)的交互決定論(reciprocal determinism)，探討行為必須了解以下\n哪三者的交互影響？","options":{"A":"個人、行為與環境","B":"遺傳、文化與行為","C":"個人、歷史與行為","D":"行為、歷史與環境"},"answer":"A","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-11","chapter":2,"noteId":"2-03","type":"past","source":"歷屆教師資格考試","year":"109年","num":11,"stem":"六年級的小娟這次段考成績不佳，於是努力練習跑步，希望在即將到來的運動會中有\n優異的成績表現。小娟的這種行為最符合下列何種防衛機轉？","options":{"A":"投射(projection)","B":"壓抑(suppression)","C":"替代(displacement)","D":"合理化(rationalization)"},"answer":"C","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-23","chapter":2,"noteId":"2-08","type":"past","source":"歷屆教師資格考試","year":"109年","num":23,"stem":"有關皮亞傑(J. Piaget)對認知改變的想法，下列敘述何者錯誤？","options":{"A":"基模是指可以被重複及類化的行為模式","B":"認知平衡是透過同化與調適達成一種穩定狀態","C":"兒童是主動建構形成一套有組織的心智運思結構","D":"調適是指利用原有的基模去詮釋外在世界新的經驗"},"answer":"D","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-24","chapter":2,"noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"109年","num":24,"stem":"根據維高思基(L. S. Vygotsky)的社會文化論，下列敘述何者錯誤？","options":{"A":"以鷹架搭建協助兒童學習新的知能","B":"語言發展有助於兒童的思考心智活動及行為","C":"兒童面臨較困難任務時，其私我語言便會減少","D":"兒童的學習發生於近側發展區(Zone of Proximal Development, ZPD)"},"answer":"C","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"110-MC-13","chapter":2,"noteId":"2-12","type":"past","source":"歷屆教師資格考試","year":"110年","num":13,"stem":"下列哪一種情況最能說明羅吉斯(C. Rogers)「無條件的正向關懷和接納」？","options":{"A":"只要小萱表現良好，父母都會特別讚賞，並立即給予肯定的話語或獎品","B":"小萱把咖哩倒在客廳的新地毯上，父母不但沒有表現出生氣，還說她做得很好","C":"小萱和妹妹打架，弄傷了妹妹。爸媽告訴小萱雖然她做錯事，但仍然是他們的寶貝\n孩子","D":"小萱在學校不小心弄壞同學的貴重樂器。媽媽告訴小萱，只要以後不要再發生這種\n事，就還是媽媽的好孩子"},"answer":"C","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"110-MC-15","chapter":2,"noteId":"2-06","type":"past","source":"歷屆教師資格考試","year":"110年","num":15,"stem":"張老師發現用連續正增強的方式鼓勵曉方準時繳交家庭作業很有效，為了讓她轉化為\n自發性按時交作業，張老師應該採用下列何種方式？","options":{"A":"改用負增強","B":"立即停止增強","C":"增加正增強頻率","D":"改用間歇式增強"},"answer":"D","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"110-MC-18","chapter":2,"noteId":"2-09","type":"past","source":"歷屆教師資格考試","year":"110年","num":18,"stem":"如果兒童知道小明拿到的耶誕禮物數量多於小華，且小華的禮物數量多於小宣。他就\n能夠瞭解小明拿的禮物最多。表示他具備下列哪一種概念？","options":{"A":"分類","B":"去集中化","C":"後設認知","D":"遞移推論"},"answer":"D","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"111-MC-01","chapter":2,"noteId":"2-04","type":"past","source":"歷屆教師資格考試","year":"111年","num":1,"stem":"依據艾瑞克森(E. Erikson)的心理社會發展理論，下列何者是學齡期兒童發展的核心\n議題？","options":{"A":"勤奮對自卑(industry vs. inferiority)","B":"自動自發對內疚(initiative vs. guilt)","C":"自主對羞愧懷疑(autonomy vs. shame and doubt)","D":"自我認同對角色混淆(identity vs. role confusion)"},"answer":"A","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"111-MC-08","chapter":2,"noteId":"2-06","type":"past","source":"歷屆教師資格考試","year":"111年","num":8,"stem":"育之把自己的座位弄得髒亂不堪，老師除了請他把座位清理乾淨，還要求他把教室\n打掃一遍。這是下列何種機制的應用？","options":{"A":"負增強","B":"饜足法","C":"反應代價","D":"過度矯正"},"answer":"D","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"111-MC-15","chapter":2,"noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"111年","num":15,"stem":"皮亞傑(J. Piaget)與維高思基(L. S. Vygotsky)對於兒童「自言自語」的行為，提出了\n不同的觀點，下列敘述何者錯誤？","options":{"A":"皮亞傑認為這是兒童自我中心的一種表現","B":"維高思基認為內在對話能力是高層次認知歷程的發展特徵","C":"皮亞傑認為兒童自言自語的行為反映兒童認知發展尚未成熟","D":"維高思基認為當工作變得比較難時，兒童自言自語的表現會減少"},"answer":"D","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"111-MC-20","chapter":2,"noteId":"2-09","type":"past","source":"歷屆教師資格考試","year":"111年","num":20,"stem":"下列哪位兒童的認知發展最有可能已經進入形式運思期？","options":{"A":"小忠能夠控制變因，找出影響鐘擺速度的因素","B":"小美將鉛筆盒中的筆按照長短排列，並加以分類","C":"小花能理解毛毛蟲轉變成蛹再轉變成蝴蝶的歷程","D":"小明知道液體從A 杯倒入B 杯，體積仍不會改變"},"answer":"A","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"112-MC-06","chapter":2,"noteId":"2-12","type":"past","source":"歷屆教師資格考試","year":"112年","num":6,"stem":"下列哪些是個人中心學派治療關係的要件？\n甲、同情心\n乙、真誠一致\n丙、積極鼓勵\n丁、無條件積極關注","options":{"A":"甲乙","B":"甲丁","C":"乙丙","D":"乙丁"},"answer":"D","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"112-MC-10","chapter":2,"noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"112年","num":10,"stem":"小英這次閱讀測驗考了65 分，遠低於全班的平均成績，所以林老師讓他放學後留下\n接受課後輔導。老師使用交互教學法(reciprocal teaching) 教小英摘要與提問等閱讀\n策略，並逐漸將責任轉移給小英。小英在一週後重寫相同測驗的複本，得到了85 分。\n根據以上的情境，下列敘述何者錯誤？","options":{"A":"老師的作法符合維高思基(L. Vygotsky) 的社會文化論","B":"老師提供的鷹架(scaffolding) 有助於提升小英的閱讀表現","C":"85 分代表小英的近側發展區(zone of proximal development, ZPD)","D":"65 分可視為小英近側發展區(zone of proximal development, ZPD) 的下限"},"answer":"C","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"112-MC-14","chapter":2,"noteId":"2-06","type":"past","source":"歷屆教師資格考試","year":"112年","num":14,"stem":"根據行為學派的理論，老師輔導學生從事學習時，運用哪種增強方式較有效？","options":{"A":"當學生進步時，提高增強的頻率","B":"整個過程皆應使用立即與持續的增強","C":"一開始先持續性增強，之後再間歇性增強","D":"一開始先間歇性增強，之後再持續性增強"},"answer":"C","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"113-MC-13","chapter":2,"noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"113年","num":13,"stem":"張老師發現一年級的小恩在數學考試時會喃喃自語。根據維高斯基(L. Vygotsky)對認知\n發展的看法，下列關於小恩行為的解釋何者較適切？","options":{"A":"兒童自我中心的表現","B":"在運用語言幫助思考","C":"在透過複誦提取記憶","D":"因為無法集中注意力"},"answer":"B","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"114-MC-03","chapter":2,"noteId":"2-12","type":"past","source":"歷屆教師資格考試","year":"114年","num":3,"stem":"老師持續傾聽，讓學生表達感受。這樣的輔導方式符合羅吉斯(C. Rogers)人本學派的\n哪一個概念？","options":{"A":"賦能","B":"普同感","C":"同理心","D":"無條件積極關注"},"answer":"D","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"114-MC-13","chapter":2,"noteId":"2-07","type":"past","source":"歷屆教師資格考試","year":"114年","num":13,"stem":"小元在班級討論中分享自己的想法，卻遭到部分同學嘲笑，此後其他同學變得不太\n願意公開表達意見。依據班度拉(A. Bandura)的社會學習理論，下列何者最能解釋此一\n現象？","options":{"A":"模仿學習","B":"直接增強","C":"社會性增強","D":"替代性懲罰"},"answer":"D","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"115-MC-06","chapter":2,"noteId":"2-10","type":"past","source":"歷屆教師資格考試","year":"115年","num":6,"stem":"小華在解數學題時總是會喃喃自語，讓鄰座同學感到困擾。根據維高斯基\n(L. Vygotsky)的理論，下列敘述何者正確？","options":{"A":"小華的自我中心讓他會自言自語","B":"小華是為了引起注意而故意發出聲音","C":"小華是在使用語言進行認知自我調整","D":"小華欠缺自我控制不發出聲音的能力"},"answer":"C","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"115-MC-15","chapter":2,"noteId":"2-06","type":"past","source":"歷屆教師資格考試","year":"115年","num":15,"stem":"為鼓勵小平發言，剛開始時只要小平舉手，老師就會點他並給予正向回饋。後來，\n即使小平舉手，老師也不一定會點他，但平均舉手3 次，就會點他1 次。老師的增強\n時制從連續改為下列何者？","options":{"A":"固定時距時制","B":"變動時距時制","C":"固定比率時制","D":"變動比率時制"},"answer":"D","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"115-MC-21","chapter":2,"noteId":"2-08","type":"past","source":"歷屆教師資格考試","year":"115年","num":21,"stem":"關於認知發展理論的敘述，下列何者正確？\n甲、皮亞傑(J. Piaget)認為兒童會主動建構認知結構\n乙、行為學派認為兒童認知結構是靠後天文化與學習歷程而建構\n丙、布魯納(J. Bruner)認為兒童是主動求知者，教育則可以促進認知發展\n丁、維高斯基(L. Vygotsky)認為兒童在認知發展過程中不具自主性，而是靠外在環境\n建構認知","options":{"A":"甲乙","B":"乙丁","C":"丙丁","D":"甲丙"},"answer":"D","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"115-MC-22","chapter":2,"noteId":"2-07","type":"past","source":"歷屆教師資格考試","year":"115年","num":22,"stem":"下列哪一個例子最能完整反映班度拉(A. Bandura)的三元交互因果關係？","options":{"A":"小安的數學老師很鼓勵她多做數學題，並且適時給予獎勵和輔導，這讓小安的數學\n能力越來越好","B":"父母經常讚美小辰在學習上的努力，不但讓小辰對學習更有信心，也讓她調整了\n自己的學習目標","C":"小惠具備高學業自我效能，因而努力學習，使得成績優異，獲得老師的讚美後\n他更認真學習，對學業也更有信心","D":"小佑對下週段考的成績表現有高度期望，因此努力準備考試，他的努力不但得到\n老師的高度讚美，也讓父母讚不絕口"},"answer":"C","context":"","page":6,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-05","chapter":4,"noteId":"4-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":5,"stem":"學齡兒童大腦中的哪一個腦區組織會持續地和周圍的皮質建立聯結，因而提升記憶和\n空間能力？","options":{"A":"杏仁核","B":"海馬迴","C":"下視丘","D":"網狀結構"},"answer":"B","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-12","chapter":4,"noteId":"4-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":12,"stem":"國小一年級的小惠常常喜歡鬧脾氣，動不動就哭喪著臉要求爸媽及兄姊順她的意，\n聽不懂也不願意接受大人的勸慰；然而四年級的姊姊小珠則善於察言觀色、表現出\n較合宜的心情反應與行為，不像小惠那樣無理取鬧。有關這對姊妹上述行為現象的\n腦神經發展之解釋，下列何者最正確？","options":{"A":"姊姊小珠的枕葉視覺區發展較妹妹小惠好，所以善於察言觀色","B":"妹妹小惠的威尼克區(Wernicke’s area)受損，所以聽不懂別人的話","C":"妹妹小惠的杏仁核與前額葉間的連結與髓鞘化程度不及姊姊小珠，所以情緒掌控\n能力較差","D":"姊姊小珠的大腦側化較妹妹小惠完整，所以左右兩大腦半球較獨立運作，感性與\n理性較不衝突"},"answer":"C","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-20","chapter":4,"noteId":"4-05","type":"past","source":"歷屆教師資格考試","year":"106年","num":20,"stem":"有關大腦皮質左右側功能的描述，下列何者正確？\n甲、左側腦擅長整體式訊息處理；右側腦擅長序列式訊息處理\n乙、左側腦負責大部分正向情緒；右側腦負責大部分負向情緒\n丙、左側腦負責較多語法功能；右側腦負責較多語用功能\n丁、左側腦負責空間能力；右側腦負責邏輯推理","options":{"A":"甲乙","B":"乙丙","C":"丙丁","D":"甲丁"},"answer":"B","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-26","chapter":4,"noteId":"4-03","type":"past","source":"歷屆教師資格考試","year":"106年","num":26,"stem":"小明認為需要在便條紙上記下電話號碼，最可能與下列哪一個腦區的發展比弟弟\n更成熟有關？","options":{"A":"額葉(frontal lobe)","B":"頂葉(parietal lobe)","C":"顳葉(temporal lobe)","D":"枕葉(occipital lobe)"},"answer":"A","context":"25-26 為題組\n閱讀下文後，回答25-26 題。\n媽媽請小明幫忙打電話提醒阿姨晚上要一起吃飯，當媽媽告訴小明阿姨的電話\n號碼時，小明一面反覆唸著電話號碼，一面找便條紙把號碼記下來。弟弟很好奇為什麼\n需要在便條紙上記下電話號碼，小明告訴弟弟，因為不趕緊記下來，沒多久就會忘記。","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"1081-MC-07","chapter":4,"noteId":"4-08","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":7,"stem":"有關肥胖兒童的敘述，下列何者正確？","options":{"A":"睡眠不足會增加肥胖的可能性","B":"兒童期的肥胖問題不致影響其長期的健康","C":"相較於較瘦的兒童，肥胖兒童的自尊較高","D":"兒童的基礎代謝率高，即使久坐也不致肥胖"},"answer":"A","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"1081-MC-26","chapter":4,"noteId":"4-04","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":26,"stem":"國小六年級的小安一直還記得在幼兒園放學回家時，在巷口被一隻黑狗猛叫窮追，\n因此他每到巷口時就感到害怕，產生「一朝被蛇咬、十年怕草繩」的現象。小安的\n反應與下列哪些腦區的功能最相關？","options":{"A":"松果體","B":"腦下垂體","C":"視丘與下視丘","D":"海馬迴與杏仁核"},"answer":"D","context":"","page":6,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"1081-MC-30","chapter":4,"noteId":"4-03","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":30,"stem":"小方的表現與大腦中哪一區塊的功能關係最密切？","options":{"A":"頂葉","B":"枕葉","C":"額葉","D":"顳葉"},"answer":"C","context":"29-30 為題組\n閱讀下文後，回答29-30 題。\n十歲的小方收下自己不喜歡的生日禮物後，即使並不開心，仍微笑著向對方道謝。","page":6,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"1082-MC-11","chapter":4,"noteId":"4-08","type":"past","source":"歷屆教師資格考試","year":"108年第2次","num":11,"stem":"有關兒童生理轉變的敘述，下列何者錯誤？","options":{"A":"生長速率及性成熟的時間，男孩和女孩都有明顯的個別差異","B":"平均而言，已開發國家兒童的體型，比開發中國家兒童高大","C":"近百年來，女 em":"下列哪一項敘述較能說明青少年「不顧風險在懸崖邊自拍」的行為？","options":{"A":"處理高層次認知判斷的前額葉尚未發展成熟","B":"知覺集中傾向導致青少年容易忽視活動的風險","C":"後設認知的提升導致青少年認為自己不容易受傷","D":"掌管情緒經驗與感官刺激的邊緣系統尚未發展成熟"},"answer":"A","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"114-MC-01","chapter":4,"noteId":"4-03","type":"past","source":"歷屆教師資格考試","year":"114年","num":1,"stem":"小朱一年級時，只要心情不好就會哭鬧或罵人。升上五年級後，他心情不好時已能用\n深呼吸讓自己平靜下來。請問，小朱的轉變跟大腦哪一部分的成熟比較有關？","options":{"A":"松果體","B":"胼胝體","C":"前額葉","D":"海馬迴"},"answer":"C","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-03","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":3,"stem":"小靜對於注音符號中的「ㄓㄗ」、「ㄔㄘ」總是分不清楚，此顯示她有哪一項語言\n層面的問題？","options":{"A":"語義","B":"語用","C":"語法","D":"語音"},"answer":"D","context":"","page":2,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-17","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":17,"stem":"兒童聽到「獵人帶著弓箭上山去了；山上野兔很多；一隻野兔橫屍草叢裡。」的語句\n之後，認為野兔是獵人所殺。此種語言推論能力與下列何者最有關聯？","options":{"A":"快速配對(fast mapping)","B":"代碼轉換(code switching)","C":"後設語言覺察(metalinguistic awareness)","D":"語法線索覺察(syntactical bootstrapping awareness)"},"answer":"C","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"106-MC-21","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"106年","num":21,"stem":"有關學齡階段兒童語言理解能力的敘述，下列何者正確？","options":{"A":"兒童的語意整合能力還不足以進行語言推論，所以聽不懂弦外之音","B":"兒童的語音察覺和閱讀成就之間沒有明顯的相關，但是與社會階層的差異有關","C":"兒童的構詞知識尚未成熟，句子中若有不熟悉的字詞，就無法理解句子段落的意思","D":"兒童可以聽出沒有直接顯現的隱藏意義。例如聽懂「天啊！你今天可真安靜」這句\n話裡的嘲諷意思"},"answer":"D","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"1081-MC-21","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"108年第1次","num":21,"stem":"八歲的小欣聽到三歲的弟弟指著小狗說：「跳舞可愛」時，馬上回應弟弟：「對！\n狗狗跳舞很可愛」。小欣修正弟弟語言表達的方式，稱為下列何者？","options":{"A":"重述(recast)","B":"擴張(expansion)","C":"句法提攜(syntactic bootstrapping)","D":"語義提攜(semantic bootstrapping)"},"answer":"B","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-13","chapter":5,"noteId":"5-05","type":"past","source":"歷屆教師資格考試","year":"109年","num":13,"stem":"依據兒童語言發展的理論，下列何者不正確？","options":{"A":"行為主義學派主張語言發展是後天學習，以模仿及增強來說明語言發展的過程","B":"杭士基(A. Chomsky)先天論認為兒童有能力將語詞組合，形成一套有系統的語法規則","C":"互動論結合先天論與學習論的觀點，主張語言發展由成熟、認知發展與社會互動的\n環境相互影響","D":"認知建構學者認同語言發展與兒童的思考、創造力、問題解決能力相關，強調人類\n具有「語言習得機制」"},"answer":"D","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"109-MC-21","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"109年","num":21,"stem":"甲生和乙生同時都聽到丙生說：「地上有玩具，小花沒看到玩具，小花跌倒了。」\n甲生和乙生都說小花被玩具絆倒了。老師問為什麼？甲生表示丙生的話語中有提到\n這件事情，而乙生表示這是自己推論出來的結果。下列敘述何者最為適切？","options":{"A":"乙生比甲生更過度規則化","B":"乙生比甲生更能整合語意","C":"甲生比乙生更具後設語言覺察","D":"甲生比乙生更能聽出弦外之音"},"answer":"B","context":"","page":5,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"110-MC-07","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"110年","num":7,"stem":"小華分不出「ㄥ」和「ㄣ」的差別，請問小華缺乏何種能力？","options":{"A":"辨識文字","B":"語意理解","C":"語言理解","D":"聲韻覺識"},"answer":"D","context":"","page":3,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"111-MC-25","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"111年","num":25,"stem":"陳老師是國小一年級的導師。有一天，班上小朋友非常吵鬧，陳老師很生氣地說：\n「你們的聲音快把屋頂掀掉了！」小朋友看著屋頂滿臉疑惑的說：「屋頂好好的啊！」\n針對小朋友的反應，下列解釋何者較為正確？","options":{"A":"學生對陳老師這麼說很不高興，所以故意說那些話氣陳老師","B":"這班學生可能在語言上有發展遲緩的現象，才會聽不懂陳老師的話","C":"當時班上實在太吵了，學生沒有注意陳老師說什麼，所以聽不懂老師的話","D":"理解比喻和反諷語的發展年齡較晚，小一學生聽不懂陳老師的話是正常的"},"answer":"D","context":"","page":6,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"114-MC-17","chapter":5,"noteId":"5-04","type":"past","source":"歷屆教師資格考試","year":"114年","num":17,"stem":"國小兒童能夠理解一個字詞可能有多重意義，能理解嘲諷的語言，且在敘事時能提供\n充分且明確的訊息幫助別人理解，最主要是因為在學齡期哪一項能力的改變所致？","options":{"A":"詞彙量大幅增長","B":"工作記憶容量加大","C":"語用覺識能力增強","D":"知道更多語法規則"},"answer":"C","context":"","page":4,"explanation":"依官方公布選擇題參考答案判定；可返回相關知識筆記進行概念複習。","review":"原題文字為 PDF 擷取，尚待逐題與原卷複核。"},{"id":"C-001","chapter":1,"noteId":"1-01","type":"course","source":"依課堂筆記編寫（非正式考古題）","year":"課堂練習","num":1,"stem":"下列哪一項最貼近「心理社會發展」的研究範圍？","options":{"A":"身高、體重與肌肉力量","B":"注意力、記憶與語言","C":"情緒、人格與人際關係","D":"腦神經與感官成熟"},"answer":"C","context":"","page":null,"explanation":"心理社會發展著重情緒、人格與社會關係。","review":"依已取得課堂教材概念編寫。"},{"id":"C-002","chapter":1,"noteId":"1-04","type":"course","source":"依課堂筆記編寫（非正式考古題）","year":"課堂練習","num":2,"stem":"下列何者最能表達「敏感期」與「關鍵期」的差異？","options":{"A":"敏感期通常指對特定經驗更易回應，未必完全不可逆","B":"敏感期只出現在成年","C":"關鍵期和敏感期意思完全一致","D":"錯過敏感期後一定無法學習"},"answer":"A","context":"","page":null,"explanation":"敏感期強調較佳回應時機，不宜認定錯過後完全不可能學習。","review":"依已取得課堂教材概念編寫。"},{"id":"C-003","chapter":1,"noteId":"1-05","type":"course","source":"依課堂筆記編寫（非正式考古題）","year":"課堂練習","num":3,"stem":"哪一個例子最能說明 Baltes 的「多方向性」？","options":{"A":"同一人在不同能力上同時有進步與退步","B":"所有人在固定年齡做一樣的事","C":"認知和社會發展沒有關係","D":"發展只發生在幼兒期"},"answer":"A","context":"","page":null,"explanation":"多方向性包含增益與損失並存。","review":"依已取得課堂教材概念編寫。"},{"id":"C-004","chapter":2,"noteId":"2-05","type":"course","source":"依課堂筆記編寫（非正式考古題）","year":"課堂練習","num":4,"stem":"古典制約建立後，原本中性的鈴聲能引發唾液反應，鈴聲稱作？","options":{"A":"非制約刺激","B":"制約刺激","C":"非制約反應","D":"增強物"},"answer":"B","context":"","page":null,"explanation":"原中性刺激經配對後能引發制約反應，就成為制約刺激（CS）。","review":"依已取得課堂教材概念編寫。"},{"id":"C-005","chapter":2,"noteId":"2-06","type":"course","source":"依課堂筆記編寫（非正式考古題）","year":"課堂練習","num":5,"stem":"某學生交作業後，老師取消原本讓他多做的清掃工作，學生更常交作業。此為？","options":{"A":"正增強","B":"負增強","C":"正懲罰","D":"負懲罰"},"answer":"B","context":"","page":null,"explanation":"移除嫌惡後果使交作業增加，屬於負增強。","review":"依已取得課堂教材概念編寫。"},{"id":"C-006","chapter":2,"noteId":"2-10","type" window.ESSAYS=[{"id":"110-SA-01","chapter":2,"year":"110年","num":1,"stem":"比較維高斯基(L. Vygotsky)與皮亞傑(J. Piaget)的理論觀點在認知發展階段、認知成長\n機制，以及影響認知發展因素上的差異。(10 分)\n將下列表格繪製於答案卷，並於答案卷的表格內作答。\n理論觀點\n維高斯基\n皮亞傑\n認知發展階段\n認知成長機制\n影響認知發展因素","context":"","source":"03_110國民小學_學習者發展與適性輔導(試題本)(1).pdf","page":7,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"},{"id":"112-SA-01","chapter":2,"year":"112年","num":1,"stem":"王老師在教六年級的柱體與錐體時，發現班上有些孩子已經可以熟練地從展開圖對應\n到正確的形狀，有些孩子卻無法做到。根據皮亞傑(J. Piaget) 的認知發展論，此時期\n的學童大多在具體運思期階段過渡到形式運思期階段，請針對具體運思期與形式運思\n期各舉出三個思考特徵(6 分)。試針對王老師班上發展落後學生的特徵，建議兩種可能\n的教學做法(4 分)。","context":"","source":"9-1_112國民小學_學習者發展與適性輔導(試題本)_正卷.pdf","page":7,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"},{"id":"113-SA-02","chapter":2,"year":"113年","num":2,"stem":"馬老師教「時間單位的換算」時，先詢問已學過的日、時、分、秒等時間單位的關係，\n再進入正式教學活動：先利用一系列提問引導學生解決問題；再由不同能力學生組成\n的小組討論解決類似題並進行小組分享；最後由學生獨立解題，教師再給予回饋；回家\n作業則指定「數學日記」，讓學生紀錄今天討論了什麼、學到什麼、哪裡不懂。\n(1)請解釋布魯納等學者(Bruner, Ross & Wood, 1976)所提出的鷹架作用，並說明馬老師\n教學歷程符合鷹架作用之處。(4 分)\n(2)從馬老師的作法，指出其符合維高思基(L. Vygotsky)理論的二項重要概念或觀點，並\n說明之。(6 分)","context":"","source":"9-1_113國民小學_學習者發展與適性輔導(試題本)_正卷_浮水印(1).pdf","page":6,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"},{"id":"1082-SA-04","chapter":5,"year":"108年第2次","num":4,"stem":"國小高年級兒童的語言發展，在語音上已可覺察語詞裡所有音素，並能如成人般正確\n發出字音。請列舉另外三個語言成分，並說明此時期兒童在此三個成分上的發展情形。","context":"","source":"108-2國民小學-兒童發展與輔導.pdf","page":7,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"},{"id":"115-SA-01","chapter":2,"year":"115年","num":1,"stem":"陳老師是一位國小三年級的班導師。她注意到班上有些學生在課業上覺得吃力，因而\n感到擔憂。根據艾瑞克森(E. Erikson)的理論說明陳老師為什麼擔憂(4 分)。寫出兩項\n陳老師如何幫助學生渡過這階段危機的策略，並說明其具體做法(6 分)。","context":"","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"},{"id":"115-SA-02","chapter":2,"year":"115年","num":2,"stem":"在一次課堂討論中，小凱提出了與多數同學不同的想法。小林立刻回應：「你怎麼會\n想出這麼蠢的點子？」旁邊兩三位同學立刻附和說：「對啊！你自以為很厲害，\n但每次都講得很爛！」小凱當下愣住，臉色變得很難看。其他同學見狀也紛紛不敢再\n表達想法。\n(1)根據社會學習理論的兩項機制，分別說明上述學習情境中言語攻擊事件對班級學生\n行為可能產生的影響。(4 分)\n(2)根據前題的分析，為了促進安全友善的討論環境，提出兩項教師可採取的具體做法。\n(6 分)","context":"","source":"115_國民小學_學習者發展與適性輔導(試題本)_公布用(1).pdf","page":7,"status":"官方非選擇題參考解答未附；請自行練習並以課堂資料校對。"}];

function render(){switch(state.page){case'dashboard':$('page').innerHTML=dashboard();break;case'notes':$('page').innerHTML=noteView();break;case'gallery':$('page').innerHTML=gallery();bindGalleryImages();break;case'quiz':$('page').innerHTML=renderQuiz();break;case'mistakes':$('page').innerHTML=mistakes();break;case'essays':$('page').innerHTML=essayView();break;case'settings':$('page').innerHTML=settings();break}document.title=keyTitles[state.page]+'｜兒童發展・期中複習站'}
function startQuiz(list){let arr=list||Q.filter(q=>(!state.quizChapter||q.chapter===state.quizChapter)&&(state.quizType==='all'||q.type===state.quizType));if(!arr.length){toast('目前篩選條件下沒有題目，請試試「第一至第五章・全部」及「全部來源」。');return}if(!list){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}arr=arr.slice(0,state.quizCount===99?999:state.quizCount)}state.quiz=[...arr];state.quizSelected={};state.quizIdx=0;state.quizFinal=false;state.page='quiz';nav('quiz')}
function finishQuiz(){if(!state.quiz)return;const num=Object.keys(state.quizSelected).length;if(state.quizMode==='mock'&&num<state.quiz.length&&!confirm(`還有 ${state.quiz.length-num} 題未作答，確定交卷？`))return;markAttempts();state.quizFinal=true;render()}
function gotoNote(id){const n=note(id);if(!n){toast('尚無對應筆記');return}state.chapter=n.chapter;state.noteSearch='';state.expanded.add(n.id);nav('notes');setTimeout(()=>document.querySelector('[data-note="'+id+'"]')?.scrollIntoView({behavior:'smooth',block:'nearest'}),70)}
async function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject('indexedDB not available');const r=indexedDB.open('childdev-midterm-images',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function imageReadAll(){try{const db=await openDB();const keys=await new Promise((resolve,reject)=>{const x=db.transaction('images','readonly').objectStore('images').getAllKeys();x.onsuccess=()=>resolve(x.result);x.onerror=()=>reject(x.error)});for(const key of keys){const v=await new Promise((resolve,reject)=>{const x=db.transaction('images','readonly').objectStore('images').get(key);x.onsuccess=()=>resolve(x.result);x.onerror=()=>reject(x.error)});if(v)state.images[key]=v}db.close()}catch(err){/* private browsing or restrictive browser */}}
async function imagePut(id,data){const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(data,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();state.images[id]=data}

function preview(id){const item=G.find(x=>x.id===id);if(!item)return;const src=state.images[id];$('modalRoot').innerHTML=`<div class="modal-back" data-act="closeModal"><div class="modal-card" role="dialog" aria-modal="true" aria-label="圖片筆記預覽"><div class="modal-head"><strong>${e(item.title)}</strong><button class="icon-btn" data-act="closeModal" aria-label="關閉預覽">×</button></div>${src?`<img class="modal-photo" alt="${e(item.title)}" src="${src}">`:'<div class="empty">尚未匯入圖片。請使用卡片上的「匯入圖卡」選取已定稿原圖。</div>'}</div></div>`}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const act=(name,v)=>{
 switch(name){
 case'goto':nav(v);break;case'openChapter':state.chapter=Number(v);state.noteSearch='';nav('notes');break;
 case'setChapter':state.chapter=Number(v);state.noteSearch='';render();break;
 case'galleryChapter':state.galleryChapter=Number(v);render();break;
 case'expand':state.expanded.has(v)?state.expanded.delete(v):state.expanded.add(v);render();break;
 case'markDone':saved.completed=saved.completed.includes(v)?saved.completed.filter(x=>x!==v):[...saved.completed,v];persist();render();break;
 case'noteQuiz':{const arr=Q.filter(x=>x.noteId===v);if(!arr.length){toast('目前尚未對應到本單元的考題，可改練整章。');state.quizChapter=note(v)?.chapter||0;nav('quiz')}else{state.quizMode='practice';startQuiz(arr)}break}
 case'gotoNote':gotoNote(v);break;
 case'startQuiz':state.quizChapter=Number($('qChapter').value);state.quizType=$('qType').value;state.quizCount=Number($('qCount').value);state.quizMode=$('qMode').value;startQuiz();break;
 case'answer':{if(!state.quiz||state.quizFinal)return;const q=state.quiz[state.quizIdx];if(state.quizMode==='practice'&&state.quizSelected[q.id])return;state.quizSelected[q.id]=v;render();break}
 case'prevQ':state.quizIdx=Math.max(0,state.quizIdx-1);render();break;
 case'nextQ':if(state.quizIdx===state.quiz.length-1){finishQuiz()}else{state.quizIdx++;render()}break;
 case'finishQuiz':finishQuiz();break;
 case'restartQuiz':{const list=[...state.quiz];startQuiz(list);break}
 case'resetQuiz':state.quiz=null;state.quizFinal=false;render();break;
 case'bookmark':saved.bookmarked=saved.bookmarked.includes(v)?saved.bookmarked.filter(x=>x!==v):[...saved.bookmarked,v];persist();render();break;
 case'mistakeTab':state.mistakeTab=v;render();break;
 case'retryWrong':{const ids=wrongIds();if(!ids.length)return;state.quizMode='practice';startQuiz(Q.filter(x=>ids.includes(x.id)));break}
 case'singleQuiz':{const q=Q.find(x=>x.id===v);if(q){state.quizMode='practice';startQuiz([q])}break}
 case'upload':state.activeUpload=v;$('imageUpload')?.click();break;
 case'preview':preview(v);break;
 case'closeModal':$('modalRoot').innerHTML='';break;
 case'toggleTheme':setTheme(saved.theme==='dark'?'light':'dark');render();break;
 case'export':downloadJSON({app:'childdev-midterm',version:1,progress:saved,images:state.images},'兒童發展_期中複習_個人紀錄.json');toast('已準備下載備份');break;
 case'import':$('importFile')?.click();break;
 case'clear':if(confirm('確定清除所有已讀、答題、收藏及申論草稿？此動作無法復原。')){saved={completed:[],bookmarked:[],attempts:{},essayText:{},theme:saved.theme};persist();render();toast('已清除學習紀錄')}break;
 }
};
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-act]');if(btn){if(btn.dataset.act==='closeModal'&&ev.target!==btn&&!ev.target.closest('.icon-btn'))return;act(btn.dataset.act,btn.dataset.v)}const navB=ev.target.closest('[data-page]');if(navB)nav(navB.dataset.page)});
document.addEventListener('input',ev=>{if(ev.target.id==='noteSearch'){const v=ev.target.value;const pos=ev.target.selectionStart;state.noteSearch=v;render();const n=$('noteSearch');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch{}}}else if(ev.target.dataset.essay){saved.essayText[ev.target.dataset.essay]=ev.target.value;persist()}});
document.addEventListener('change',async ev=>{if(ev.target.id==='imageUpload'&&ev.target.files?.[0]){const file=ev.target.files[0];if(file.size>7*1024*1024){toast('圖片太大，建議小於 7 MB。');return}const reader=new FileReader();reader.onload=async()=>{try{await imagePut(state.activeUpload,reader.result);render();toast('圖片已儲存到本機圖卡庫')}catch{toast('此瀏覽器無法儲存圖片，請改用一般瀏覽模式。')}};reader.readAsDataURL(file)}else if(ev.target.id==='importFile'&&ev.target.files?.[0]){try{const j=JSON.parse(await ev.target.files[0].text());if(j.app!=='childdev-midterm'||!j.progress)throw Error('檔案格式不符');if(!confirm('匯入備份會取代現有紀錄，確定繼續？'))return;saved={...saved,...j.progress};persist();if(j.images){for(const [id,data] of Object.entries(j.images)){if(typeof data==='string'&&/^data:image\//.test(data))await imagePut(id,data)}}setTheme(saved.theme||'light');render();toast('學習紀錄已匯入')}catch(err){toast('匯入失敗：'+(err.message||err))}}});
$('navToggle').addEventListener('click',()=>{$('sidebar').classList.add('open');$('shade').hidden=false});$('navClose').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').hidden=true});$('shade').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('shade').hidden=true});$('themeToggle').addEventListener('click',()=>{setTheme(saved.theme==='dark'?'light':'dark');render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modalRoot').innerHTML=''});
render();imageReadAll().then(()=>{if(state.page==='gallery')render()});
})();

</script>
</body></html>
